<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10294D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ismail">
<title>Ismail — فیکٹری اسٹاک مینجمنٹ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  :root{
    --navy:#10294D;
    --navy-2:#1B3E73;
    --navy-soft:#EEF2F8;
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --border:#E4E1D6;
    --ink:#1A1A1A;
    --muted:#767267;
    --green:#1E7D4B;
    --red:#B23A2E;
    --orange:#E67E22;
    --purple:#8E44AD;
    --yellow:#F1C40F;
    --radius:16px;
    --font-scale:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Naskh Arabic', 'Segoe UI', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:calc(15px * var(--font-scale));
  }
  body.font-small{--font-scale:0.92;}
  body.font-medium{--font-scale:1;}
  body.font-large{--font-scale:1.15;}
  #app{
    max-width:480px;margin:0 auto;min-height:100vh;
    background:var(--bg);position:relative;
    padding-bottom:90px;
  }

  /* ====== Offline Banner ====== */
  .offline-banner{
    position:fixed;top:0;left:0;right:0;z-index:999;
    background:#B23A2E;color:#fff;
    padding:8px 16px;text-align:center;
    font-size:14px;font-weight:600;
    display:none;
  }
  .offline-banner.show{display:block;}

  /* ====== Topbar ====== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:14px 14px;
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    border-bottom:3px solid var(--navy-2);
    min-height:64px;
  }
  .topbar-btn{
    background:rgba(255,255,255,.12);
    border:none;color:#fff;
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    font-family:inherit;
  }
  .topbar-btn:active{background:rgba(255,255,255,.25);}
  .topbar-btn .material-icons-round{
    font-size:26px;color:#fff;
  }
  .topbar-title{
    flex:1;text-align:center;
    font-size:17px;font-weight:700;
    color:#fff;
    padding:0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar-profile .material-icons-round{
    font-size:30px;
  }

  /* ====== Bottom Bar ====== */
  .bottombar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:space-around;
    padding:8px 4px 10px;
    border-top:3px solid var(--navy-2);
    z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.15);
  }
  .bbtn{
    flex:1;
    background:transparent;border:none;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:2px;
    padding:6px 2px;
    cursor:pointer;
    font-family:inherit;
    transition:transform .12s;
    min-width:0;
  }
  .bbtn:active{transform:scale(.92);}
  .bbtn .material-icons-round{
    font-size:26px;
    color:#fff;
    opacity:.55;
    transition:all .2s;
  }
  .bbtn.active .material-icons-round{
    font-size:32px;
    opacity:1;
    color:#fff;
  }
  .bbtn.active{
    background:rgba(255,255,255,.08);
    border-radius:12px;
  }

  .content{padding:16px 14px 10px;}

  /* ====== Home ڈیش بورڈ ====== */
  .dash-section{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .dash-title{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 12px 0;
    display:flex;align-items:center;gap:8px;
  }
  .dash-title .material-icons-round{
    font-size:22px;color:var(--navy);
  }
  .dash-row{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px dashed var(--border);
    font-size:16px;
  }
  .dash-row:last-child{border-bottom:none;}
  .dash-row .label{
    color:var(--muted);
    font-size:15px;
    display:flex;align-items:center;gap:6px;
  }
  .dash-row .label .material-icons-round{
    font-size:20px;
    color:var(--muted);
  }
  .dash-row .value{
    font-weight:700;
    font-size:18px;
    font-family:'Poppins',sans-serif;
  }
  .dash-row .value.green{color:var(--green);}
  .dash-row .value.red{color:var(--red);}

  .dash-item{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .dash-item:last-child{border-bottom:none;}
  .dash-item .name{
    font-weight:600;
    color:var(--ink);
    font-size:16px;
  }
  .dash-item .info{
    color:var(--muted);
    font-size:14px;
  }
  .dash-item .amount{
    font-weight:700;
    font-family:'Poppins',sans-serif;
    font-size:17px;
    color:var(--navy);
  }

  /* ====== Buttons ====== */
  .primary-btn{
    width:100%;background:var(--navy);color:#fff;
    border:none;border-radius:12px;
    padding:16px;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .primary-btn:active{background:var(--navy-2);}
  .primary-btn .material-icons-round{font-size:22px;}
  .ghost-btn{
    width:100%;background:transparent;color:var(--navy);
    border:1.5px solid var(--navy);border-radius:12px;
    padding:13px;font-size:15.5px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .ghost-btn .material-icons-round{font-size:20px;}

  .section-title{
    font-size:16px;font-weight:700;
    color:var(--navy);margin:16px 0 10px;
  }

  /* ====== Search Box ====== */
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1.5px solid var(--border);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;
  }
  .search-box .material-icons-round{
    color:var(--muted);font-size:22px;
  }
  .search-box input{
    border:none;outline:none;flex:1;background:transparent;
    font-family:inherit;font-size:16px;color:var(--ink);
    padding:2px 0;
  }

  /* ====== Sel Grid ====== */
  .sel-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:12px;margin-bottom:16px;
  }
  .sel-btn{
    background:var(--navy);color:#fff;
    border:2px solid var(--navy-2);
    border-radius:14px;padding:20px 12px;
    font-family:inherit;font-size:17px;font-weight:700;
    cursor:pointer;text-align:center;
    line-height:1.4;
    min-height:80px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s;
    word-break:break-word;
  }
  .sel-btn:active{transform:scale(.96);}
  .sel-btn.active{
    background:#fff;color:var(--navy);
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy) inset;
  }

  /* ====== Balance Card (پرانا) — ہٹا دیں ====== */

  /* ====== Recent Table ====== */
  .recent-title{
    font-size:15px;font-weight:700;
    color:var(--navy);margin:18px 0 10px;
    display:flex;align-items:center;gap:6px;
  }
  .recent-title .material-icons-round{font-size:20px;}
  .recent-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .recent-table{
    width:100%;border-collapse:collapse;
    font-size:14px;direction:rtl;
    table-layout:fixed;
  }
  .recent-table thead tr{background:var(--navy);color:#fff;}
  .recent-table th{
    padding:11px 6px;text-align:center;font-weight:700;
    font-size:14px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .recent-table td{
    padding:12px 6px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:15px;
    font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .recent-table td.bal-pos{color:var(--green);font-weight:800;}
  .recent-table td.bal-neg{color:var(--red);font-weight:800;}

  /* ====== حساب مکمل بٹن ====== */
  .settle-top{
    width:100%;
    background:var(--navy-soft);
    color:var(--navy);
    border:1.5px dashed var(--navy-2);
    border-radius:12px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-bottom:14px;
  }
  .settle-top .material-icons-round{font-size:20px;}

  /* ====== Skeleton ====== */
  .skeleton-card{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:16px 14px;
    margin-bottom:10px;
  }
  .skeleton-line{
    height:14px;border-radius:7px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
    margin-bottom:10px;
  }
  .skeleton-line.short{width:60%;}
  .skeleton-line.medium{width:80%;}
  @keyframes skeletonShine{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .skeleton-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
  }
  .skeleton-box{
    height:80px;border-radius:14px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
  }

  /* ====== Loading spinner ====== */
  .loading-box{text-align:center;padding:30px 20px;color:var(--muted);font-size:15px;}
  .spinner{
    display:inline-block;width:34px;height:34px;
    border:3px solid var(--border);border-top-color:var(--navy);
    border-radius:50%;animation:spin 1s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ====== Form ====== */
  .form-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:14px 12px;margin-bottom:8px;
  }
  .form-grid .field.full{grid-column:1 / -1;}
  .field{margin-bottom:0;}
  .field label{
    display:block;font-size:14px;
    color:var(--ink);margin-bottom:7px;font-weight:700;
  }
  .field label .req{color:var(--red);}
  .field input{
    width:100%;padding:14px 14px;
    border:1.5px solid var(--border);border-radius:12px;
    font-family:inherit;font-size:16px;
    background:#fff;color:var(--ink);
    font-weight:600;
  }
  .field input.err{border-color:var(--red);}
  .field .errmsg{color:var(--red);font-size:13px;margin-top:5px;}

  /* ====== Records Table ====== */
  .records-header{
    display:flex;justify-content:space-between;
    align-items:center;margin-bottom:12px;gap:8px;
  }
  .records-header .info{font-size:15px;color:var(--muted);font-weight:600;}
  .save-btn{
    background:var(--navy-soft);color:var(--navy);
    border:1.5px solid var(--navy-2);border-radius:10px;
    padding:9px 14px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .save-btn .material-icons-round{font-size:18px;}

  .records-table-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .records-table{
    width:100%;border-collapse:collapse;
    font-size:14px;direction:rtl;
    table-layout:fixed;
  }
  .records-table thead tr{background:var(--navy);color:#fff;}
  .records-table th{
    padding:11px 6px;text-align:center;font-weight:700;
    font-size:14px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .records-table tbody tr{
    cursor:pointer;-webkit-tap-highlight-color:rgba(16,41,77,.1);
    user-select:none;
  }
  .records-table tbody tr:active{background:var(--navy-soft);}
  .records-table tbody tr.pressed{background:#FFE5B4 !important;}
  .records-table td{
    padding:12px 6px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:15px;
    font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .records-table td.bal-pos{color:var(--green);font-weight:800;}
  .records-table td.bal-neg{color:var(--red);font-weight:800;}

  /* ====== Overlays ====== */
  .overlay{
    position:fixed;inset:0;background:rgba(16,41,77,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .sheet-popup,.receipt-sheet{
    background:#fff;width:100%;max-width:480px;
    border-radius:22px 22px 0 0;
    padding:24px 20px 26px;max-height:88vh;overflow-y:auto;
  }
  .sheet-title{
    font-size:19px;font-weight:700;color:var(--navy);
    margin-bottom:16px;text-align:center;
  }
  .popup-btn{
    width:100%;padding:16px;margin-bottom:10px;
    border-radius:12px;font-family:inherit;
    font-size:16.5px;font-weight:700;
    cursor:pointer;border:none;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .popup-btn .material-icons-round{font-size:22px;}
  .popup-btn.edit{background:var(--navy);color:#fff;}
  .popup-btn.delete{background:var(--red);color:#fff;}
  .popup-btn.cancel{background:transparent;color:var(--muted);border:1.5px solid var(--border);}

  .info-msg{
    background:#FFF8E1;border:1.5px solid #FFE082;
    border-radius:12px;padding:16px 18px;margin:14px 0;
    font-size:15px;color:#5D4037;line-height:1.9;text-align:right;
  }

  /* ====== Receipt ====== */
  .receipt-head{text-align:center;margin-bottom:8px;}
  .receipt-head .app-sub{font-size:14px;color:var(--muted);margin-top:2px;}
  .receipt-head .kind{font-size:15px;color:var(--navy);margin-top:8px;font-weight:700;}
  .receipt-divider{border-top:1.5px dashed var(--border);margin:14px 0;}
  .receipt-row{
    display:flex;justify-content:space-between;
    padding:7px 0;font-size:15px;
  }
  .receipt-row .k{color:var(--muted);font-weight:600;}
  .receipt-row .v{font-weight:700;text-align:left;}
  .receipt-balance{text-align:center;margin:16px 0 6px;}
  .receipt-balance .lbl{font-size:14px;color:var(--muted);}
  .receipt-balance .val{
    font-size:30px;font-weight:800;
    font-family:'Poppins',sans-serif;margin-top:4px;
  }

  /* ====== Toast ====== */
  .toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:14px 22px;
    border-radius:12px;font-size:15px;z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:88%;text-align:center;
    font-weight:600;
  }

  /* ====== Lock ====== */
  .lock-wrap{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:30px 26px;text-align:center;
  }
  .lock-wrap .app-sub{
    font-size:15px;color:var(--muted);
    margin-top:4px;margin-bottom:30px;
  }
  .lock-wrap input{
    width:100%;max-width:280px;text-align:center;
    letter-spacing:5px;font-size:22px;
    padding:14px;border:1.5px solid var(--border);
    border-radius:12px;margin-bottom:14px;font-family:inherit;
  }
  .lock-wrap input.err{border-color:var(--red);}
  .lock-wrap .primary-btn{max-width:280px;}
  .lock-wrap .lock-err{color:var(--red);font-size:15px;margin-bottom:10px;font-weight:600;}

  .empty-state{
    text-align:center;padding:30px 20px;
    color:var(--muted);font-size:15px;
  }

  /* ====== Settings ====== */
  .setting-row{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .setting-label{font-size:16px;font-weight:700;}
  .setting-options{display:flex;gap:8px;}
  .size-btn{
    padding:8px 14px;border-radius:10px;
    border:1.5px solid var(--border);background:#fff;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .size-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* ====== PWA Install ====== */
  .install-banner{
    background:linear-gradient(135deg, #10294D, #1B3E73);
    color:#fff;border-radius:14px;
    padding:18px;margin-bottom:14px;
    display:flex;align-items:center;gap:14px;
  }
  .install-banner .icon{flex-shrink:0;}
  .install-banner .txt{flex:1;}
  .install-banner .title{font-size:16px;font-weight:700;}
  .install-banner .sub{font-size:13.5px;color:#B9C6DC;margin-top:2px;}
  .install-banner button{
    background:#fff;color:var(--navy);
    border:none;border-radius:10px;
    padding:10px 16px;font-family:inherit;
    font-size:14px;font-weight:700;cursor:pointer;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📵 انٹرنیٹ نہیں ہے</div>
<script>
/* ===================== متغیرات ===================== */
const APPS_SCRIPT_URL = "/api/submit";

let toastTimer = null;
let longPressTimer = null;
let pressedRow = null;
let audioCtx = null;

let data = {
  companies: [],
  entries: [],
  settings: { password: "1234", fontScale: "medium" }
};

let unlocked = false;
let state = { screen: 'home' };
let formDraft = {};
let fieldErrors = {};

/* ===================== SVG Logo ===================== */
const svgLogo = (size)=>`
<svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="18" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<rect x="36" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<path d="M96 34 C88 24 72 22 62 30 C52 38 54 50 66 55 C78 60 90 63 90 75 C90 87 76 94 64 88 C58 85 54 80 52 74"
 stroke="#10294D" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>`;

/* ===================== Material Icons ===================== */
const iconHome = `<span class="material-icons-round">home</span>`;
const iconIn = `<span class="material-icons-round">arrow_downward</span>`;
const iconAdd = `<span class="material-icons-round">add_circle</span>`;
const iconOut = `<span class="material-icons-round">arrow_upward</span>`;
const iconBill = `<span class="material-icons-round">receipt_long</span>`;
const iconRecords = `<span class="material-icons-round">list_alt</span>`;
const iconProfile = `<span class="material-icons-round">account_circle</span>`;
const iconBack = `<span class="material-icons-round">chevron_left</span>`;
const iconSearch = `<span class="material-icons-round">search</span>`;
const iconCheck = `<span class="material-icons-round">check_circle</span>`;
const iconEdit = `<span class="material-icons-round">edit</span>`;
const iconDelete = `<span class="material-icons-round">delete</span>`;
const iconClose = `<span class="material-icons-round">close</span>`;
const iconSave = `<span class="material-icons-round">save</span>`;
const iconSettle = `<span class="material-icons-round">refresh</span>`;
const iconReceipt = `<span class="material-icons-round">receipt_long</span>`;
const iconList = `<span class="material-icons-round">list_alt</span>`;
const iconCompany = `<span class="material-icons-round">business</span>`;
const iconBrand = `<span class="material-icons-round">label</span>`;
const iconPhone = `<span class="material-icons-round">phone</span>`;
const iconEmail = `<span class="material-icons-round">email</span>`;
const iconWhatsapp = `<span class="material-icons-round">chat</span>`;

/* ===================== Helpers ===================== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ===================== آواز ===================== */
function playSound(type){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if(type === 'success'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.3);
    } else if(type === 'error'){
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.3);
    }
  }catch(e){ console.log('sound error', e); }
}

/* ===================== Local Storage ===================== */
async function loadData(){
  try{
    const r = await window.storage.get('ledger_data', true);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      data = { ...data, ...parsed };
      if(!data.settings) data.settings = { password: "1234", fontScale: "medium" };
      if(!data.settings.password) data.settings.password = "1234";
      if(!data.settings.fontScale) data.settings.fontScale = "medium";
    } else { seedDefault(); await persist(); }
  }catch(e){ seedDefault(); await persist(); }
  applyFontScale();
  render();
}

function seedDefault(){
  data = {
    companies: [],
    entries: [],
    settings: { password: "1234", fontScale: "medium" }
  };
}

async function persist(){
  try{
    await window.storage.set('ledger_data', JSON.stringify(data), true);
  }catch(e){ console.error('save failed', e); }
}

function applyFontScale(){
  document.body.classList.remove('font-small','font-medium','font-large');
  const scale = (data.settings && data.settings.fontScale) || 'medium';
  document.body.classList.add('font-' + scale);
}

/* ===================== Toast ===================== */
function showToast(msg){
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-el');
  if(el) el.remove();
  const div = document.createElement('div');
  div.className='toast'; div.id='toast-el'; div.textContent=msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(()=>div.remove(), 2400);
}

/* ===================== Apps Script ===================== */
async function sendToSheet(payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(err){
    console.error('send error:', err);
    return { status:'error', message: String(err) };
  }
}

  else if(state.screen==='pick-company') html += renderPickCompany();
  else if(state.screen==='pick-brand') html += renderPickBrand();

/* ===================== Home ڈیش بورڈ ===================== */
function renderHome(){
  const today = new Date().toISOString().slice(0,10);
  const todayEntries = data.entries.filter(e => e.date === today);
  
  let todayInWeight = 0;
  let todayOutWeight = 0;
  const inByCompany = {};
  const outByCompany = {};
  
  todayEntries.forEach(e => {
    if(e.type === 'bag'){
      todayInWeight += parseFloat(e.weight || 0);
      const key = e.company;
      if(!inByCompany[key]) inByCompany[key] = { weight: 0, count: 0 };
      inByCompany[key].weight += parseFloat(e.weight || 0);
      inByCompany[key].count += parseFloat(e.bagsCount || 0);
    }
    if(e.type === 'roll'){
      todayOutWeight += parseFloat(e.rollsWeight || 0);
      const key = e.company;
      if(!outByCompany[key]) outByCompany[key] = { weight: 0, count: 0 };
      outByCompany[key].weight += parseFloat(e.rollsWeight || 0);
      outByCompany[key].count += parseFloat(e.rollsCount || 0);
    }
  });
  
  let inRows = '';
  Object.keys(inByCompany).forEach(k => {
    const item = inByCompany[k];
    inRows += `<div class="dash-item">
      <div>
        <div class="name">${k}</div>
        <div class="info">${item.count} بوری</div>
      </div>
      <div class="amount">${fmt(item.weight)} kg</div>
    </div>`;
  });
  if(!inRows) inRows = `<div class="empty-state" style="padding:14px;">آج کوئی بورہ نہیں آیا</div>`;
  
  let outRows = '';
  Object.keys(outByCompany).forEach(k => {
    const item = outByCompany[k];
    outRows += `<div class="dash-item">
      <div>
        <div class="name">${k}</div>
        <div class="info">${item.count} گولہ</div>
      </div>
      <div class="amount">${fmt(item.weight)} kg</div>
    </div>`;
  });
  if(!outRows) outRows = `<div class="empty-state" style="padding:14px;">آج کوئی گولہ نہیں گیا</div>`;
  
  return `
    <div class="dash-section">
      <div class="dash-title"><span class="material-icons-round">today</span> آج کا خلاصہ</div>
      <div class="dash-row">
        <div class="label"><span class="material-icons-round">arrow_downward</span> آج آیا</div>
        <div class="value green">${fmt(todayInWeight)} kg</div>
      </div>
      <div class="dash-row">
        <div class="label"><span class="material-icons-round">arrow_upward</span> آج گیا</div>
        <div class="value red">${fmt(todayOutWeight)} kg</div>
      </div>
    </div>
    
    <div class="dash-section">
      <div class="dash-title"><span class="material-icons-round">arrow_downward</span> آج کتنے بورے آئے</div>
      ${inRows}
    </div>
    
    <div class="dash-section">
      <div class="dash-title"><span class="material-icons-round">arrow_upward</span> آج کتنے گولے گئے</div>
      ${outRows}
    </div>
  `;
}

}

function calcLocalBalance(company, brand){
  const list = data.entries.filter(e => e.company===company && e.brand===brand);
  let bal = 0;
  for(const e of list){
    if(e.type==='settlement'){ bal = 0; continue; }
    if(e.type==='bag') bal += parseFloat(e.weight||0);
    if(e.type==='roll') bal -= parseFloat(e.rollsWeight||0);
  }
  return bal;
}

function field(id, label, type='text', extra=''){
  const err = fieldErrors[id];
  const isFull = extra.includes('full');
  const cleanExtra = extra.replace('full','').trim();
  return `<div class="field ${isFull?'full':''}">
    <label>${label} <span class="req">*</span></label>
    <input class="${err?'err':''}" id="f_${id}" type="${type}" value="${escAttr(formDraft[id]||'')}" ${cleanExtra}>
    ${err?`<div class="errmsg">یہ خانہ لازمی ہے</div>`:''}
  </div>`;
}

/* ===================== Records — مکمل ٹیبل ===================== */
function renderRecordsTable(){
  const company = state.company;
  const brand = state.brand;
  
  if(state.loadingData){
    return `<div class="loading-box"><div class="spinner"></div><div>لوڈ ہو رہا ہے...</div></div>`;
  }
  
  const entries = state.brandEntries || [];
  
  let html = `<div class="records-header">
    <div class="info">${company} — ${brand}</div>
    ${entries.length > 0 ? `<button class="save-btn" data-act="save-table">${iconSave} محفوظ</button>` : ''}
  </div>`;
  
  if(entries.length === 0){
    html += `<div class="empty-state">اس برانڈ کا کوئی ریکارڈ نہیں</div>`;
    return html;
  }
  
  html += `<div class="records-table-wrap"><table class="records-table"><thead><tr>
    <th>تاریخ</th>
    <th>بورے</th>
    <th>بوروں کا وزن</th>
    <th>گولے</th>
    <th>گولوں کا وزن</th>
    <th>بیلنس</th>
  </tr></thead><tbody>`;
  
  entries.forEach((e, idx) => {
    if(e.type === 'settlement'){
      html += `<tr data-act="row-longpress" data-idx="${idx}" style="background:#EEF2F8;">
        <td colspan="6" style="color:#1B3E73;font-style:italic;font-size:14px;">${e.date} — پچھلا حصہ مکمل</td>
      </tr>`;
      return;
    }
    const bal = parseFloat(e.balance || 0);
    const balClass = bal >= 0 ? 'bal-pos' : 'bal-neg';
    const bagsCount = e.type === 'bag' ? (e.bagsCount || '—') : '—';
    const weight = e.type === 'bag' ? (e.weight || '—') : '—';
    const rollsCount = e.type === 'roll' ? (e.rollsCount || '—') : '—';
    const rollsWeight = e.type === 'roll' ? (e.rollsWeight || '—') : '—';
    html += `<tr data-act="row-longpress" data-idx="${idx}">
      <td>${e.date || '-'}</td>
      <td>${bagsCount}</td>
      <td>${weight}</td>
      <td>${rollsCount}</td>
      <td>${rollsWeight}</td>
      <td class="${balClass}">${fmt(bal)}</td>
    </tr>`;
  });
  
  html += `</tbody></table></div>`;
  return html;
}

/* ===================== Validation ===================== */
function validate(fields){
  fieldErrors = {};
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById('f_'+id);
    const val = el ? el.value : formDraft[id];
    if(val===undefined || val===null || String(val).trim()===''){
      fieldErrors[id]=true; ok=false;
    } else {
      formDraft[id]=val;
    }
  });
  return ok;
}

function collectFormValues(ids){
  ids.forEach(id => {
    const el = document.getElementById('f_'+id);
    if(el) formDraft[id]=el.value;
  });
}

/* ===================== Handlers ===================== */
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el => {
    if(el.getAttribute('data-act') === 'row-longpress') return;
    el.addEventListener('click', onAction);
  });
  
  document.querySelectorAll('[data-act="row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onRowTouchStart, {passive:true});
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
  });
  
  const cs = document.getElementById('companySearch');
  if(cs){
    cs.addEventListener('input', e => {
      state.companySearch = e.target.value;
      renderKeepFocus('companySearch');
    });
  }
}

function onRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const entries = state.brandEntries || [];
  const entry = entries[idx];
  if(!entry) return;
  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(50);
    showEntryOptions(entry);
  }, 600);
  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); }, {once:true});
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); }, {once:true});
}

function showEntryOptions(entry){
  state.selectedEntry = entry;
  state.showEntryOptions = true;
  render();
}

function renderKeepFocus(id){
  const el0 = document.getElementById(id);
  if(!el0) return;
  const val = el0.value;
  const pos = el0.selectionStart;
  render();
  const el = document.getElementById(id);
  if(el){ el.focus(); el.setSelectionRange(pos,pos); }
}

function removeOverlay(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

    <th>دیے</th>
    <th>بیلنس</th>
  </tr></thead><tbody>`;
  
  bills.forEach((b, idx) => {
    const bal = parseFloat(b.balance || 0);
    const balClass = bal >= 0 ? 'bal-neg' : 'bal-pos';
    html += `<tr data-act="bill-row-longpress" data-idx="${idx}">
      <td>${b.date || '-'}</td>
      <td>${b.kisMalKaBill || '—'}</td>
      <td>${fmt(b.denayThey || 0)}</td>
      <td>${fmt(b.diye || 0)}</td>
      <td class="${balClass}">${fmt(bal)}</td>
    </tr>`;
  });
  
  html += `</tbody></table></div>`;
  return html;
}

/* ===================== نیا برانڈ (Page) ===================== */
function renderNewBrandPage(){
  if(state.loadingCompanies){
    return `<div class="section-title">کمپنی منتخب کریں</div>
      <div class="skeleton-grid">
        <div class="skeleton-box"></div>
        <div class="skeleton-box"></div>
        <div class="skeleton-box"></div>
        <div class="skeleton-box"></div>
      </div>`;
  }
  
  if(!state.company){
    const list = state.driveCompanies || [];
    const q = (state.companySearch || '').trim();
    const filtered = list.filter(c => !q || c.toLowerCase().includes(q.toLowerCase()));
    
    let html = `<div class="section-title">کون سی کمپنی کے لیے؟</div>`;
    html += `<div class="search-box">
      ${iconSearch}
      <input id="companySearch" placeholder="کمپنی تلاش کریں..." value="${escAttr(q)}">
    </div>`;
    if(filtered.length === 0){
      html += `<div class="empty-state">کوئی کمپنی نہیں ملی</div>`;
    } else {
      html += `<div class="sel-grid">`;
      filtered.forEach(c => {
        html += `<button class="sel-btn" data-act="brand-page-pick-company" data-name="${escAttr(c)}">${c}</button>`;
      });
      html += `</div>`;
    }
    return html;
  }
  
  /* برانڈ لکھنے والا پیج */
  const brands = state.newBrandList || [''];
  let brandFields = '';
  brands.forEach((b, i) => {
    brandFields += `<div class="field" style="margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;">
      <div style="flex:1;">
        <label>برانڈ ${i+1} <span class="req">*</span></label>
        <input type="text" id="f_brand_${i}" value="${escAttr(b)}" placeholder="برانڈ کا نام لکھیں">
      </div>
      ${brands.length > 1 ? `<button class="topbar-btn" data-act="remove-brand-field" data-idx="${i}" style="background:#B23A2E;color:#fff;width:42px;height:42px;">${iconClose}</button>` : ''}
    </div>`;
  });
  
  return `
    <div class="dash-section" style="text-align:center;">
      <div style="font-size:14px;color:var(--muted);">کمپنی</div>
      <div style="font-size:18px;font-weight:700;color:var(--navy);margin-top:4px;">${state.company}</div>
    </div>
    
    <div class="section-title">برانڈ کا نام لکھیں</div>
    ${brandFields}
    
    <button class="ghost-btn" data-act="add-brand-field">${iconAdd} نیا برانڈ شامل کریں</button>
    <button class="primary-btn" data-act="save-new-brand-page">${iconCheck} محفوظ کریں</button>
  `;
}
/* ===================== onAction — تمام بٹنوں کا کام ===================== */
async function onAction(e){
  const el = e.currentTarget;
  const act = el.getAttribute('data-act');

  /* ---------- Bottom Bar ---------- */
  if(act==='bb-home'){ go('home'); return; }
  if(act==='bb-bag'){ go('pick-company', {kind: 'bag', loadingCompanies: true}); loadCompanies(); return; }
  if(act==='bb-roll'){ go('pick-company', {kind: 'roll', loadingCompanies: true}); loadCompanies(); return; }
  if(act==='bb-add'){ go('new-company'); return; }
  if(act==='bb-bill'){
    state.billUnlocked = false;
    go('bill-dashboard');
    return;
  }
  if(act==='bb-records'){ go('records', {loadingCompanies: true}); loadCompanies(); return; }

  /* ---------- Profile / Settings ---------- */
  if(act==='open-profile'){ go('settings'); return; }
  if(act==='set-font'){
    const size = el.getAttribute('data-size');
    data.settings.fontScale = size;
    await persist();
    applyFontScale();
    render();
    return;
  }
  if(act==='change-password'){
    const current = prompt('موجودہ پاس ورڈ درج کریں:');
    if(current===null) return;
    if(current !== data.settings.password){ playSound('error'); alert('موجودہ پاس ورڈ غلط ہے'); return; }
    const next = prompt('نیا پاس ورڈ درج کریں:');
    if(!next) return;
    data.settings.password = next;
    await persist();
    playSound('success');
    alert('پاس ورڈ تبدیل ہو گیا');
    return;
  }
  if(act==='clear-local-data'){
    if(!confirm('کیا آپ واقعی سارا مقامی ڈیٹا صاف کرنا چاہتے ہیں؟')) return;
    data.entries = [];
    data.companies = [];
    await persist();
    showToast('مقامی ڈیٹا صاف ہو گیا');
    render();
    return;
  }

  /* ---------- Unlock (Main) ---------- */
  if(act==='unlock'){
    const val = document.getElementById('lockPass').value;
    if(val === data.settings.password){
      unlocked = true;
      fieldErrors = {};
      playSound('success');
      render();
    } else {
      fieldErrors.lock = true;
      playSound('error');
      render();
    }
    return;
  }

  /* ---------- Back ---------- */
  if(act==='back'){
    const s = state.screen;
    if(s==='settings') go('home');
    else if(s==='pick-company') go('home');
    else if(s==='pick-brand') go('pick-company', {kind: state.kind, loadingCompanies: true}), loadCompanies();
    else if(s==='form') go('pick-brand', {kind: state.kind, company: state.company, loadingBrands: true}), loadBrands(state.company);
    else if(s==='records') go('home');
    else if(s==='records-brand-list') go('records', {loadingCompanies: true}), loadCompanies();
    else if(s==='records-table') go('records-brand-list', {company: state.company, loadingBrands: true}), loadBrands(state.company);
    else if(s==='bill-dashboard') go('home');
    else if(s==='bill-company') go('bill-dashboard');
    else if(s==='bill-form') go('bill-company', {loadingBillCompanies: true}), loadBillCompanies();
    else if(s==='bill-list-company') go('bill-dashboard');
    else if(s==='bill-list') go('bill-list-company', {loadingBillCompanies: true}), loadBillCompanies();
    else if(s==='new-company') go('home');
    else if(s==='new-brand'){ state.company=null; state.newBrandList=['']; go('home'); }
    return;
  }

  /* ---------- Pick Company ---------- */
  if(act==='pick-company'){
    state.company = el.getAttribute('data-name');
    render();
    return;
  }
  if(act==='next-to-brand'){
    if(!state.company){ showToast('پہلے کمپنی منتخب کریں'); return; }
    state.loadingBrands = true;
    go('pick-brand', {kind: state.kind, company: state.company, loadingBrands: true});
    loadBrands(state.company);
    return;
  }

  /* ---------- Pick Brand ---------- */
  if(act==='pick-brand'){
    state.brand = el.getAttribute('data-name');
    state.loadingRecent = true;
    render();
    const entries = await fetchRecentEntries(state.company, state.brand, 6);
    state.recentEntries = entries;
    state.loadingRecent = false;
    render();
    return;
  }
  if(act==='next-to-form'){
    if(!state.company || !state.brand){ showToast('کمپنی اور برانڈ منتخب کریں'); return; }
    go('form', {kind: state.kind, company: state.company, brand: state.brand});
    return;
  }
  if(act==='settle'){
    if(!confirm('کیا آپ واقعی اس کمپنی/برانڈ کا پچھلا حساب مکمل کر کے بیلنس زیرو سے شروع کرنا چاہتے ہیں؟')) return;
    const settlement = {id: uid(), type: 'settlement', company: state.company, brand: state.brand, date: todayStr()};
    data.entries.push(settlement);
    await persist();
    playSound('success');
    showToast('پچھلا حساب مکمل کر دیا گیا');
    render();
    await sendToSheet(settlement);
    return;
  }

  /* ---------- Preview Bag ---------- */
  if(act==='preview-bag'){
    const ids=['date','gatePassNo','copyNo','bagsCount','weight','driverName','vehicleNo','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ playSound('error'); render(); return; }
    const draftEntry = {id: uid(), type:'bag', company: state.company, brand: state.brand};
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) + parseFloat(draftEntry.weight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry; state.confirmMode = true;
    render();
    return;
  }

  /* ---------- Preview Roll ---------- */
  if(act==='preview-roll'){
    const ids=['date','outGatePassNo','copyNo','rollsCount','rollsWeight','driverName','vehicleNo','plantName','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ playSound('error'); render(); return; }
    const draftEntry = {id: uid(), type:'roll', company: state.company, brand: state.brand};
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) - parseFloat(draftEntry.rollsWeight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry; state.confirmMode = true;
    render();
    return;
  }

  /* ---------- Confirm Save ---------- */
  if(act==='confirm-save'){
    const entry = {...state.preview};
    delete entry._balanceAfter;
    data.entries.push(entry);
    await persist();
    state.preview = null;
    formDraft = {};
    fieldErrors = {};
    go('pick-company', {kind: state.kind, loadingCompanies: true});
    loadCompanies();
    playSound('success');
    showToast('محفوظ ہو رہا ہے...');
    const result = await sendToSheet(entry);
    if(result.status === 'ok'){
      showToast('✅ اندراج محفوظ ہو گیا');
    } else {
      showToast('مقامی محفوظ، Sheet تک نہیں پہنچا');
    }
    return;
  }
  if(act==='edit-entry'){ state.preview = null; render(); return; }
  if(act==='close-receipt'){ state.preview = null; render(); return; }

  /* ---------- Records ---------- */
  if(act==='rec-open-company'){
    const company = el.getAttribute('data-name');
    go('records-brand-list', {company: company, loadingBrands: true});
    loadBrands(company);
    return;
  }
  if(act==='rec-open-brand'){
    const brand = el.getAttribute('data-name');
    state.loadingData = true;
    go('records-table', {company: state.company, brand: brand, loadingData: true});
    const entries = await fetchBrandData(state.company, brand);
    state.brandEntries = entries;
    state.loadingData = false;
    render();
    return;
  }
  if(act==='save-table'){
    saveTableAsImage();
    return;
  }

  /* ---------- Long Press Options ---------- */
  if(act==='close-options'){
    state.showEntryOptions = false;
    state.selectedEntry = null;
    removeOverlay('entryOptionsOverlay');
    render();
    return;
  }
  if(act==='do-edit'){
    removeOverlay('entryOptionsOverlay');
    renderEditConfirm();
    return;
  }
  if(act==='edit-confirm-yes'){
    removeOverlay('editFlowOverlay');
    renderEditNameInput();
    return;
  }
  if(act==='edit-name-submit'){
    const name = document.getElementById('editUserName').value.trim();
    if(!name){ playSound('error'); showToast('اپنا نام لکھیں'); return; }
    state.editUserName = name;
    removeOverlay('editFlowOverlay');
    renderEditWarning();
    return;
  }
  if(act==='edit-warning-ok'){
    await performEdit();
    return;
  }
  if(act==='do-delete'){
    removeOverlay('entryOptionsOverlay');
    renderDeleteConfirm();
    return;
  }
  if(act==='delete-confirm-yes'){
    removeOverlay('deleteFlowOverlay');
    renderDeleteNameInput();
    return;
  }
  if(act==='delete-name-submit'){
    const name = document.getElementById('deleteUserName').value.trim();
    if(!name){ playSound('error'); showToast('اپنا نام لکھیں'); return; }
    state.deleteUserName = name;
    removeOverlay('deleteFlowOverlay');
    renderDeleteWarning();
    return;
  }
  if(act==='delete-warning-ok'){
    await performDelete();
    return;
  }

  /* ---------- New Company (Page) ---------- */
  if(act==='save-new-company-page'){
    const compName = document.getElementById('f_newCompanyName').value.trim();
    const brandName = document.getElementById('f_newBrandName').value.trim();
    if(!compName){ playSound('error'); showToast('کمپنی کا نام لکھیں'); return; }
    if(!brandName){ playSound('error'); showToast('برانڈ کا نام لکھیں'); return; }
    if((state.driveCompanies || []).includes(compName)){
      playSound('error'); showToast('یہ کمپنی پہلے سے موجود ہے'); return;
    }
    const result = await createBrandOnDrive(compName, [brandName]);
    if(result.status === 'ok'){
      playSound('success');
      showToast('✅ کمپنی اور برانڈ بن گئے');
      state.company = null;
      go('home');
    } else {
      playSound('error');
      showToast(result.message || 'مسئلہ ہوا');
    }
    return;
  }

  /* ---------- New Brand (Page) ---------- */
  if(act==='brand-page-pick-company'){
    state.company = el.getAttribute('data-name');
    state.newBrandList = [''];
    render();
    return;
  }
  if(act==='add-brand-field'){
    if(!state.newBrandList) state.newBrandList = [''];
    state.newBrandList.push('');
    render();
    return;
  }
  if(act==='remove-brand-field'){
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    if(state.newBrandList && state.newBrandList.length > 1){
      state.newBrandList.splice(idx, 1);
      render();
    }
    return;
  }
  if(act==='save-new-brand-page'){
    const brands = state.newBrandList || [''];
    const cleanBrands = [];
    brands.forEach((_, i) => {
      const inp = document.getElementById('f_brand_'+i);
      if(inp){
        const v = inp.value.trim();
        if(v) cleanBrands.push(v);
      }
    });
    if(cleanBrands.length === 0){ playSound('error'); showToast('کم از کم ایک برانڈ لکھیں'); return; }
    const result = await createBrandOnDrive(state.company, cleanBrands);
    if(result.status === 'ok' && result.success){
      playSound('success');
      showToast('✅ برانڈ بن گئے');
      state.company = null;
      state.newBrandList = [''];
      go('home');
    } else {
      playSound('error');
      showToast(result.message || 'مسئلہ ہوا');
    }
    return;
  }

  /* ---------- Bill ---------- */
  if(act==='go-bill-company'){
    state.loadingBillCompanies = true;
    go('bill-company', {loadingBillCompanies: true});
    loadBillCompanies();
    return;
  }
  if(act==='go-bill-list-company'){
    state.loadingBillCompanies = true;
    go('bill-list-company', {loadingBillCompanies: true});
    loadBillCompanies();
    return;
  }
  if(act==='bill-pick-company'){
    const company = el.getAttribute('data-name');
    state.company = company;
    state.loadingBills = true;
    render();
    const result = await fetchBillsFromDrive(company);
    const bills = result.bills || [];
    const currentBalance = result.currentBalance || 0;
    state.billPrevBalance = currentBalance;
    state.loadingBills = false;
    formDraft = {};
    go('bill-form', {company: company});
    return;
  }
  if(act==='preview-bill'){
    const ids = ['date','kisMalKaBill','denayThey','diye','kisNeDiya','tasfeer'];
    collectFormValues(ids);
    const required = ['date','kisMalKaBill','denayThey','diye'];
    let ok = true;
    fieldErrors = {};
    required.forEach(id => {
      if(!formDraft[id] || String(formDraft[id]).trim()===''){ fieldErrors[id]=true; ok=false; }
    });
    if(!ok){ playSound('error'); render(); return; }
    
    const prevBal = state.billPrevBalance || 0;
    const denayThey = parseFloat(formDraft.denayThey) || 0;
    const diye = parseFloat(formDraft.diye) || 0;
    const balance = prevBal + denayThey - diye;
    
    state.billPreview = {
      company: state.company,
      date: formDraft.date,
      kisMalKaBill: formDraft.kisMalKaBill,
      denayThey: denayThey,
      diye: diye,
      kisNeDiya: formDraft.kisNeDiya || '',
      tasfeer: formDraft.tasfeer || '',
      prevBalance: prevBal,
      balance: balance
    };
    renderBillPreviewOverlay();
    return;
  }
  if(act==='close-bill-preview'){
    removeOverlay('billPreviewOverlay');
    return;
  }
  if(act==='edit-bill-preview'){
    removeOverlay('billPreviewOverlay');
    return;
  }
  if(act==='confirm-bill-save'){
    const p = state.billPreview;
    if(!p) return;
    removeOverlay('billPreviewOverlay');
    playSound('success');
    showToast('محفوظ ہو رہا ہے...');
    const result = await saveBillToDrive(p);
    if(result.status === 'ok'){
      showToast('✅ بل محفوظ ہو گیا');
      playSound('success');
      state.company = null;
      state.billPreview = null;
      go('home');
    } else {
      playSound('error');
      showToast('بل محفوظ نہیں ہوا');
    }
    return;
  }
  if(act==='bill-list-pick-company'){
    const company = el.getAttribute('data-name');
    state.company = company;
    state.loadingBills = true;
    go('bill-list', {company: company, loadingBills: true});
    const result = await fetchBillsFromDrive(company);
    state.bills = result.bills || [];
    state.currentBalance = result.currentBalance || 0;
    state.loadingBills = false;
    render();
    return;
  }
  if(act==='bill-row-longpress'){
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    state.selectedBill = (state.bills || [])[idx];
    if(!state.selectedBill) return;
    renderBillOptions();
    return;
  }
  if(act==='close-bill-options'){
    removeOverlay('billOptionsOverlay');
    state.selectedBill = null;
    return;
  }
  if(act==='bill-do-delete'){
    const b = state.selectedBill;
    if(!b) return;
    if(!confirm('کیا آپ واقعی یہ بل ڈیلیٹ کرنا چاہتے ہیں؟')) return;
    removeOverlay('billOptionsOverlay');
    const result = await deleteBillOnDrive({
      company: state.company,
      rowIndex: b.rowIndex,
      userName: data.settings.password
    });
    if(result.status === 'ok'){
      playSound('success');
      showToast('✅ بل ڈیلیٹ ہو گیا');
      const res = await fetchBillsFromDrive(state.company);
      state.bills = res.bills || [];
      state.currentBalance = res.currentBalance || 0;
      state.selectedBill = null;
      render();
    } else {
      playSound('error');
      showToast('بل ڈیلیٹ نہیں ہوا');
    }
    return;
  }
}

      <div class="receipt-divider"></div>

/* ===================== ٹیبل کو تصویر بنائیں ===================== */
function saveTableAsImage(){
  const table = document.querySelector('.records-table');
  if(!table){ showToast('ٹیبل نہیں ملا'); return; }
  showToast('📸 تصویر بن رہی ہے...');
  const company = state.company;
  const brand = state.brand;
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});
  const canvas = document.createElement('canvas');
  const scale = 2;
  const width = 800;
  const headerHeight = 180;
  const footerHeight = 80;
  const rowHeight = 55;
  const headerRowHeight = 60;
  const rows = table.querySelectorAll('tbody tr');
  const totalHeight = headerHeight + headerRowHeight + (rows.length * rowHeight) + footerHeight + 40;
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, totalHeight);
  ctx.fillStyle = '#10294D';
  ctx.fillRect(0, 0, width, headerHeight);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL', width / 2, 60);
  ctx.font = '18px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText('فیکٹری اسٹاک مینجمنٹ پورٹل', width / 2, 95);
  ctx.font = 'bold 24px Arial';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(company + ' — ' + brand, width / 2, 145);
  const colWidths = [130, 110, 130, 110, 130, 150];
  const colLabels = ['تاریخ', 'بورے', 'بوروں کا وزن', 'گولے', 'گولوں کا وزن', 'بیلنس'];
  const tableStartY = headerHeight + 10;
  ctx.fillStyle = '#1B3E73';
  ctx.fillRect(20, tableStartY, width - 40, headerRowHeight);
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  let xPos = width - 20;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#FFFFFF';
  for(let i = 0; i < colLabels.length; i++){
    xPos -= colWidths[i];
    ctx.strokeRect(xPos, tableStartY, colWidths[i], headerRowHeight);
    ctx.fillText(colLabels[i], xPos + colWidths[i] / 2, tableStartY + 36);
  }
  let yPos = tableStartY + headerRowHeight;
  rows.forEach((row) => {
    const cells = row.querySelectorAll('td');
    const isSettlement = cells.length === 1;
    if(isSettlement){
      ctx.fillStyle = '#EEF2F8';
    } else {
      ctx.fillStyle = '#FFFFFF';
    }
    ctx.fillRect(20, yPos, width - 40, rowHeight);
    ctx.strokeStyle = '#E4E1D6';
    ctx.strokeRect(20, yPos, width - 40, rowHeight);
    if(isSettlement){
      ctx.fillStyle = '#1B3E73';
      ctx.font = 'italic 15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(cells[0].textContent, width / 2, yPos + 34);
    } else {
      let cx = width - 20;
      ctx.font = 'bold 15px Arial';
      for(let i = 0; i < cells.length && i < 6; i++){
        cx -= colWidths[i];
        ctx.strokeStyle = '#E4E1D6';
        ctx.strokeRect(cx, yPos, colWidths[i], rowHeight);
        const text = cells[i].textContent.trim();
        const isBalance = (i === 5);
        if(isBalance){
          const num = parseFloat(text.replace(/,/g, ''));
          ctx.fillStyle = num >= 0 ? '#1E7D4B' : '#B23A2E';
          ctx.font = 'bold 16px Arial';
        } else {
          ctx.fillStyle = '#1A1A1A';
          ctx.font = '15px Arial';
        }
        ctx.textAlign = 'center';
        ctx.fillText(text, cx + colWidths[i] / 2, yPos + 35);
      }
    }
    yPos += rowHeight;
  });
  ctx.fillStyle = '#F5F5F5';
  ctx.fillRect(0, yPos, width, footerHeight);
  ctx.fillStyle = '#767267';
  ctx.font = '13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos + 34);
  ctx.fillText('یہ تصویر Ismail App سے بنائی گئی ہے', width / 2, yPos + 58);
  canvas.toBlob(function(blob){
    if(!blob){ showToast('تصویر نہیں بن سکی'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = company + '_' + brand + '_' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    playSound('success');
    showToast('✅ تصویر محفوظ ہو گئی');
  }, 'image/png');
}
