<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10294D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ismail">
<title>Ismail — فیکٹری اسٹاک مینجمنٹ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10294D;
    --navy-2:#1B3E73;
    --navy-soft:#EEF2F8;
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --border:#E4E1D6;
    --ink:#1A1A1A;
    --muted:#767267;
    --green:#1E7D4B;
    --red:#B23A2E;
    --radius:16px;
    --font-scale:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Naskh Arabic', 'Segoe UI', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:calc(14px * var(--font-scale));
  }
  body.font-small{--font-scale:0.9;}
  body.font-medium{--font-scale:1;}
  body.font-large{--font-scale:1.15;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}

  /* ====== Offline Banner ====== */
  .offline-banner{
    position:fixed;top:0;left:0;right:0;z-index:999;
    background:#B23A2E;color:#fff;
    padding:8px 16px;text-align:center;
    font-size:13px;font-weight:600;
    display:none;
  }
  .offline-banner.show{display:block;}

  /* ====== Topbar ====== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:12px 14px;
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    border-bottom:3px solid var(--navy-2);
  }
  .topbar-btn{
    background:rgba(255,255,255,.12);
    border:none;color:#fff;font-size:22px;
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    font-family:inherit;
    font-weight:400;
    line-height:1;
  }
  .topbar-btn:active{background:rgba(255,255,255,.25);}
  .topbar-title{
    flex:1;text-align:center;
    font-size:16px;font-weight:600;
    color:#fff;
    padding:0 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar-spacer{width:38px;flex-shrink:0;}

  .content{padding:16px 14px 10px;}

  /* ====== Home ====== */
  .home-hero{text-align:center;padding:10px 10px 22px;}
  .home-hero svg{margin-bottom:2px;}
  .home-hero .app-sub{font-size:13.5px;color:var(--muted);letter-spacing:.5px;}

  .btn-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .grid-btn{
    background:var(--navy);color:#fff;
    border:1.5px solid var(--navy-2);
    border-radius:14px;padding:18px 12px;
    cursor:pointer;text-align:center;
    font-family:inherit;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:8px;min-height:118px;
    transition:transform .08s, background .15s;
  }
  .grid-btn:active{transform:scale(.97);background:var(--navy-2);}
  .grid-btn .icon{
    width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
  }
  .grid-btn .icon svg{width:22px;height:22px;}
  .grid-btn .label{font-size:14.5px;font-weight:600;line-height:1.35;}
  .grid-btn .sub{font-size:11.5px;color:#B9C6DC;line-height:1.3;}
  .grid-btn.full{grid-column:1 / -1;min-height:80px;flex-direction:row;justify-content:flex-start;padding:16px 18px;gap:14px;text-align:right;}
  .grid-btn.full .icon{flex-shrink:0;}
  .grid-btn.full .txt{display:flex;flex-direction:column;}

  .section-title{font-size:14px;font-weight:600;color:var(--navy);margin:16px 0 10px;}

  /* ====== Sel Grid ====== */
  .sel-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;margin-bottom:14px;
  }
  .sel-btn{
    background:var(--navy);color:#fff;
    border:1.5px solid var(--navy-2);
    border-radius:12px;padding:14px 10px;
    font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;text-align:center;line-height:1.35;
    min-height:56px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s, background .15s;
    word-break:break-word;
  }
  .sel-btn:active{transform:scale(.97);}
  .sel-btn.active{background:#fff;color:var(--navy);border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}

  /* ====== Loading / Skeleton ====== */
  .loading-box{text-align:center;padding:40px 20px;color:var(--muted);}
  .spinner{
    display:inline-block;width:32px;height:32px;
    border:3px solid var(--border);border-top-color:var(--navy);
    border-radius:50%;animation:spin 1s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .skeleton-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;
  }
  .skeleton-box{
    height:56px;border-radius:12px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
  }
  @keyframes skeletonShine{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  /* ====== Form ====== */
  .form-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:10px 12px;margin-bottom:6px;
  }
  .form-grid .field.full{grid-column:1 / -1;}
  .field{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink);margin-bottom:5px;font-weight:600;}
  .field label .req{color:var(--red);}
  .field input{
    width:100%;padding:10px 11px;
    border:1px solid var(--border);border-radius:9px;
    font-family:inherit;font-size:14px;
    background:#fff;color:var(--ink);
  }
  .field input.err{border-color:var(--red);}
  .field .errmsg{color:var(--red);font-size:11px;margin-top:3px;}

  .primary-btn{
    width:100%;background:var(--navy);color:#fff;
    border:none;border-radius:11px;
    padding:14px;font-size:15.5px;font-weight:600;
    cursor:pointer;font-family:inherit;margin-top:14px;
  }
  .ghost-btn{
    width:100%;background:transparent;color:var(--navy);
    border:1px solid var(--navy);border-radius:11px;
    padding:12px;font-size:14.5px;font-weight:600;
    cursor:pointer;font-family:inherit;margin-top:10px;
  }

  /* ====== Balance Card ====== */
  .balance-card{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;margin:14px 0;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .balance-card .meta{font-size:13px;color:var(--muted);}
  .balance-card .meta b{color:var(--ink);font-weight:600;}
  .balance-card .amount{font-size:22px;font-weight:700;font-family:'Poppins',sans-serif;}
  .amount.pos{color:var(--green);}
  .amount.neg{color:var(--red);}

  .settle-btn{
    display:block;width:100%;text-align:center;
    background:var(--navy-soft);color:var(--navy);
    border:1px dashed var(--navy-2);border-radius:10px;
    padding:10px;font-size:13.5px;cursor:pointer;
    font-family:inherit;margin-bottom:16px;
  }

  /* ====== Recent Entries Table ====== */
  .recent-title{font-size:13.5px;font-weight:700;color:var(--navy);margin:18px 0 10px;}
  .recent-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .recent-table{
    width:100%;border-collapse:collapse;
    font-size:11px;direction:rtl;
    table-layout:fixed;
  }
  .recent-table thead tr{background:var(--navy);color:#fff;}
  .recent-table th{
    padding:8px 4px;text-align:center;font-weight:600;
    font-size:10.5px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .recent-table td{
    padding:8px 4px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .recent-table td.bal-pos{color:var(--green);font-weight:700;}
  .recent-table td.bal-neg{color:var(--red);font-weight:700;}

  /* ====== Records ====== */
  .records-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:8px;
  }
  .records-header .info{font-size:13px;color:var(--muted);}
  .save-btn{
    background:var(--navy-soft);color:var(--navy);
    border:1px solid var(--navy-2);border-radius:8px;
    padding:8px 12px;font-size:12.5px;
    font-family:inherit;cursor:pointer;font-weight:600;
    white-space:nowrap;
  }
  .records-table-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .records-table{
    width:100%;border-collapse:collapse;
    font-size:11px;direction:rtl;
    table-layout:fixed;
  }
  .records-table thead tr{background:var(--navy);color:#fff;}
  .records-table th{
    padding:9px 4px;text-align:center;font-weight:600;
    font-size:10.5px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .records-table tbody tr{
    cursor:pointer;-webkit-tap-highlight-color:rgba(16,41,77,.1);
    user-select:none;
  }
  .records-table tbody tr:active{background:var(--navy-soft);}
  .records-table tbody tr.pressed{background:#FFE5B4 !important;}
  .records-table td{
    padding:9px 4px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .records-table td.bal-pos{color:var(--green);font-weight:700;}
  .records-table td.bal-neg{color:var(--red);font-weight:700;}

  /* ====== Overlays ====== */
  .overlay{
    position:fixed;inset:0;background:rgba(16,41,77,.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .sheet-popup,.receipt-sheet{
    background:#fff;width:100%;max-width:480px;
    border-radius:18px 18px 0 0;
    padding:22px 20px 24px;max-height:88vh;overflow-y:auto;
  }
  .sheet-title{
    font-size:17px;font-weight:700;color:var(--navy);
    margin-bottom:14px;text-align:center;
  }
  .popup-btn{
    width:100%;padding:14px;margin-bottom:10px;
    border-radius:10px;font-family:inherit;
    font-size:15px;font-weight:600;
    cursor:pointer;border:none;
  }
  .popup-btn.edit{background:var(--navy);color:#fff;}
  .popup-btn.delete{background:var(--red);color:#fff;}
  .popup-btn.cancel{background:transparent;color:var(--muted);border:1px solid var(--border);}

  .info-msg{
    background:#FFF8E1;border:1px solid #FFE082;
    border-radius:10px;padding:14px 16px;margin:14px 0;
    font-size:13.5px;color:#5D4037;line-height:1.8;text-align:right;
  }

  /* ====== Brand Search Popup ====== */
  .brand-list{
    max-height:50vh;overflow-y:auto;
    margin:10px 0;border:1px solid var(--border);border-radius:10px;
  }
  .brand-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
    cursor:pointer;font-size:14.5px;font-weight:600;
    transition:background .15s;
  }
  .brand-item:last-child{border-bottom:none;}
  .brand-item:active{background:var(--navy-soft);}
  .brand-item.selected{background:var(--navy-soft);color:var(--navy);}
  .brand-item .check{color:var(--navy);font-size:18px;font-weight:700;}
  .brand-search-input{
    width:100%;padding:12px 14px;
    border:1px solid var(--border);border-radius:10px;
    font-family:inherit;font-size:14.5px;
    background:#fff;color:var(--ink);
    margin-bottom:10px;
  }

  /* ====== Receipt ====== */
  .receipt-head{text-align:center;margin-bottom:8px;}
  .receipt-head .app-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .receipt-head .kind{font-size:13px;color:var(--navy);margin-top:6px;font-weight:600;}
  .receipt-divider{border-top:1.5px dashed var(--border);margin:12px 0;}
  .receipt-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
  .receipt-row .k{color:var(--muted);}
  .receipt-row .v{font-weight:600;text-align:left;}
  .receipt-balance{text-align:center;margin:14px 0 6px;}
  .receipt-balance .lbl{font-size:12.5px;color:var(--muted);}
  .receipt-balance .val{font-size:26px;font-weight:700;font-family:'Poppins',sans-serif;margin-top:2px;}

  /* ====== Toast ====== */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:12px 20px;
    border-radius:10px;font-size:13.5px;z-index:100;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    max-width:88%;text-align:center;
  }

  /* ====== Lock ====== */
  .lock-wrap{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:30px 26px;text-align:center;
  }
  .lock-wrap .app-sub{font-size:13.5px;color:var(--muted);margin-top:2px;margin-bottom:26px;}
  .lock-wrap input{
    width:100%;max-width:260px;text-align:center;
    letter-spacing:4px;font-size:20px;
    padding:12px;border:1px solid var(--border);
    border-radius:10px;margin-bottom:12px;font-family:inherit;
  }
  .lock-wrap input.err{border-color:var(--red);}
  .lock-wrap .primary-btn{max-width:260px;}
  .lock-wrap .lock-err{color:var(--red);font-size:13px;margin-bottom:10px;}
  .change-link{
    margin-top:18px;font-size:12.5px;color:var(--navy-2);
    text-decoration:underline;cursor:pointer;
    background:none;border:none;font-family:inherit;
  }

  .empty-state{text-align:center;padding:30px 20px;color:var(--muted);font-size:13.5px;}

  /* ====== Settings ====== */
  .setting-row{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .setting-label{font-size:14px;font-weight:600;}
  .setting-options{display:flex;gap:6px;}
  .size-btn{
    padding:6px 12px;border-radius:8px;
    border:1px solid var(--border);background:#fff;
    font-family:inherit;font-size:12.5px;cursor:pointer;
  }
  .size-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .brand-warning{
    background:#FBEAE7;border:1px solid #B23A2E;color:#B23A2E;
    border-radius:10px;padding:12px 14px;font-size:13.5px;
    text-align:center;margin:10px 0;
  }
  .brand-success{
    background:#E9F5EE;border:1px solid #1E7D4B;color:#1E7D4B;
    border-radius:10px;padding:12px 14px;font-size:13.5px;
    text-align:center;margin:10px 0;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📵 انٹرنیٹ نہیں ہے</div>
<script>
  /* ===================== متغیرات ===================== */
const APPS_SCRIPT_URL = "/api/submit";

/* برانڈ کی طے شدہ لسٹ (بعد میں اصل نام ڈالیں گے) */
const BRAND_LIST = [
  "سفید",
  "کالا",
  "گرے ملانج",
  "نیلا",
  "30pc",
  "1/1 Pc",
  "مختلف/دیگر"
];

let toastTimer = null;
let longPressTimer = null;
let pressedRow = null;

let data = {
  companies: [],
  brands: {},
  entries: [],
  settings: { password: "1234", fontScale: "medium" }
};

let unlocked = false;
let state = { screen: 'home' };
let formDraft = {};
let fieldErrors = {};

/* ===================== SVG آئیکنز ===================== */
const svgLogo = (size)=>`
<svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="18" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<rect x="36" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<path d="M96 34 C88 24 72 22 62 30 C52 38 54 50 66 55 C78 60 90 63 90 75 C90 87 76 94 64 88 C58 85 54 80 52 74"
 stroke="#10294D" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>`;

const iconIn = `<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 19h16"/></svg>`;
const iconOut = `<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"/><path d="M7 13l5-5 5 5"/><path d="M4 5h16"/></svg>`;
const iconRec = `<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>`;
const iconGear = `<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;

/* ===================== Helpers ===================== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ===================== Local Storage ===================== */
async function loadData(){
  try{
    const r = await window.storage.get('ledger_data', true);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      data = { ...data, ...parsed };
      if(!data.brands) data.brands = {};
      if(!data.settings) data.settings = { password: "1234", fontScale: "medium" };
      if(!data.settings.password) data.settings.password = "1234";
      if(!data.settings.fontScale) data.settings.fontScale = "medium";
    } else { seedDefault(); await persist(); }
  }catch(e){ seedDefault(); await persist(); }
  applyFontScale();
  render();
}

function seedDefault(){
  data = {
    companies: [],
    brands: {},
    entries: [],
    settings: { password: "1234", fontScale: "medium" }
  };
}

async function persist(){
  try{
    await window.storage.set('ledger_data', JSON.stringify(data), true);
  }catch(e){ console.error('save failed', e); }
}

function applyFontScale(){
  document.body.classList.remove('font-small','font-medium','font-large');
  const scale = (data.settings && data.settings.fontScale) || 'medium';
  document.body.classList.add('font-' + scale);
}

/* ===================== Toast ===================== */
function showToast(msg){
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-el');
  if(el) el.remove();
  const div = document.createElement('div');
  div.className='toast'; div.id='toast-el'; div.textContent=msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(()=>div.remove(), 2400);
}

/* ===================== Navigation ===================== */
function go(screen, params={}){
  state = { screen, ...params };
  formDraft = {};
  fieldErrors = {};
  render();
  window.scrollTo(0,0);
}

/* ===================== Apps Script سے بات ===================== */
async function sendToSheet(payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(err){
    console.error('send error:', err);
    return { status:'error', message: String(err) };
  }
}

}

/* ===================== Offline Detection ===================== */
function updateOfflineBanner(){
  const banner = document.getElementById('offlineBanner');
  if(!banner) return;
  if(navigator.onLine){
    banner.classList.remove('show');
  } else {
    banner.classList.add('show');
  }
}

  }

    <th>بورے</th>
    <th>بوروں وزن</th>
    <th>گولے</th>
    <th>گولوں وزن</th>
    <th>بیلنس</th>
  </tr></thead><tbody>`;
  
  entries.forEach(e => {
    const bal = parseFloat(e.balance || 0);
    const balClass = bal >= 0 ? 'bal-pos' : 'bal-neg';
    html += `<tr>
      <td>${e.date || '-'}</td>
      <td>${e.bagsCount || '—'}</td>
      <td>${e.weight || '—'}</td>
      <td>${e.rollsCount || '—'}</td>
      <td>${e.rollsWeight || '—'}</td>
      <td class="${balClass}">${fmt(bal)}</td>
    </tr>`;
  });
  
  html += `</tbody></table></div>`;
  return html;
}

function calcLocalBalance(company, brand){
  const list = data.entries.filter(e => e.company===company && e.brand===brand);
  let bal = 0;
  for(const e of list){
    if(e.type==='settlement'){ bal = 0; continue; }
    if(e.type==='bag') bal += parseFloat(e.weight||0);
    if(e.type==='roll') bal -= parseFloat(e.rollsWeight||0);
  }
  return bal;
}

/* ===================== Validation ===================== */
function validate(fields){
  fieldErrors = {};
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById('f_'+id);
    const val = el ? el.value : formDraft[id];
    if(val===undefined || val===null || String(val).trim()===''){
      fieldErrors[id]=true; ok=false;
    } else {
      formDraft[id]=val;
    }
  });
  return ok;
}

function collectFormValues(ids){
  ids.forEach(id => {
    const el = document.getElementById('f_'+id);
    if(el) formDraft[id]=el.value;
  });
}

/* ===================== Handlers ===================== */
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el => {
    if(el.getAttribute('data-act') === 'row-longpress') return;
    el.addEventListener('click', onAction);
  });
  
  document.querySelectorAll('[data-act="row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onRowTouchStart, {passive:true});
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
  });
}

function onRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const entries = state.brandEntries || [];
  const entry = entries[idx];
  if(!entry) return;
  
  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(50);
    showEntryOptions(entry);
  }, 600);
  
  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); }, {once:true});
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); }, {once:true});
}

function showEntryOptions(entry){
  state.selectedEntry = entry;
  state.showEntryOptions = true;
  render();
}

function renderKeepFocus(id){
  const el0 = document.getElementById(id);
  if(!el0) return;
  const val = el0.value;
  const pos = el0.selectionStart;
  render();
  const el = document.getElementById(id);
  if(el){ el.focus(); el.setSelectionRange(pos,pos); }
}

function removeOverlay(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}
  /* ===================== onAction — تمام بٹنوں کا کام ===================== */
async function onAction(e){
  const el = e.currentTarget;
  const act = el.getAttribute('data-act');

  /* ---------- Settings ---------- */
  if(act==='open-settings'){ go('settings'); return; }
  if(act==='set-font'){
    const size = el.getAttribute('data-size');
    if(!data.settings) data.settings = { password: "1234", fontScale: "medium" };
    data.settings.fontScale = size;
    await persist();
    applyFontScale();
    render();
    return;
  }
  if(act==='clear-local-data'){
    if(!confirm('کیا آپ واقعی سارا مقامی ڈیٹا صاف کرنا چاہتے ہیں؟ (Google Sheet پر اثر نہیں ہوگا)')) return;
    data.entries = [];
    data.companies = [];
    data.brands = {};
    await persist();
    showToast('مقامی ڈیٹا صاف ہو گیا');
    render();
    return;
  }
  if(act==='change-password'){
    const current = prompt('موجودہ پاس ورڈ درج کریں:');
    if(current===null) return;
    if(current !== data.settings.password){ alert('موجودہ پاس ورڈ غلط ہے'); return; }
    const next = prompt('نیا پاس ورڈ درج کریں:');
    if(!next) return;
    data.settings.password = next;
    await persist();
    alert('پاس ورڈ تبدیل ہو گیا');
    return;
  }

  /* ---------- Unlock ---------- */
  if(act==='unlock'){
    const val = document.getElementById('lockPass').value;
    if(val === (data.settings && data.settings.password)){
      unlocked = true;
      fieldErrors = {};
      render();
    } else {
      fieldErrors.lock = true;
      render();
    }
    return;
  }

  /* ---------- Back ---------- */
  if(act==='back'){
    const s = state.screen;
    if(s==='settings') go('home');
    else if(s==='pick-company') go('home');
    else if(s==='pick-brand') go('pick-company', {kind: state.kind});
    else if(s==='form') go('pick-brand', {kind: state.kind, company: state.company});
    else if(s==='records') go('home');
    else if(s==='records-brand-list') go('records');
    else if(s==='records-table') go('records-brand-list', {company: state.company});
    return;
  }

  /* ---------- Home Navigation ---------- */
  if(act==='go-entry'){
    const kind = el.getAttribute('data-kind');
    go('pick-company', {kind: kind, loadingCompanies: true});
    loadCompaniesAndRender(kind);
    return;
  }
  if(act==='go-records'){
    go('records', {loadingCompanies: true});
    loadCompaniesAndRender('records');
    return;
  }

  /* ---------- Add Popup (Top + button) ---------- */
  if(act==='open-add-popup'){
    if(state.screen === 'pick-company'){
      state.showNewCompany = true;
      render();
    } else if(state.screen === 'pick-brand'){
      state.showBrandPicker = true;
      state.brandSearch = '';
      render();
    }
    return;
  }
  if(act==='close-new-company'){
    state.showNewCompany = false;
    render();
    return;
  }
  if(act==='save-new-company'){
    const inp = document.getElementById('newCompanyInput');
    const name = inp ? inp.value.trim() : '';
    if(!name){ showToast('کمپنی کا نام لکھیں'); return; }
    if((state.driveCompanies || []).includes(name)){
      showToast('یہ کمپنی پہلے سے موجود ہے');
      return;
    }
    if(!data.companies.includes(name)) data.companies.push(name);
    await persist();
    state.showNewCompany = false;
    state.driveCompanies = [...(state.driveCompanies || []), name].sort();
    state.company = name;
    showToast('کمپنی شامل ہو گئی');
    render();
    return;
  }
  if(act==='close-brand-picker'){
    state.showBrandPicker = false;
    state.brandSearch = '';
    render();
    return;
  }
  if(act==='select-brand-item'){
    const brand = el.getAttribute('data-name');
    state.selectedBrandToCreate = brand;
    state.showBrandPicker = false;
    await doCreateBrand(brand);
    return;
  }
  if(act==='close-brand-warning'){
    state.showBrandWarning = false;
    state.brandWarningMsg = '';
    state.brandWarningSuccess = false;
    render();
    return;
  }

  /* ---------- Pick Company ---------- */
  if(act==='pick-company'){
    state.company = el.getAttribute('data-name');
    render();
    return;
  }
  if(act==='next-to-brand'){
    if(!state.company){ showToast('پہلے کمپنی منتخب کریں'); return; }
    go('pick-brand', {kind: state.kind, company: state.company, loadingBrands: true});
    loadBrandsAndRender(state.company, state.kind);
    return;
  }

  /* ---------- Pick Brand ---------- */
  if(act==='pick-brand'){
    state.brand = el.getAttribute('data-name');
    state.loadingRecent = true;
    render();
    const entries = await fetchRecentEntries(state.company, state.brand, 6);
    state.recentEntries = entries;
    state.loadingRecent = false;
    render();
    return;
  }
  if(act==='next-to-form'){
    if(!state.company || !state.brand){ showToast('کمپنی اور برانڈ منتخب کریں'); return; }
    go('form', {kind: state.kind, company: state.company, brand: state.brand});
    return;
  }

  /* ---------- Settlement ---------- */
  if(act==='settle'){
    if(!confirm('کیا آپ واقعی اس کمپنی/برانڈ کا پچھلا حساب مکمل کر کے بیلنس زیرو سے شروع کرنا چاہتے ہیں؟')) return;
    const settlement = {
      id: uid(),
      type: 'settlement',
      company: state.company,
      brand: state.brand,
      date: todayStr()
    };
    data.entries.push(settlement);
    await persist();
    showToast('پچھلا حساب مکمل کر دیا گیا');
    render();
    await sendToSheet(settlement);
    return;
  }

  /* ---------- Preview Bag ---------- */
  if(act==='preview-bag'){
    const ids=['date','gatePassNo','copyNo','bagsCount','weight','driverName','vehicleNo','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ render(); return; }
    const draftEntry = {id: uid(), type:'bag', company: state.company, brand: state.brand};
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) + parseFloat(draftEntry.weight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry; state.confirmMode = true;
    render();
    return;
  }

  /* ---------- Preview Roll ---------- */
  if(act==='preview-roll'){
    const ids=['date','outGatePassNo','copyNo','rollsCount','rollsWeight','driverName','vehicleNo','plantName','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ render(); return; }
    const draftEntry = {id: uid(), type:'roll', company: state.company, brand: state.brand};
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) - parseFloat(draftEntry.rollsWeight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry; state.confirmMode = true;
    render();
    return;
  }

  /* ---------- Confirm Save ---------- */
  if(act==='confirm-save'){
    const entry = {...state.preview};
    delete entry._balanceAfter;
    data.entries.push(entry);
    await persist();
    state.preview = null;
    formDraft = {};
    fieldErrors = {};
    go('pick-company', {kind: state.kind, loadingCompanies: true});
    loadCompaniesAndRender(state.kind);
    showToast('محفوظ ہو رہا ہے...');
    const result = await sendToSheet(entry);
    if(result.status === 'ok'){
      showToast('اندراج محفوظ ہو گیا');
    } else {
      showToast('اندراج مقامی طور پر محفوظ ہوا، مگر Sheet تک نہیں پہنچا');
    }
    return;
  }
  if(act==='edit-entry'){ state.preview = null; render(); return; }
  if(act==='close-receipt'){ state.preview = null; render(); return; }

  /* ---------- Records Navigation ---------- */
  if(act==='rec-open-company'){
    const company = el.getAttribute('data-name');
    go('records-brand-list', {company: company, loadingBrands: true});
    loadBrandsAndRender(company, 'records');
    return;
  }
  if(act==='rec-open-brand'){
    const brand = el.getAttribute('data-name');
    go('records-table', {company: state.company, brand: brand, loadingData: true});
    const entries = await fetchBrandData(state.company, brand);
    state.brandEntries = entries;
    state.loadingData = false;
    render();
    return;
  }

  /* ---------- Long Press Options ---------- */
  if(act==='close-options'){
    state.showEntryOptions = false;
    state.selectedEntry = null;
    state.editStep = null;
    state.deleteStep = null;
    removeOverlay('entryOptionsOverlay');
    render();
    return;
  }

  /* ---------- Edit Flow ---------- */
  if(act==='do-edit'){
    state.showEntryOptions = false;
    removeOverlay('entryOptionsOverlay');
    renderEditConfirm();
    return;
  }
  if(act==='edit-confirm-yes'){
    removeOverlay('editFlowOverlay');
    renderEditNameInput();
    return;
  }
  if(act==='edit-name-submit'){
    const name = document.getElementById('editUserName').value.trim();
    if(!name){ showToast('اپنا نام لکھیں'); return; }
    state.editUserName = name;
    removeOverlay('editFlowOverlay');
    renderEditWarning();
    return;
  }
  if(act==='edit-warning-ok'){
    await performEdit();
    return;
  }

  /* ---------- Delete Flow ---------- */
  if(act==='do-delete'){
    state.showEntryOptions = false;
    removeOverlay('entryOptionsOverlay');
    renderDeleteConfirm();
    return;
  }
  if(act==='delete-confirm-yes'){
    removeOverlay('deleteFlowOverlay');
    renderDeleteNameInput();
    return;
  }
  if(act==='delete-name-submit'){
    const name = document.getElementById('deleteUserName').value.trim();
    if(!name){ showToast('اپنا نام لکھیں'); return; }
    state.deleteUserName = name;
    removeOverlay('deleteFlowOverlay');
    renderDeleteWarning();
    return;
  }
  if(act==='delete-warning-ok'){
    await performDelete();
    return;
  }

  /* ---------- Save Table as Image ---------- */
  if(act==='save-table'){
    saveTableAsImage();
    return;
  }
}

/* ===================== Drive سے کمپنیاں لوڈ + Render ===================== */
async function loadCompaniesAndRender(returnTo){
  state.loadingCompanies = true;
  render();
  const companies = await fetchCompaniesFromDrive();
  state.driveCompanies = companies;
  state.loadingCompanies = false;
  render();
}

/* ===================== Drive سے برانڈز لوڈ + Render ===================== */
async function loadBrandsAndRender(company, returnTo){
  state.loadingBrands = true;
  render();
  const brands = await fetchBrandsFromDrive(company);
  state.driveBrands = brands;
  state.loadingBrands = false;
  render();
}

/* ===================== نئی برانڈ (Sheet) بنائیں ===================== */
async function doCreateBrand(brand){
  state.loadingBrands = true;
  render();
  
  const result = await createBrandOnDrive(state.company, brand);
  
  state.loadingBrands = false;
  
  if(result.status === 'ok' && result.success){
    state.brandWarningMsg = 'نئی شیٹ بنا دی گئی: ' + brand;
    state.brandWarningSuccess = true;
    state.showBrandWarning = true;
    render();
    
    const brands = await fetchBrandsFromDrive(state.company);
    state.driveBrands = brands;
    state.brand = brand;
    render();
  } else {
    state.brandWarningMsg = result.message || 'یہ شیٹ پہلے سے موجود ہے';
    state.brandWarningSuccess = false;
    state.showBrandWarning = true;
    render();
  }
}

/* ===================== ترمیم کریں ===================== */
async function performEdit(){
  const entry = state.selectedEntry;
  const name = state.editUserName;
  removeOverlay('editFlowOverlay');
  
  showToast('ترمیم بھیجی جا رہی ہے...');
  
  const result = await sendToSheet({
    action: 'update',
    company: state.company,
    brand: state.brand,
    type: entry.type,
    entryId: entry.id,
    userName: name,
    oldData: entry,
    newData: entry
  });
  
  state.showEntryOptions = false;
  state.selectedEntry = null;
  state.editStep = null;
  state.editUserName = null;
  
  if(result.status === 'ok'){
    showToast('✅ اینٹری ترمیم ہو گئی');
  } else {
    showToast('❌ ترمیم نہیں ہو سکی');
  }
  
  state.loadingData = true;
  render();
  const entries = await fetchBrandData(state.company, state.brand);
  state.brandEntries = entries;
  state.loadingData = false;
  render();
}

}

/* ===================== ٹیبل کو تصویر بنائیں ===================== */
function saveTableAsImage(){
  const table = document.querySelector('.records-table');
  if(!table){
    showToast('ٹیبل نہیں ملا');
    return;
  }
  
  showToast('📸 تصویر بن رہی ہے...');
  
  const company = state.company;
  const brand = state.brand;
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});
  
  /* Canvas dimensions */
  const canvas = document.createElement('canvas');
  const scale = 2;
  const width = 800;
  const headerHeight = 180;
  const footerHeight = 80;
  const rowHeight = 50;
  const headerRowHeight = 55;
  
  const rows = table.querySelectorAll('tbody tr');
  const totalHeight = headerHeight + headerRowHeight + (rows.length * rowHeight) + footerHeight + 40;
  
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  
  /* Background */
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, totalHeight);
  
  /* Header */
  ctx.fillStyle = '#10294D';
  ctx.fillRect(0, 0, width, headerHeight);
  
  /* Logo text */
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL', width / 2, 55);
  
  ctx.font = '16px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText('فیکٹری اسٹاک مینجمنٹ پورٹل', width / 2, 85);
  
  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(company + ' — ' + brand, width / 2, 130);
  
  /* Table header */
  const colWidths = [130, 110, 130, 110, 130, 150];
  const colLabels = ['تاریخ', 'بورے', 'بوروں وزن', 'گولے', 'گولوں وزن', 'بیلنس'];
  const tableStartY = headerHeight + 10;
  
  /* Header row */
  ctx.fillStyle = '#1B3E73';
  ctx.fillRect(20, tableStartY, width - 40, headerRowHeight);
  
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  let xPos = width - 20;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#FFFFFF';
  
  for(let i = 0; i < colLabels.length; i++){
    xPos -= colWidths[i];
    ctx.strokeRect(xPos, tableStartY, colWidths[i], headerRowHeight);
    ctx.fillText(colLabels[i], xPos + colWidths[i] / 2, tableStartY + 32);
  }
  
  /* Rows */
  let yPos = tableStartY + headerRowHeight;
  
  rows.forEach((row) => {
    const cells = row.querySelectorAll('td');
    const isSettlement = cells.length === 1;
    
    /* Row background */
    if(isSettlement){
      ctx.fillStyle = '#EEF2F8';
    } else {
      ctx.fillStyle = '#FFFFFF';
    }
    ctx.fillRect(20, yPos, width - 40, rowHeight);
    
    ctx.strokeStyle = '#E4E1D6';
    ctx.strokeRect(20, yPos, width - 40, rowHeight);
    
    /* Cell texts */
    if(isSettlement){
      ctx.fillStyle = '#1B3E73';
      ctx.font = 'italic 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(cells[0].textContent, width / 2, yPos + 30);
    } else {
      let cx = width - 20;
      ctx.font = '14px Arial';
      for(let i = 0; i < cells.length && i < 6; i++){
        cx -= colWidths[i];
        ctx.strokeStyle = '#E4E1D6';
        ctx.strokeRect(cx, yPos, colWidths[i], rowHeight);
        
        const text = cells[i].textContent.trim();
        const isBalance = (i === 5);
        
        if(isBalance){
          const num = parseFloat(text.replace(/,/g, ''));
          ctx.fillStyle = num >= 0 ? '#1E7D4B' : '#B23A2E';
          ctx.font = 'bold 14px Arial';
        } else {
          ctx.fillStyle = '#1A1A1A';
          ctx.font = '14px Arial';
        }
        
        ctx.textAlign = 'center';
        ctx.fillText(text, cx + colWidths[i] / 2, yPos + 32);
      }
    }
    yPos += rowHeight;
  });
  
  /* Footer */
  ctx.fillStyle = '#F5F5F5';
  ctx.fillRect(0, yPos, width, footerHeight);
  
  ctx.fillStyle = '#767267';
  ctx.font = '12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos + 32);
  ctx.fillText('یہ تصویر Ismail App سے بنائی گئی ہے', width / 2, yPos + 55);
  
  /* Convert to image */
  canvas.toBlob(function(blob){
    if(!blob){
      showToast('تصویر نہیں بن سکی');
      return;
    }
    
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = company + '_' + brand + '_' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    
    showToast('✅ تصویر محفوظ ہو گئی (Downloads میں دیکھیں)');
  }, 'image/png');
}
