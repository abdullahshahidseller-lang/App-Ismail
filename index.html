<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10294D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ismail">
<title>Ismail — فیکٹری اسٹاک مینجمنٹ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  :root{
    --navy:#10294D;
    --navy-2:#1B3E73;
    --navy-soft:#EEF2F8;
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --border:#E4E1D6;
    --ink:#1A1A1A;
    --muted:#767267;
    --green:#1E7D4B;
    --red:#B23A2E;
    --orange:#E67E22;
    --purple:#8E44AD;
    --yellow:#F1C40F;
    --radius:16px;
    --font-scale:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Naskh Arabic', 'Segoe UI', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:calc(15px * var(--font-scale));
  }
  body.font-small{--font-scale:0.92;}
  body.font-medium{--font-scale:1;}
  body.font-large{--font-scale:1.15;}
  #app{
    max-width:480px;margin:0 auto;min-height:100vh;
    background:var(--bg);position:relative;
    padding-bottom:95px;
  }

  /* ====== Offline Banner ====== */
  .offline-banner{
    position:fixed;top:0;left:0;right:0;z-index:999;
    background:#B23A2E;color:#fff;
    padding:9px 16px;text-align:center;
    font-size:14px;font-weight:700;
    display:none;
  }
  .offline-banner.show{display:block;}

  /* ====== Topbar ====== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:12px 14px;
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    border-bottom:3px solid var(--navy-2);
    min-height:66px;
  }
  .topbar-btn{
    background:rgba(255,255,255,.12);
    border:none;color:#fff;
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    font-family:inherit;
    transition:background .15s;
  }
  .topbar-btn:active{background:rgba(255,255,255,.28);}
  .topbar-btn .material-icons-round{
    font-size:26px;color:#fff;
  }
  .topbar-btn.topbar-profile .material-icons-round{
    font-size:32px;
  }
  .topbar-title{
    flex:1;text-align:center;
    font-size:17px;font-weight:700;
    color:#fff;
    padding:0 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar-spacer{width:44px;height:44px;flex-shrink:0;}

  /* ====== Bottom Bar ====== */
  .bottombar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:space-around;
    padding:6px 2px 8px;
    border-top:3px solid var(--navy-2);
    z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.15);
  }
  .bbtn{
    flex:1;
    background:transparent;border:none;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:2px;
    padding:6px 2px;
    cursor:pointer;
    font-family:inherit;
    transition:transform .12s;
    min-width:0;
  }
  .bbtn:active{transform:scale(.9);}
  .bbtn .material-icons-round{
    font-size:26px;
    color:#fff;
    opacity:.55;
    transition:all .2s;
  }
  .bbtn.active .material-icons-round{
    font-size:32px;
    opacity:1;
    color:#fff;
  }
  .bbtn.active{
    background:rgba(255,255,255,.08);
    border-radius:12px;
  }

  .content{padding:16px 14px 10px;}

  /* ====== ڈیش بورڈ ====== */
  .dash-section{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .dash-title{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 12px 0;
    display:flex;align-items:center;gap:8px;
  }
  .dash-title .material-icons-round{
    font-size:22px;color:var(--navy);
  }
  .dash-row{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px dashed var(--border);
    font-size:16px;
  }
  .dash-row:last-child{border-bottom:none;}
  .dash-row .label{
    color:var(--muted);
    font-size:15px;
    display:flex;align-items:center;gap:8px;
  }
  .dash-row .label .material-icons-round{
    font-size:20px;
    color:var(--muted);
  }
  .dash-row .value{
    font-weight:700;
    font-size:18px;
    font-family:'Poppins',sans-serif;
  }
  .dash-row .value.green{color:var(--green);}
  .dash-row .value.red{color:var(--red);}

  .dash-item{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .dash-item:last-child{border-bottom:none;}
  .dash-item .name{
    font-weight:600;
    color:var(--ink);
    font-size:16px;
  }
  .dash-item .info{
    color:var(--muted);
    font-size:13.5px;
    margin-top:2px;
  }
  .dash-item .amount{
    font-weight:700;
    font-family:'Poppins',sans-serif;
    font-size:17px;
    color:var(--navy);
  }

  /* ====== Buttons ====== */
  .primary-btn{
    width:100%;background:var(--navy);color:#fff;
    border:none;border-radius:12px;
    padding:16px;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s;
  }
  .primary-btn:active{background:var(--navy-2);}
  .primary-btn .material-icons-round{font-size:22px;}
  .ghost-btn{
    width:100%;background:transparent;color:var(--navy);
    border:1.5px solid var(--navy);border-radius:12px;
    padding:14px;font-size:15.5px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .ghost-btn:active{background:var(--navy-soft);}
  .ghost-btn .material-icons-round{font-size:20px;}

  .section-title{
    font-size:16px;font-weight:700;
    color:var(--navy);margin:16px 0 10px;
  }

  /* ====== Search Box ====== */
  .search-box{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--border);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;
  }
  .search-box .material-icons-round{
    color:var(--muted);font-size:22px;
  }
  .search-box input{
    border:none;outline:none;flex:1;background:transparent;
    font-family:inherit;font-size:16px;color:var(--ink);
    padding:2px 0;
  }

  /* ====== Sel Grid ====== */
  .sel-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:12px;margin-bottom:16px;
  }
  .sel-btn{
    background:var(--navy);color:#fff;
    border:2px solid var(--navy-2);
    border-radius:14px;padding:20px 12px;
    font-family:inherit;font-size:17px;font-weight:700;
    cursor:pointer;text-align:center;
    line-height:1.4;
    min-height:80px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, background .15s;
    word-break:break-word;
  }
  .sel-btn:active{transform:scale(.96);}
  .sel-btn.active{
    background:#fff;color:var(--navy);
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy) inset;
  }

  /* ====== Recent Table ====== */
  .recent-title{
    font-size:15px;font-weight:700;
    color:var(--navy);margin:18px 0 10px;
    display:flex;align-items:center;gap:6px;
  }
  .recent-title .material-icons-round{font-size:20px;color:var(--navy);}
  .recent-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .recent-table{
    width:100%;border-collapse:collapse;
    font-size:14px;direction:rtl;
    table-layout:fixed;
  }
  .recent-table thead tr{background:var(--navy);color:#fff;}
  .recent-table th{
    padding:12px 6px;text-align:center;font-weight:700;
    font-size:13.5px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .recent-table td{
    padding:13px 6px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:15px;
    font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .recent-table td.bal-pos{color:var(--green);font-weight:800;}
  .recent-table td.bal-neg{color:var(--red);font-weight:800;}

  /* ====== حساب مکمل ====== */
  .settle-top{
    width:100%;
    background:var(--navy-soft);
    color:var(--navy);
    border:1.5px dashed var(--navy-2);
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:14px;
  }
  .settle-top:active{background:#E1E8F2;}
  .settle-top .material-icons-round{font-size:22px;}

  /* ====== Skeleton ====== */
  .skeleton-card{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:16px 14px;
    margin-bottom:10px;
  }
  .skeleton-line{
    height:15px;border-radius:8px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
    margin-bottom:10px;
  }
  .skeleton-line.short{width:55%;}
  .skeleton-line.medium{width:80%;}
  .skeleton-line:last-child{margin-bottom:0;}
  @keyframes skeletonShine{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .skeleton-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
  }
  .skeleton-box{
    height:80px;border-radius:14px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
  }

  /* ====== Loading spinner ====== */
  .loading-box{text-align:center;padding:30px 20px;color:var(--muted);font-size:15px;}
  .spinner{
    display:inline-block;width:34px;height:34px;
    border:3px solid var(--border);border-top-color:var(--navy);
    border-radius:50%;animation:spin 1s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ====== Form ====== */
  .form-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:14px 12px;margin-bottom:8px;
  }
  .form-grid .field.full{grid-column:1 / -1;}
  .field{margin-bottom:0;}
  .field label{
    display:block;font-size:14px;
    color:var(--ink);margin-bottom:7px;font-weight:700;
  }
  .field label .req{color:var(--red);}
  .field input, .field select{
    width:100%;padding:14px 14px;
    border:1.5px solid var(--border);border-radius:12px;
    font-family:inherit;font-size:16px;
    background:#fff;color:var(--ink);
    font-weight:600;
  }
  .field input.err{border-color:var(--red);}
  .field .errmsg{color:var(--red);font-size:13px;margin-top:5px;}

  /* ====== Records Table ====== */
  .records-header{
    display:flex;justify-content:space-between;
    align-items:center;margin-bottom:12px;gap:8px;
  }
  .records-header .info{font-size:15px;color:var(--muted);font-weight:600;}
  .save-btn{
    background:var(--navy-soft);color:var(--navy);
    border:1.5px solid var(--navy-2);border-radius:10px;
    padding:9px 14px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .save-btn .material-icons-round{font-size:18px;}

  .records-table-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
  }
  .records-table{
    width:100%;border-collapse:collapse;
    font-size:14px;direction:rtl;
    table-layout:fixed;
  }
  .records-table thead tr{background:var(--navy);color:#fff;}
  .records-table th{
    padding:12px 6px;text-align:center;font-weight:700;
    font-size:13.5px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .records-table tbody tr{
    cursor:pointer;-webkit-tap-highlight-color:rgba(16,41,77,.1);
    user-select:none;
  }
  .records-table tbody tr:active{background:var(--navy-soft);}
  .records-table tbody tr.pressed{background:#FFE5B4 !important;}
  .records-table td{
    padding:13px 6px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:15px;
    font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .records-table td.bal-pos{color:var(--green);font-weight:800;}
  .records-table td.bal-neg{color:var(--red);font-weight:800;}

  /* ====== Overlays ====== */
  .overlay{
    position:fixed;inset:0;background:rgba(16,41,77,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .sheet-popup,.receipt-sheet{
    background:#fff;width:100%;max-width:480px;
    border-radius:22px 22px 0 0;
    padding:24px 20px 26px;max-height:88vh;overflow-y:auto;
  }
  .sheet-title{
    font-size:19px;font-weight:700;color:var(--navy);
    margin-bottom:16px;text-align:center;
  }
  .popup-btn{
    width:100%;padding:16px;margin-bottom:10px;
    border-radius:12px;font-family:inherit;
    font-size:16.5px;font-weight:700;
    cursor:pointer;border:none;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .popup-btn .material-icons-round{font-size:24px;}
  .popup-btn.edit{background:var(--navy);color:#fff;}
  .popup-btn.delete{background:var(--red);color:#fff;}
  .popup-btn.cancel{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
  .popup-btn.company{background:var(--navy);color:#fff;}
  .popup-btn.brand{background:var(--navy-2);color:#fff;}

  .info-msg{
    background:#FFF8E1;border:1.5px solid #FFE082;
    border-radius:12px;padding:16px 18px;margin:14px 0;
    font-size:15px;color:#5D4037;line-height:1.9;text-align:right;
  }

  /* ====== Receipt ====== */
  .receipt-head{text-align:center;margin-bottom:8px;}
  .receipt-head .app-sub{font-size:14px;color:var(--muted);margin-top:2px;}
  .receipt-head .kind{font-size:15px;color:var(--navy);margin-top:8px;font-weight:700;}
  .receipt-divider{border-top:1.5px dashed var(--border);margin:14px 0;}
  .receipt-row{
    display:flex;justify-content:space-between;
    padding:7px 0;font-size:15px;
  }
  .receipt-row .k{color:var(--muted);font-weight:600;}
  .receipt-row .v{font-weight:700;text-align:left;}
  .receipt-balance{text-align:center;margin:16px 0 6px;}
  .receipt-balance .lbl{font-size:14px;color:var(--muted);}
  .receipt-balance .val{
    font-size:30px;font-weight:800;
    font-family:'Poppins',sans-serif;margin-top:4px;
  }

  /* ====== Toast ====== */
  .toast{
    position:fixed;bottom:115px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:14px 22px;
    border-radius:12px;font-size:15px;z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:88%;text-align:center;
    font-weight:600;
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{
    from{opacity:0;transform:translateX(-50%) translateY(10px);}
    to{opacity:1;transform:translateX(-50%) translateY(0);}
  }

  /* ====== Lock ====== */
  .lock-wrap{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:30px 26px;text-align:center;
  }
  .lock-wrap .app-sub{
    font-size:15px;color:var(--muted);
    margin-top:6px;margin-bottom:30px;
  }
  .lock-wrap input{
    width:100%;max-width:280px;text-align:center;
    letter-spacing:5px;font-size:22px;
    padding:14px;border:1.5px solid var(--border);
    border-radius:12px;margin-bottom:14px;font-family:inherit;
  }
  .lock-wrap input.err{border-color:var(--red);}
  .lock-wrap .primary-btn{max-width:280px;}
  .lock-wrap .lock-err{color:var(--red);font-size:15px;margin-bottom:10px;font-weight:600;}

  .empty-state{
    text-align:center;padding:30px 20px;
    color:var(--muted);font-size:15px;
  }

  /* ====== Settings ====== */
  .setting-row{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .setting-label{
    font-size:16px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .setting-label .material-icons-round{font-size:22px;color:var(--navy);}
  .setting-options{display:flex;gap:8px;}
  .size-btn{
    padding:8px 14px;border-radius:10px;
    border:1.5px solid var(--border);background:#fff;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .size-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* ====== برانڈ فیلڈ (کئی برانڈ) ====== */
  .brand-field-row{
    display:flex;gap:8px;align-items:flex-end;
    margin-bottom:12px;
  }
  .brand-field-row .field{flex:1;}
  .brand-remove-btn{
    background:var(--red);color:#fff;
    border:none;border-radius:12px;
    width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .brand-remove-btn .material-icons-round{font-size:24px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📵 آف لائن — پرانا ڈیٹا</div>
<script>
/* ===================== متغیرات ===================== */
const APPS_SCRIPT_URL = "/api/submit";

let toastTimer = null;
let longPressTimer = null;
let pressedRow = null;
let audioCtx = null;
let deferredPrompt = null;

let data = {
  companies: [],
  entries: [],
  settings: { password: "1234", billPassword: "5678", fontScale: "medium" }
};

let unlocked = false;
let state = { screen: 'home' };
let formDraft = {};
let fieldErrors = {};

/* ===================== SVG Logo ===================== */
const svgLogo = (size)=>`
<svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="18" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<rect x="36" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<path d="M96 34 C88 24 72 22 62 30 C52 38 54 50 66 55 C78 60 90 63 90 75 C90 87 76 94 64 88 C58 85 54 80 52 74"
 stroke="#10294D" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>`;

/* ===================== Material Icons ===================== */
const mi = (name)=>`<span class="material-icons-round">${name}</span>`;
const iconHome = mi('home');
const iconIn = mi('arrow_downward');
const iconAdd = mi('add_circle');
const iconOut = mi('arrow_upward');
const iconBill = mi('receipt_long');
const iconRecords = mi('list_alt');
const iconProfile = mi('account_circle');
const iconBack = mi('chevron_right');
const iconSearch = mi('search');
const iconCheck = mi('check_circle');
const iconEdit = mi('edit');
const iconDelete = mi('delete');
const iconClose = mi('close');
const iconSave = mi('save');
const iconSettle = mi('refresh');
const iconList = mi('list_alt');
const iconLock = mi('lock');
const iconFont = mi('text_fields');
const iconClear = mi('delete_sweep');
const iconBusiness = mi('business');
const iconLabel = mi('label');
const iconToday = mi('today');
const iconArrowDown = mi('arrow_downward');
const iconArrowUp = mi('arrow_upward');
const iconEmail = mi('email');

/* ===================== Helpers ===================== */
function todayStr(){ 
  /* ✅ پاکستان UTC+5 */
  const d = new Date();
  const pk = new Date(d.getTime() + (5 * 60 * 60 * 1000));
  return pk.toISOString().slice(0,10);
}

function nowPK(){ 
  const d = new Date();
  return new Date(d.getTime() + (5 * 60 * 60 * 1000));
}

function fmt(n){ 
  return Number(n || 0).toLocaleString('en-US', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 3
  }); 
}

function uid(){ 
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7); 
}

function escAttr(s){ 
  return String(s === undefined || s === null ? '' : s).replace(/"/g,'&quot;'); 
}

function esc(s){ 
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function(c){ 
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; 
  }); 
}

/* ===================== آواز (صرف 2) ===================== */
function playSound(type){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ 
      audioCtx.resume(); 
    }
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if(type === 'success'){
      /* کامیابی — خوشگوار ding */
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.25);
    } else if(type === 'error'){
      /* ناکامی — گہرا buzz */
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.22);
    }
  }catch(e){ 
    console.log('sound error', e); 
  }
}

/* ===================== Toast ===================== */
function showToast(msg){
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-el');
  if(el) el.remove();
  const div = document.createElement('div');
  div.className = 'toast';
  div.id = 'toast-el';
  div.textContent = msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(() => div.remove(), 2600);
}

/* ===================== Balance (local) ===================== */
function calcLocalBalance(company, brand){
  const list = data.entries.filter(e => e.company === company && e.brand === brand);
  let bal = 0;
  for(const e of list){
    if(e.type === 'settlement'){ bal = 0; continue; }
    if(e.type === 'bag') bal += parseFloat(e.weight || 0);
    if(e.type === 'roll') bal -= parseFloat(e.rollsWeight || 0);
  }
  return bal;
}

/* ===================== Cache ===================== */
const CACHE_KEY = 'ismail_cache_v1';

function saveCache(dataObj){
  try{
    const cacheData = {
      data: dataObj,
      timestamp: Date.now()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
  }catch(e){
    console.error('cache save failed', e);
  }
}

function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.data && parsed.timestamp){
      /* 24 گھنٹے سے زیادہ پرانا نہ دکھائیں */
      const ageHours = (Date.now() - parsed.timestamp) / (1000 * 60 * 60);
      if(ageHours > 24) return null;
      return parsed.data;
    }
    return null;
  }catch(e){
    console.error('cache load failed', e);
    return null;
  }
}

function clearCache(){
  try{
    localStorage.removeItem(CACHE_KEY);
  }catch(e){}
}

/* ===================== Apps Script Calls ===================== */
async function sendToSheet(payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(err){
    console.error('send error:', err);
    return { status: 'error', message: String(err) };
  }
}

/* ===================== Drive: کمپنیاں ===================== */
async function fetchCompaniesFromDrive(){
  /* آن لائن → Sheet سے */
  if(navigator.onLine){
    const result = await sendToSheet({ action: 'getCompanies' });
    if(result.status === 'ok' && result.companies){
      updateCacheCompanies(result.companies);
      return { companies: result.companies, fromCache: false, error: false };
    }
    /* Sheet ناکام → cache */
    const cache = loadCache();
    if(cache && cache.companies){
      return { companies: cache.companies, fromCache: true, error: true };
    }
    return { companies: [], fromCache: false, error: true };
  } else {
    /* آف لائن → cache */
    const cache = loadCache();
    if(cache && cache.companies){
      return { companies: cache.companies, fromCache: true, error: false };
    }
    return { companies: [], fromCache: true, error: false };
  }
}

/* ===================== Drive: برانڈز ===================== */
async function fetchBrandsFromDrive(company){
  if(navigator.onLine){
    const result = await sendToSheet({ action: 'getBrands', company: company });

      return { 
        brands: cache.brandsByCompany[company], 
        fromCache: true, 
        error: false 
      };
    }
    return { brands: [], fromCache: true, error: false };
  }
}

/* ===================== Cache Update Helpers ===================== */
function updateCacheBrands(company, brands){
  try{
    let cache = loadCache() || { companies: [], brandsByCompany: {}, entriesByKey: {}, billsByCompany: {} };
    if(!cache.brandsByCompany) cache.brandsByCompany = {};
    cache.brandsByCompany[company] = brands;
    saveCache(cache);
  }catch(e){}
}

function updateCacheCompanies(companies){
  try{
    let cache = loadCache() || { companies: [], brandsByCompany: {}, entriesByKey: {}, billsByCompany: {} };
    cache.companies = companies;
    saveCache(cache);
  }catch(e){}
}

function updateCacheEntries(company, brand, entries){
  try{
    let cache = loadCache() || { companies: [], brandsByCompany: {}, entriesByKey: {}, billsByCompany: {} };
    if(!cache.entriesByKey) cache.entriesByKey = {};
    cache.entriesByKey[company + '__' + brand] = entries;
    saveCache(cache);
  }catch(e){}
}

function updateCacheBills(company, bills, currentBalance){
  try{
    let cache = loadCache() || { companies: [], brandsByCompany: {}, entriesByKey: {}, billsByCompany: {} };
    if(!cache.billsByCompany) cache.billsByCompany = {};
    cache.billsByCompany[company] = { bills: bills, currentBalance: currentBalance };
    saveCache(cache);
  }catch(e){}
}

/* ===================== نئی Sheet (برانڈ) بنائیں ===================== */
async function createBrandOnDrive(company, brandList){
  const result = await sendToSheet({
    action: 'createBrandSheet',
    company: company,
    brand: brandList
  });
  /* کامیابی پر cache update */
  if(result.status === 'ok' && result.success){
    try{
      let cache = loadCache() || { companies: [], brandsByCompany: {}, entriesByKey: {}, billsByCompany: {} };
      if(!cache.brandsByCompany) cache.brandsByCompany = {};
      if(!cache.brandsByCompany[company]) cache.brandsByCompany[company] = [];
      if(Array.isArray(result.added)){
        result.added.forEach(b => {
          if(!cache.brandsByCompany[company].includes(b)){
            cache.brandsByCompany[company].push(b);
          }
        });
      }
      saveCache(cache);
    }catch(e){}
  }
  return result;
}

/* ===================== Data Load (Start) ===================== */
async function loadData(){
  /* Settings local سے لوڈ کریں */
  const localSettings = loadSettingsLocal();
  if(localSettings){
    data.settings = { ...data.settings, ...localSettings };
  }
  
  /* Cache سے ڈیٹا لوڈ کریں (فوری دکھانے کے لیے) */
  const cache = loadCache();
  if(cache && cache.companies){
    data.companies = cache.companies;
  }
  
  applyFontScale();
  render();
  
  /* پھر Sheet سے تازہ لائیں */
  if(navigator.onLine){
    const result = await fetchCompaniesFromDrive();
    if(result.companies && result.companies.length > 0){
      data.companies = result.companies;
    }
  }
}

function render(){
  const app = document.getElementById('app');
  
  if(!unlocked){
    app.innerHTML = renderLock();
    attachHandlers();
    return;
  }
  
  let html = topbarHtml();
  html += `<div class="content">`;
  
  if(state.screen === 'home') html += renderHome();
  else if(state.screen === 'settings') html += renderSettings();
  else if(state.screen === 'pick-company') html += renderPickCompany();
  else if(state.screen === 'pick-brand') html += renderPickBrand();
  else if(state.screen === 'form') html += renderForm();
  else if(state.screen === 'records') html += renderRecordsCompanies();
  else if(state.screen === 'records-brand-list') html += renderRecordsBrandList();
  else if(state.screen === 'records-table') html += renderRecordsTable();
  else if(state.screen === 'bill-dashboard') html += renderBillDashboard();
  else if(state.screen === 'bill-company') html += renderBillCompany();
  else if(state.screen === 'bill-form') html += renderBillForm();
  else if(state.screen === 'bill-list-company') html += renderBillListCompany();
  else if(state.screen === 'bill-list') html += renderBillList();
  else if(state.screen === 'new-company') html += renderNewCompanyPage();
  else if(state.screen === 'new-brand') html += renderNewBrandPage();
  
  html += `</div>`;
  html += bottombarHtml();
  
  app.innerHTML = html;
  attachHandlers();
  
  /* Overlays */
  if(state.preview) renderReceiptOverlay(state.preview);
  if(state.showEntryOptions) renderEntryOptions();
  if(state.billPreview) renderBillPreviewOverlay();
  if(state.selectedBill) renderBillOptions();

/* ===================== Home ڈیش بورڈ ===================== */
function renderHome(){
  const today = todayStr();
  const todayEntries = data.entries.filter(e => e.date === today);
  
  let todayInWeight = 0;
  let todayOutWeight = 0;
  const inByCompany = {};
  const outByCompany = {};
  
  todayEntries.forEach(e => {
    if(e.type === 'bag'){
      const w = parseFloat(e.weight || 0);
      todayInWeight += w;
      if(!inByCompany[e.company]) inByCompany[e.company] = { weight: 0, count: 0 };
      inByCompany[e.company].weight += w;
      inByCompany[e.company].count += parseFloat(e.bagsCount || 0);
    }
    if(e.type === 'roll'){
      const w = parseFloat(e.rollsWeight || 0);
      todayOutWeight += w;
      if(!outByCompany[e.company]) outByCompany[e.company] = { weight: 0, count: 0 };
      outByCompany[e.company].weight += w;
      outByCompany[e.company].count += parseFloat(e.rollsCount || 0);
    }
  });
  
  let inRows = '';
  const inKeys = Object.keys(inByCompany);
  if(inKeys.length === 0){
    inRows = `<div class="empty-state" style="padding:14px;">آج کوئی بورہ نہیں آیا</div>`;
  } else {
    inKeys.forEach(k => {
      const item = inByCompany[k];
      inRows += `<div class="dash-item">
        <div>
          <div class="name">${esc(k)}</div>
          <div class="info">${fmt(item.count)} بوری</div>
        </div>
        <div class="amount">${fmt(item.weight)} kg</div>
      </div>`;
    });
  }
  
  let outRows = '';

/* ===================== Validation ===================== */
function validate(fields){
  fieldErrors = {};
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById('f_' + id);
    const val = el ? el.value : formDraft[id];
    if(val === undefined || val === null || String(val).trim() === ''){
      fieldErrors[id] = true;
      ok = false;
    } else {
      formDraft[id] = val;
    }
  });
  return ok;
}

function collectFormValues(ids){
  ids.forEach(id => {
    const el = document.getElementById('f_' + id);
    if(el) formDraft[id] = el.value;
  });
}

/* ===================== Remove Overlay ===================== */
function removeOverlay(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

/* ===================== Edit / Delete Actions ===================== */
async function performEdit(){
  const entry = state.selectedEntry;
  const name = state.editUserName;
  removeOverlay('editFlowOverlay');
  
  showToast('ترمیم بھیجی جا رہی ہے...');
  
  const result = await sendToSheet({
    action: 'update',
    company: state.company,
    brand: state.brand,
    type: entry.type,
    entryId: entry.id,
    userName: name,
    oldData: entry,
    newData: entry
  });
  
  state.showEntryOptions = false;
  state.selectedEntry = null;
  state.editUserName = null;
  
  if(result.status === 'ok'){
    playSound('success');
    showToast('✅ اینٹری ترمیم ہو گئی');
  } else {
    playSound('error');
    showToast('❌ ترمیم نہیں ہو سکی');
  }
  
  state.loadingData = true;
  render();
  const response = await fetchBrandData(state.company, state.brand);
  state.brandEntries = response.entries || [];
  state.entriesFromCache = response.fromCache;
  state.loadingData = false;
  render();
}

async function performDelete(){
  const entry = state.selectedEntry;
  const name = state.deleteUserName;
  removeOverlay('deleteFlowOverlay');

/* ===================== ٹیبل کو تصویر بنائیں ===================== */
function saveTableAsImage(){
  const table = document.querySelector('.records-table');
  if(!table){ showToast('ٹیبل نہیں ملا'); return; }
  
  showToast('📸 تصویر بن رہی ہے...');
  
  const company = state.company;
  const brand = state.brand;
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});
  
  const canvas = document.createElement('canvas');
  const scale = 2;
  const width = 800;
  const headerHeight = 180;
  const footerHeight = 80;
  const rowHeight = 55;
  const headerRowHeight = 60;
  
  const rows = table.querySelectorAll('tbody tr');
  
  /* iPhone canvas limit — تقریباً 16000px سے زیادہ نہیں */
  const totalHeight = headerHeight + headerRowHeight + (rows.length * rowHeight) + footerHeight + 40;
  if(totalHeight > 15000){
    playSound('error');
    showToast('❌ بہت زیادہ rows — تصویر نہیں بن سکتی');
    return;
  }
  
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, totalHeight);
  
  ctx.fillStyle = '#10294D';
  ctx.fillRect(0, 0, width, headerHeight);
  
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL', width / 2, 60);
  
  ctx.font = '18px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText('فیکٹری اسٹاک مینجمنٹ پورٹل', width / 2, 95);
  
  ctx.font = 'bold 24px Arial';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(company + ' — ' + brand, width / 2, 145);
  
  const colWidths = [130, 110, 130, 110, 130, 150];
  const colLabels = ['تاریخ', 'بورے', 'بوروں کا وزن', 'گولے', 'گولوں کا وزن', 'بیلنس'];
  const tableStartY = headerHeight + 10;
  
  ctx.fillStyle = '#1B3E73';
  ctx.fillRect(20, tableStartY, width - 40, headerRowHeight);
  
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  let xPos = width - 20;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#FFFFFF';
  
  for(let i = 0; i < colLabels.length; i++){
    xPos -= colWidths[i];
    ctx.strokeRect(xPos, tableStartY, colWidths[i], headerRowHeight);
    ctx.fillText(colLabels[i], xPos + colWidths[i] / 2, tableStartY + 36);
  }
  
  let yPos = tableStartY + headerRowHeight;
  
  rows.forEach((row) => {
    const cells = row.querySelectorAll('td');
    const isSettlement = cells.length === 1;
    
    ctx.fillStyle = isSettlement ? '#EEF2F8' : '#FFFFFF';
    ctx.fillRect(20, yPos, width - 40, rowHeight);
    
    ctx.strokeStyle = '#E4E1D6';
    ctx.strokeRect(20, yPos, width - 40, rowHeight);
    
    if(isSettlement){
      ctx.fillStyle = '#1B3E73';
      ctx.font = 'italic 15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(cells[0].textContent, width / 2, yPos + 34);
    } else {
      let cx = width - 20;
      ctx.font = 'bold 15px Arial';
      for(let i = 0; i < cells.length && i < 6; i++){
        cx -= colWidths[i];
        ctx.strokeStyle = '#E4E1D6';
        ctx.strokeRect(cx, yPos, colWidths[i], rowHeight);
        const text = cells[i].textContent.trim();
        const isBalance = (i === 5);
        if(isBalance){
          const num = parseFloat(text.replace(/,/g, ''));
          ctx.fillStyle = num >= 0 ? '#1E7D4B' : '#B23A2E';
          ctx.font = 'bold 16px Arial';
        } else {
          ctx.fillStyle = '#1A1A1A';
          ctx.font = '15px Arial';
        }
        ctx.textAlign = 'center';
        ctx.fillText(text, cx + colWidths[i] / 2, yPos + 35);
      }
    }
    yPos += rowHeight;
  });
  
  ctx.fillStyle = '#F5F5F5';
  ctx.fillRect(0, yPos, width, footerHeight);
  
  ctx.fillStyle = '#767267';
  ctx.font = '13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos + 34);
  ctx.fillText('یہ تصویر Ismail App سے بنائی گئی ہے', width / 2, yPos + 58);
  
  canvas.toBlob(function(blob){
    if(!blob){ showToast('تصویر نہیں بن سکی'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = company + '_' + brand + '_' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    playSound('success');
    showToast('✅ تصویر محفوظ ہو گئی');
  }, 'image/png');
}

/* ===================== بل کی تصویر ===================== */
function saveBillAsImage(billData){
  const company = billData.company;
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});
  
  const canvas = document.createElement('canvas');
  const scale = 2;
  const width = 800;
  const height = 920;
  
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  
  /* پس منظر */
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, height);
  
  /* بارڈر */
  ctx.strokeStyle = '#10294D';
  ctx.lineWidth = 4;
  ctx.strokeRect(15, 15, width - 30, height - 30);
  
  /* Header */
  ctx.fillStyle = '#10294D';
  ctx.fillRect(20, 20, width - 40, 140);
  
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL', width / 2, 75);
  
  ctx.font = '18px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText('فیکٹری اسٹاک مینجمنٹ پورٹل', width / 2, 105);
  
  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('بل', width / 2, 140);
  
  /* کمپنی */
  ctx.font = 'bold 26px Arial';
  ctx.fillStyle = '#10294D';
  ctx.fillText(company, width / 2, 210);
  
  /* Divider */
  ctx.strokeStyle = '#E4E1D6';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(40, 235);
  ctx.lineTo(width - 40, 235);
  ctx.stroke();
  ctx.setLineDash([]);
  
  /* تفصیلات */
  const labels = [
    ['تاریخ', billData.date],
    ['کس مال کا بل', billData.kisMalKaBill],
    ['پچھلا بیلنس', fmt(billData.prevBalance)],
    ['دینے تھے', fmt(billData.denayThey)],
    ['دیے', fmt(billData.diye)],
    ['کس نے دیا', billData.kisNeDiya || '-'],
    ['تفصیل', billData.tasfeer || '-']
  ];
  
  let yPos = 290;
  ctx.font = 'bold 20px Arial';
  labels.forEach((row) => {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#767267';
    ctx.fillText(row[0], width - 50, yPos);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#1A1A1A';
    ctx.fillText(row[1], 50, yPos);
    yPos += 58;
  });
  
  /* Divider */
  ctx.strokeStyle = '#E4E1D6';
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(40, yPos + 15);
  ctx.lineTo(width - 40, yPos + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  
  /* نیا بیلنس */
  yPos += 75;
  ctx.textAlign = 'center';
  ctx.font = '18px Arial';
  ctx.fillStyle = '#767267';
  ctx.fillText('نیا بیلنس', width / 2, yPos);
  
  yPos += 55;
  ctx.font = 'bold 48px Arial';
  const balColor = billData.balance >= 0 ? '#B23A2E' : '#1E7D4B';
  ctx.fillStyle = balColor;
  ctx.fillText(fmt(billData.balance), width / 2, yPos);
  
  /* Footer */
  yPos = height - 70;
  ctx.font = '14px Arial';
  ctx.fillStyle = '#999';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos);
  ctx.fillText('یہ تصویر Ismail App سے بنائی گئی ہے', width / 2, yPos + 25);
  
  /* تصویر محفوظ کریں */
  canvas.toBlob(function(blob){
    if(!blob){ showToast('تصویر نہیں بن سکی'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Bill_' + company + '_' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

/* ===================== Save New Company ===================== */
async function saveNewCompany(){
  const compInput = document.getElementById('f_newCompanyName');
  const brandInput = document.getElementById('f_newBrandName');
  
  const compName = compInput ? compInput.value.trim() : '';
  const brandName = brandInput ? brandInput.value.trim() : '';
  
  if(!compName){
    playSound('error');
    showToast('کمپنی کا نام لکھیں');
    return;
  }
  if(!brandName){
    playSound('error');
    showToast('برانڈ کا نام لکھیں');
    return;
  }
  
  /* پہلے سے موجود ہے؟ */
  if((state.driveCompanies || []).includes(compName)){
    playSound('error');
    showToast('یہ کمپنی پہلے سے موجود ہے');
    return;
  }
  
  showToast('محفوظ ہو رہا ہے...');
  
  const result = await createBrandOnDrive(compName, [brandName]);
  
  if(result.status === 'ok' && result.success){
    playSound('success');
    showToast('✅ کمپنی اور برانڈ بن گئے');
    
    /* cache update */
    updateCacheCompanies([...(state.driveCompanies || []), compName].sort());
    
    state.company = null;
    state.newBrandList = [''];
    go('home');
  } else {
    playSound('error');
    showToast(result.message || 'مسئلہ ہوا');
  }
}

/* ===================== Save New Brand (کئی) ===================== */
async function saveNewBrand(){
  const brands = state.newBrandList || [''];
  const cleanBrands = [];
  
  brands.forEach((_, i) => {
    const inp = document.getElementById('f_brand_' + i);
    if(inp){
      const v = inp.value.trim();
      if(v) cleanBrands.push(v);
    }
  });
  
  if(cleanBrands.length === 0){
    playSound('error');
    showToast('کم از کم ایک برانڈ لکھیں');
    return;
  }
  
  showToast('محفوظ ہو رہا ہے...');
  
  const result = await createBrandOnDrive(state.company, cleanBrands);
  
  if(result.status === 'ok' && result.success){
    playSound('success');
    
    if(result.added && result.added.length > 0){
      showToast('✅ ' + result.added.length + ' برانڈ بن گئے');
    } else {
      showToast('✅ محفوظ ہو گیا');
    }
    
    state.company = null;
    state.newBrandList = [''];
    go('home');
  } else {
    playSound('error');
    showToast(result.message || 'مسئلہ ہوا');
  }
}
/* ===================== onAction ===================== */
async function onAction(e){
  const el = e.currentTarget;
  const act = el.getAttribute('data-act');

  /* ========== Bottom Bar ========== */
  if(act === 'bb-home'){
    state.companySearch = '';
    state.driveCompanies = [];
    state.companiesError = false;
    state.companiesFromCache = false;
    go('home');
    return;
  }
  if(act === 'bb-bag'){
    state.companySearch = '';
    state.kind = 'bag';
    state.company = null;
    state.brand = null;
    state.driveCompanies = [];
    state.companiesError = false;
    state.companiesFromCache = false;
    state.loadingCompanies = true;
    go('pick-company', { kind: 'bag', loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'bb-roll'){
    state.companySearch = '';
    state.kind = 'roll';
    state.company = null;
    state.brand = null;
    state.driveCompanies = [];
    state.companiesError = false;
    state.companiesFromCache = false;
    state.loadingCompanies = true;
    go('pick-company', { kind: 'roll', loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'bb-add'){
    /* ✅ پلس → popup */
    renderAddPopup();
    return;
  }
  if(act === 'bb-bill'){
    const pass = prompt('بل کا پاس ورڈ درج کریں:');
    if(pass === null) return;
    const expected = (data.settings && data.settings.billPassword) || '5678';
    if(pass !== expected){
      playSound('error');
      showToast('پاس ورڈ غلط ہے');
      return;
    }
    playSound('success');
    go('bill-dashboard');
    return;
  }
  if(act === 'bb-records'){
    state.companySearch = '';
    state.driveCompanies = [];
    state.companiesError = false;
    state.companiesFromCache = false;
    state.loadingCompanies = true;
    go('records', { loadingCompanies: true });
    loadCompanies();
    return;
  }

  /* ========== Add Popup Actions ========== */
  if(act === 'open-new-company'){
    removeOverlay('addPopupOverlay');
    go('new-company');
    return;
  }
  if(act === 'open-new-brand'){
    removeOverlay('addPopupOverlay');
    state.companySearch = '';
    state.company = null;
    state.newBrandList = [''];
    state.driveCompanies = [];
    state.companiesError = false;
    state.companiesFromCache = false;
    state.loadingCompanies = true;
    go('new-brand', { loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'close-add-popup'){
    removeOverlay('addPopupOverlay');
    return;
  }

  /* ========== Profile / Settings ========== */
  if(act === 'open-profile'){ go('settings'); return; }
  if(act === 'set-font'){
    const size = el.getAttribute('data-size');
    data.settings.fontScale = size;
    await persist();
    applyFontScale();
    render();
    return;
  }
  if(act === 'change-password'){
    const current = prompt('موجودہ مرکزی پاس ورڈ درج کریں:');
    if(current === null) return;
    if(current !== data.settings.password){
      playSound('error');
      alert('موجودہ پاس ورڈ غلط ہے');
      return;
    }
    const next = prompt('نیا مرکزی پاس ورڈ درج کریں:');
    if(!next) return;
    data.settings.password = next;
    await persist();
    playSound('success');
    alert('پاس ورڈ تبدیل ہو گیا');
    return;
  }
  if(act === 'change-bill-password'){
    const current = prompt('موجودہ بل کا پاس ورڈ درج کریں:');
    if(current === null) return;
    if(current !== data.settings.billPassword){
      playSound('error');
      alert('موجودہ پاس ورڈ غلط ہے');
      return;
    }
    const next = prompt('نیا بل پاس ورڈ درج کریں:');
    if(!next) return;
    data.settings.billPassword = next;
    await persist();
    playSound('success');
    alert('بل کا پاس ورڈ تبدیل ہو گیا');
    return;
  }
  if(act === 'clear-cache'){
    if(!confirm('کیا آپ واقعی کیچ صاف کرنا چاہتے ہیں؟ (Sheet پر اثر نہیں)')) return;
    clearCache();
    playSound('success');
    showToast('کیچ صاف ہو گیا');
    return;
  }

  /* ========== Unlock ========== */
  if(act === 'unlock'){
    const input = document.getElementById('lockPass');
    const val = input ? input.value : '';
    if(val === data.settings.password){
      unlocked = true;
      fieldErrors = {};
      playSound('success');
      render();
    } else {
      fieldErrors.lock = true;
      playSound('error');
      render();
    }
    return;
  }

  /* ========== Back ========== */
  if(act === 'back'){
    const s = state.screen;
    if(s === 'settings') go('home');
    else if(s === 'pick-company') go('home');
    else if(s === 'pick-brand'){
      state.companySearch = '';
      state.loadingCompanies = true;
      go('pick-company', { kind: state.kind, loadingCompanies: true });
      loadCompanies();
    }
    else if(s === 'form'){
      state.loadingBrands = true;
      go('pick-brand', { kind: state.kind, company: state.company, loadingBrands: true });
      loadBrands(state.company);
    }
    else if(s === 'records') go('home');
    else if(s === 'records-brand-list'){
      state.companySearch = '';
      state.loadingCompanies = true;
      go('records', { loadingCompanies: true });
      loadCompanies();
    }
    else if(s === 'records-table'){
      state.loadingBrands = true;
      go('records-brand-list', { company: state.company, loadingBrands: true });
      loadBrands(state.company);
    }
    else if(s === 'bill-dashboard') go('home');
    else if(s === 'bill-company'){
      state.billDashboardData = null;
      state.loadingBillDashboard = true;
      go('bill-dashboard', { loadingBillDashboard: true });
      loadBillDashboard();
    }
    else if(s === 'bill-form'){
      state.companySearch = '';
      state.loadingBillCompanies = true;
      go('bill-company', { loadingBillCompanies: true });
      loadBillCompanies();
    }
    else if(s === 'bill-list-company'){
      state.billDashboardData = null;
      state.loadingBillDashboard = true;
      go('bill-dashboard', { loadingBillDashboard: true });
      loadBillDashboard();
    }
    else if(s === 'bill-list'){
      state.companySearch = '';
      state.loadingBillCompanies = true;
      go('bill-list-company', { loadingBillCompanies: true });
      loadBillCompanies();
    }
    else if(s === 'new-company') go('home');
    else if(s === 'new-brand'){
      state.company = null;
      state.newBrandList = [''];
      go('home');
    }
    return;
  }

  /* ========== Pick Company ========== */
  if(act === 'pick-company'){
    state.company = el.getAttribute('data-name');
    render();
    return;
  }
  if(act === 'next-to-brand'){
    if(!state.company){
      playSound('error');
      showToast('پہلے کمپنی منتخب کریں');
      return;
    }
    state.loadingBrands = true;
    go('pick-brand', { kind: state.kind, company: state.company, loadingBrands: true });
    loadBrands(state.company);
    return;
  }
  if(act === 'retry-companies'){
    state.loadingCompanies = true;
    state.companiesError = false;
    render();
    loadCompanies();
    return;
  }

  /* ========== Pick Brand ========== */
  if(act === 'pick-brand'){
    state.brand = el.getAttribute('data-name');
    state.loadingRecent = true;
    render();
    const entries = await fetchRecentEntries(state.company, state.brand, 6);
    state.recentEntries = entries;
    state.loadingRecent = false;
    render();
    return;
  }
  if(act === 'retry-brands'){
    state.loadingBrands = true;
    state.brandsError = false;
    render();
    loadBrands(state.company);
    return;
  }
  if(act === 'next-to-form'){
    if(!state.company || !state.brand){
      playSound('error');
      showToast('کمپنی اور برانڈ منتخب کریں');
      return;
    }
    go('form', { kind: state.kind, company: state.company, brand: state.brand });
    return;
  }
  if(act === 'settle'){
    if(!confirm('کیا آپ واقعی پچھلا حساب مکمل کر کے بیلنس زیرو سے شروع کرنا چاہتے ہیں؟')) return;
    const settlement = {
      id: uid(),
      type: 'settlement',
      company: state.company,
      brand: state.brand,
      date: todayStr()
    };
    data.entries.push(settlement);
    await persist();
    playSound('success');
    showToast('پچھلا حساب مکمل کر دیا گیا');
    render();
    await sendToSheet(settlement);
    return;
  }

  /* ========== Preview Bag ========== */
  if(act === 'preview-bag'){
    const ids = ['date','gatePassNo','copyNo','bagsCount','weight','driverName','vehicleNo','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ playSound('error'); render(); return; }
    const draftEntry = { id: uid(), type: 'bag', company: state.company, brand: state.brand };
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) + parseFloat(draftEntry.weight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry;
    state.confirmMode = true;
    render();
    return;
  }

  /* ========== Preview Roll ========== */
  if(act === 'preview-roll'){
    const ids = ['date','outGatePassNo','copyNo','rollsCount','rollsWeight','driverName','vehicleNo','plantName','enteredBy'];
    collectFormValues(ids);
    if(!validate(ids)){ playSound('error'); render(); return; }
    const draftEntry = { id: uid(), type: 'roll', company: state.company, brand: state.brand };
    ids.forEach(k => draftEntry[k] = formDraft[k]);
    const bal = calcLocalBalance(state.company, state.brand) - parseFloat(draftEntry.rollsWeight || 0);
    draftEntry._balanceAfter = bal;
    state.preview = draftEntry;
    state.confirmMode = true;
    render();
    return;
  }

  /* ========== Confirm Save (Entry) ========== */
  if(act === 'confirm-save'){
    const entry = { ...state.preview };
    delete entry._balanceAfter;
    data.entries.push(entry);
    await persist();
    state.preview = null;
    formDraft = {};
    fieldErrors = {};
    playSound('success');
    showToast('محفوظ ہو رہا ہے...');
    go('pick-company', { kind: state.kind, loadingCompanies: true });
    loadCompanies();
    const result = await sendToSheet(entry);
    if(result.status === 'ok'){
      showToast('✅ اندراج محفوظ ہو گیا');
    } else {
      showToast('مقامی محفوظ، مگر Sheet تک نہیں پہنچا');
    }
    return;
  }
  if(act === 'edit-entry'){ state.preview = null; render(); return; }
  if(act === 'close-receipt'){ state.preview = null; render(); return; }

  /* ========== Records ========== */
  if(act === 'rec-open-company'){
    const company = el.getAttribute('data-name');
    state.companySearch = '';
    state.loadingBrands = true;
    go('records-brand-list', { company: company, loadingBrands: true });
    loadBrands(company);
    return;
  }
  if(act === 'rec-open-brand'){
    const brand = el.getAttribute('data-name');
    state.loadingData = true;
    go('records-table', { company: state.company, brand: brand, loadingData: true });
    const response = await fetchBrandData(state.company, brand);
    state.brandEntries = response.entries || [];
    state.entriesFromCache = response.fromCache;
    state.loadingData = false;
    render();
    return;
  }
  if(act === 'save-table'){
    saveTableAsImage();
    return;
  }

  /* ========== Long Press Options (Entry) ========== */
  if(act === 'close-options'){
    state.showEntryOptions = false;
    state.selectedEntry = null;
    removeOverlay('entryOptionsOverlay');
    render();
    return;
  }
  if(act === 'do-edit'){
    removeOverlay('entryOptionsOverlay');
    renderEditConfirm();
    return;
  }
  if(act === 'edit-confirm-yes'){
    removeOverlay('editFlowOverlay');
    renderEditNameInput();
    return;
  }
  if(act === 'edit-name-submit'){
    const inp = document.getElementById('editUserName');
    const name = inp ? inp.value.trim() : '';
    if(!name){ playSound('error'); showToast('اپنا نام لکھیں'); return; }
    state.editUserName = name;
    removeOverlay('editFlowOverlay');
    renderEditWarning();
    return;
  }
  if(act === 'edit-warning-ok'){
    await performEdit();
    return;
  }
  if(act === 'do-delete'){
    removeOverlay('entryOptionsOverlay');
    renderDeleteConfirm();
    return;
  }
  if(act === 'delete-confirm-yes'){
    removeOverlay('deleteFlowOverlay');
    renderDeleteNameInput();
    return;
  }
  if(act === 'delete-name-submit'){
    const inp = document.getElementById('deleteUserName');
    const name = inp ? inp.value.trim() : '';
    if(!name){ playSound('error'); showToast('اپنا نام لکھیں'); return; }
    state.deleteUserName = name;
    removeOverlay('deleteFlowOverlay');
    renderDeleteWarning();
    return;
  }
  if(act === 'delete-warning-ok'){
    await performDelete();
    return;
  }

  /* ========== New Company ========== */
  if(act === 'save-new-company-page'){
    await saveNewCompany();
    return;
  }

  /* ========== New Brand ========== */
  if(act === 'brand-page-pick-company'){
    state.company = el.getAttribute('data-name');
    state.newBrandList = [''];
    render();
    return;
  }
  if(act === 'add-brand-field'){
    /* ✅ موجودہ برانڈ names محفوظ کریں */
    if(!state.newBrandList) state.newBrandList = [''];
    state.newBrandList.forEach((_, i) => {
      const inp = document.getElementById('f_brand_' + i);
      if(inp) state.newBrandList[i] = inp.value;
    });
    state.newBrandList.push('');
    render();
    return;
  }
  if(act === 'remove-brand-field'){
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    if(!state.newBrandList) return;
    /* موجودہ values محفوظ کریں */
    state.newBrandList.forEach((_, i) => {
      const inp = document.getElementById('f_brand_' + i);
      if(inp) state.newBrandList[i] = inp.value;
    });
    if(state.newBrandList.length > 1){
      state.newBrandList.splice(idx, 1);
      render();
    }
    return;
  }
  if(act === 'save-new-brand-page'){
    /* values محفوظ کریں */
    if(state.newBrandList){
      state.newBrandList.forEach((_, i) => {
        const inp = document.getElementById('f_brand_' + i);
        if(inp) state.newBrandList[i] = inp.value;
      });
    }
    await saveNewBrand();
    return;
  }

  /* ========== Bill ========== */
  if(act === 'go-bill-company'){
    state.companySearch = '';
    state.loadingBillCompanies = true;
    go('bill-company', { loadingBillCompanies: true });
    loadBillCompanies();
    return;
  }
  if(act === 'go-bill-list-company'){
    state.companySearch = '';
    state.loadingBillCompanies = true;
    go('bill-list-company', { loadingBillCompanies: true });
    loadBillCompanies();
    return;
  }
  if(act === 'retry-bill-companies'){
    state.loadingBillCompanies = true;
    state.billCompaniesError = false;
    render();
    loadBillCompanies();
    return;
  }
  if(act === 'bill-pick-company'){
    const company = el.getAttribute('data-name');
    state.company = company;
    state.loadingBills = true;
    render();
    const result = await fetchBillsFromDrive(company);
    state.billPrevBalance = result.currentBalance || 0;
    state.loadingBills = false;
    formDraft = {};
    go('bill-form', { company: company });
    return;
  }
  if(act === 'preview-bill'){
    const ids = ['date','kisMalKaBill','denayThey','diye','kisNeDiya','tasfeer'];
    collectFormValues(ids);
    const required = ['date','kisMalKaBill','denayThey','diye'];
    fieldErrors = {};
    let ok = true;
    required.forEach(id => {
      if(!formDraft[id] || String(formDraft[id]).trim() === ''){ fieldErrors[id] = true; ok = false; }
    });
    if(!ok){ playSound('error'); render(); return; }
    
    const prevBal = state.billPrevBalance || 0;
    const denayThey = parseFloat(formDraft.denayThey) || 0;
    const diye = parseFloat(formDraft.diye) || 0;
    const balance = prevBal + denayThey - diye;
    
    state.billPreview = {
      company: state.company,
      date: formDraft.date,
      kisMalKaBill: formDraft.kisMalKaBill,
      denayThey: denayThey,
      diye: diye,
      kisNeDiya: formDraft.kisNeDiya || '',
      tasfeer: formDraft.tasfeer || '',
      prevBalance: prevBal,
      balance: balance
    };
    renderBillPreviewOverlay();
    return;
  }
  if(act === 'close-bill-preview'){
    removeOverlay('billPreviewOverlay');
    state.billPreview = null;
    return;
  }
  if(act === 'edit-bill-preview'){
    removeOverlay('billPreviewOverlay');
    return;
  }
  if(act === 'confirm-bill-save'){
    const p = state.billPreview;
    if(!p) return;
    removeOverlay('billPreviewOverlay');
    playSound('success');
    showToast('محفوظ ہو رہا ہے...');
    const result = await saveBillToDrive(p);
    if(result.status === 'ok'){
      /* تصویر بنائیں */
      saveBillAsImage(p);
      playSound('success');
      showToast('✅ بل محفوظ — تصویر ڈاؤن لوڈ ہو رہی ہے');
      state.billPreview = null;
      state.company = null;
      state.billDashboardData = null;
      state.loadingBillDashboard = true;
      go('bill-dashboard', { loadingBillDashboard: true });
      loadBillDashboard();
    } else {
      playSound('error');
      showToast('بل محفوظ نہیں ہوا');
    }
    return;
  }
  if(act === 'bill-list-pick-company'){
    const company = el.getAttribute('data-name');
    state.company = company;
    state.loadingBills = true;
    go('bill-list', { company: company, loadingBills: true });
    const result = await fetchBillsFromDrive(company);
    state.bills = result.bills || [];
    state.currentBalance = result.currentBalance || 0;
    state.billsFromCache = result.fromCache;
    state.billsError = result.error;
    state.loadingBills = false;
    render();
    return;
  }
  if(act === 'retry-bills'){
    state.loadingBills = true;
    state.billsError = false;
    render();
    const result = await fetchBillsFromDrive(state.company);
    state.bills = result.bills || [];
    state.currentBalance = result.currentBalance || 0;
    state.billsFromCache = result.fromCache;
    state.billsError = result.error;
    state.loadingBills = false;
    render();
    return;
  }
  if(act === 'bill-row-longpress'){
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    state.selectedBill = (state.bills || [])[idx];
    if(!state.selectedBill) return;
    renderBillOptions();
    return;
  }
  if(act === 'close-bill-options'){
    removeOverlay('billOptionsOverlay');
    state.selectedBill = null;
    return;
  }
  if(act === 'bill-do-delete'){
    const b = state.selectedBill;
    if(!b) return;
    if(!confirm('کیا آپ واقعی یہ بل ڈیلیٹ کرنا چاہتے ہیں؟')) return;
    removeOverlay('billOptionsOverlay');
    const result = await deleteBillOnDrive({
      company: state.company,
      rowIndex: b.rowIndex,
      userName: 'Admin'
    });
    if(result.status === 'ok'){
      playSound('success');
      showToast('✅ بل ڈیلیٹ ہو گیا');
      const response = await fetchBillsFromDrive(state.company);
      state.bills = response.bills || [];
      state.currentBalance = response.currentBalance || 0;
      state.selectedBill = null;
      render();
    } else {
      playSound('error');
      showToast('بل ڈیلیٹ نہیں ہوا');
    }
    return;
  }
}

/* ===================== Load Helpers ===================== */
async function loadCompanies(){
  state.loadingCompanies = true;
  render();
  const result = await fetchCompaniesFromDrive();
  state.driveCompanies = result.companies || [];
  state.companiesFromCache = result.fromCache;
  state.companiesError = result.error;
  state.loadingCompanies = false;
  render();
}

async function loadBrands(company){
  state.loadingBrands = true;
  render();
  const result = await fetchBrandsFromDrive(company);
  state.driveBrands = result.brands || [];
  state.brandsFromCache = result.fromCache;
  state.brandsError = result.error;
  state.loadingBrands = false;
  render();
}

async function loadBillCompanies(){
  state.loadingBillCompanies = true;
  render();
  const result = await fetchBillCompaniesFromDrive();
  state.driveBillCompanies = result.companies || [];
  state.billCompaniesFromCache = result.fromCache;
  state.billCompaniesError = result.error;
  state.loadingBillCompanies = false;
  render();
}

async function loadBillDashboard(){
  /* تمام کمپنیوں کے بل لے کر ڈیش بورڈ بنائیں */
  const result = await fetchBillCompaniesFromDrive();
  const companies = result.companies || [];
  
  let allBills = [];
  let currentBalance = 0;
  let weekReceived = 0;
  
  /* اس ہفتے کی تاریخیں */
  const today = nowPK();
  const dayOfWeek = today.getDay();
  const daysToWed = (dayOfWeek - 3 + 7) % 7;
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - daysToWed);
  weekStart.setHours(0, 0, 0, 0);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  weekEnd.setHours(23, 59, 59, 999);
  
  /* ہر کمپنی کے بل چیک کریں */
  for(let i = 0; i < companies.length; i++){
    const c = companies[i];
    const r = await fetchBillsFromDrive(c);
    if(r.bills){
      r.bills.forEach(b => {
        /* اس ہفتے کی تاریخ چیک کریں */
        const parts = String(b.date).split('-');
        if(parts.length === 3){
          const bDate = new Date(parts[2] + '-' + parts[1] + '-' + parts[0]);
          if(bDate >= weekStart && bDate <= weekEnd){
            allBills.push({ ...b, company: c });
            weekReceived += parseFloat(b.diye || 0);
          }
        }
      });
      currentBalance += r.currentBalance || 0;
    }
  }
  
  state.billDashboardData = {
    bills: allBills,
    currentBalance: currentBalance,
    weekReceived: weekReceived
  };
  state.loadingBillDashboard = false;
  render();
}

/* ===================== attachHandlers ===================== */
function attachHandlers(){
  /* تمام data-act والے عناصر */
  document.querySelectorAll('[data-act]').forEach(el => {
    const a = el.getAttribute('data-act');
    if(a === 'row-longpress') return;
    if(a === 'bill-row-longpress') return;
    el.addEventListener('click', onAction);
  });
  
  /* Long Press — ریکارڈ ٹیبل */
  document.querySelectorAll('[data-act="row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onRowTouchStart, { passive: true });
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
  });
  
  /* Long Press — بلز ٹیبل */
  document.querySelectorAll('[data-act="bill-row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onBillRowTouchStart, { passive: true });
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onBillRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
  });
  
  /* کمپنی سرچ */
  const cs = document.getElementById('companySearch');
  if(cs){
    cs.addEventListener('input', e => {
      state.companySearch = e.target.value;
      renderKeepFocus('companySearch');
    });
  }
  
  /* لاک Enter */
  const lockPass = document.getElementById('lockPass');
  if(lockPass){
    lockPass.addEventListener('keypress', e => {
      if(e.key === 'Enter'){
        onAction({ currentTarget: { getAttribute: () => 'unlock' } });
      }
    });
  }
  
  /* بل فارم — live بیلنس */
  const denayInput = document.getElementById('f_denayThey');
  const diyeInput = document.getElementById('f_diye');
  const updateBillPreview = () => {
    const prevBal = state.billPrevBalance || 0;
    const d = parseFloat(denayInput ? denayInput.value : 0) || 0;
    const di = parseFloat(diyeInput ? diyeInput.value : 0) || 0;
    const nb = prevBal + d - di;
    const el = document.getElementById('billPreviewBalance');
    if(el){
      el.textContent = fmt(nb);
      el.style.color = nb >= 0 ? 'var(--red)' : 'var(--green)';
    }
  };
  if(denayInput) denayInput.addEventListener('input', updateBillPreview);
  if(diyeInput) diyeInput.addEventListener('input', updateBillPreview);
}

/* ===================== Long Press — Entry ===================== */
function onRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const entries = state.brandEntries || [];
  const entry = entries[idx];
  if(!entry) return;
  
  pressedRow = row;
  row.classList.add('pressed');
  
  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(40);
    row.classList.remove('pressed');
    pressedRow = null;
    showEntryOptions(entry);
  }, 600);
  
  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseup', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
}

/* ===================== Long Press — Bill ===================== */
function onBillRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const bills = state.bills || [];
  const bill = bills[idx];
  if(!bill) return;
  
  pressedRow = row;
  row.classList.add('pressed');
  
  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(40);
    row.classList.remove('pressed');
    pressedRow = null;
    state.selectedBill = bill;
    renderBillOptions();
  }, 600);
  
  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseup', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
}

/* ===================== Show Entry Options ===================== */
function showEntryOptions(entry){
  state.selectedEntry = entry;
  state.showEntryOptions = true;
  render();
}

/* ===================== Render Keep Focus ===================== */
function renderKeepFocus(id){
  const el0 = document.getElementById(id);
  if(!el0) return;
  const val = el0.value;
  const pos = el0.selectionStart;
  render();
  const el = document.getElementById(id);
  if(el){
    el.focus();
    try{ el.setSelectionRange(pos, pos); }catch(e){}
  }
}

/* ===================== PWA ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail', err));
  });
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  showToast('ایپ انسٹال ہو گئی');
});

/* ===================== Audio Unlock ===================== */
document.addEventListener('touchstart', function unlockAudio(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }catch(e){}
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

/* ===================== Start ===================== */
loadData();
updateOfflineBanner();
</script>
