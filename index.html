<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10294D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISMAIL KNITTING">
<title>ISMAIL KNITTING</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  :root{
    --navy:#10294D;
    --navy-2:#1B3E73;
    --navy-soft:#EEF2F8;
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --border:#E4E1D6;
    --ink:#1A1A1A;
    --muted:#767267;
    --green:#1E7D4B;
    --red:#B23A2E;
    --orange:#E67E22;
    --purple:#8E44AD;
    --yellow:#F1C40F;
    --radius:16px;
    --font-scale:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Naskh Arabic', 'Segoe UI', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:calc(15px * var(--font-scale));
  }
  body.font-small{--font-scale:0.92;}
  body.font-medium{--font-scale:1;}
  body.font-large{--font-scale:1.15;}
  #app{
    max-width:480px;margin:0 auto;min-height:100vh;
    background:var(--bg);position:relative;
    padding-bottom:95px;
  }

  /* ====== Offline Banner ====== */
  .offline-banner{
    position:fixed;top:0;left:0;right:0;z-index:999;
    background:#B23A2E;color:#fff;
    padding:8px 16px;text-align:center;
    font-size:14px;font-weight:600;
    display:none;
  }
  .offline-banner.show{display:block;}

  /* ====== Topbar ====== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:12px 14px;
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    border-bottom:3px solid var(--navy-2);
    min-height:66px;
    box-shadow:0 2px 8px rgba(16,41,77,.08);
  }
  .topbar-btn{
    background:rgba(255,255,255,.12);
    border:none;color:#fff;
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    font-family:inherit;
    transition:background .15s;
  }
  .topbar-btn:active{background:rgba(255,255,255,.28);}
  .topbar-btn .material-icons-round{
    font-size:26px;color:#fff;
  }
  .topbar-btn.topbar-profile .material-icons-round{
    font-size:32px;
  }
  .topbar-title{
    flex:1;text-align:center;
    font-size:17px;font-weight:700;
    color:#fff;
    padding:0 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:.3px;
  }
  .topbar-spacer{width:44px;height:44px;flex-shrink:0;}

  /* ====== Bottom Bar ====== */
  .bottombar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:space-around;
    padding:6px 2px 8px;
    border-top:3px solid var(--navy-2);
    z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.15);
  }
  .bbtn{
    flex:1;
    background:transparent;border:none;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:2px;
    padding:6px 2px;
    cursor:pointer;
    font-family:inherit;
    transition:transform .12s;
    min-width:0;
  }
  .bbtn:active{transform:scale(.9);}
  .bbtn .material-icons-round{
    font-size:26px;
    color:#fff;
    opacity:.55;
    transition:all .2s;
  }
  .bbtn.active .material-icons-round{
    font-size:32px;
    opacity:1;
    color:#fff;
  }
  .bbtn.active{
    background:rgba(255,255,255,.08);
    border-radius:12px;
  }

  .content{padding:16px 14px 10px;}

  /* ====== ڈیش بورڈ ====== */
  .dash-section{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(16,41,77,.04);
  }
  .dash-title{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 12px 0;
    display:flex;align-items:center;gap:8px;
    letter-spacing:.2px;
  }
  .dash-title .material-icons-round{
    font-size:22px;color:var(--navy);
  }
  .dash-row{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px dashed var(--border);
    font-size:16px;
  }
  .dash-row:last-child{border-bottom:none;}
  .dash-row .label{
    color:var(--muted);
    font-size:15px;
    display:flex;align-items:center;gap:8px;
  }
  .dash-row .label .material-icons-round{
    font-size:20px;
    color:var(--muted);
  }
  .dash-row .value{
    font-weight:700;
    font-size:18px;
    font-family:'Poppins',sans-serif;
  }
  .dash-row .value.green{color:var(--green);}
  .dash-row .value.red{color:var(--red);}

  .dash-item{
    display:flex;justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .dash-item:last-child{border-bottom:none;}
  .dash-item .name{
    font-weight:600;
    color:var(--ink);
    font-size:16px;
  }
  .dash-item .info{
    color:var(--muted);
    font-size:13.5px;
    margin-top:2px;
  }
  .dash-item .amount{
    font-weight:700;
    font-family:'Poppins',sans-serif;
    font-size:17px;
    color:var(--navy);
  }

  /* ====== Buttons ====== */
  .primary-btn{
    width:100%;background:var(--navy);color:#fff;
    border:none;border-radius:12px;
    padding:16px;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s, box-shadow .15s;
    box-shadow:0 3px 10px rgba(16,41,77,.18);
    letter-spacing:.2px;
  }
  .primary-btn:active{background:var(--navy-2);box-shadow:0 1px 4px rgba(16,41,77,.25);}
  .primary-btn .material-icons-round{font-size:22px;}
  .ghost-btn{
    width:100%;background:transparent;color:var(--navy);
    border:1.5px solid var(--navy);border-radius:12px;
    padding:14px;font-size:15.5px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    letter-spacing:.2px;
  }
  .ghost-btn:active{background:var(--navy-soft);}
  .ghost-btn .material-icons-round{font-size:20px;}

  .section-title{
    font-size:16px;font-weight:700;
    color:var(--navy);margin:16px 0 10px;
    letter-spacing:.2px;
  }

  /* ====== Search Box ====== */
  .search-box{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--border);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;
    box-shadow:0 1px 4px rgba(16,41,77,.03);
  }
  .search-box .material-icons-round{
    color:var(--muted);font-size:22px;
  }
  .search-box input{
    border:none;outline:none;flex:1;background:transparent;
    font-family:inherit;font-size:16px;color:var(--ink);
    padding:2px 0;
  }

  /* ====== Sel Grid ====== */
  .sel-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:12px;margin-bottom:16px;
  }
  .sel-btn{
    background:var(--navy);color:#fff;
    border:2px solid var(--navy-2);
    border-radius:14px;padding:20px 12px;
    font-family:inherit;font-size:17px;font-weight:700;
    cursor:pointer;text-align:center;
    line-height:1.4;
    min-height:80px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, background .15s, box-shadow .15s;
    word-break:break-word;
    box-shadow:0 2px 8px rgba(16,41,77,.12);
  }
  .sel-btn:active{transform:scale(.96);}
  .sel-btn.active{
    background:#fff;color:var(--navy);
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy) inset, 0 2px 8px rgba(16,41,77,.18);
  }

  /* ====== Recent Tables (3+3 نیا) ====== */
  .recent-section-title{
    font-size:15px;font-weight:700;
    color:var(--navy);margin:18px 0 10px;
    display:flex;align-items:center;gap:8px;
    letter-spacing:.2px;
  }
  .recent-section-title .material-icons-round{
    font-size:20px;color:var(--navy);
  }
  .recent-section-title.in::before{
    content:'';display:inline-block;
    width:8px;height:8px;border-radius:50%;
    background:var(--green);margin-left:2px;
  }
  .recent-section-title.out::before{
    content:'';display:inline-block;
    width:8px;height:8px;border-radius:50%;
    background:var(--red);margin-left:2px;
  }

  .recent-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
    box-shadow:0 2px 6px rgba(16,41,77,.04);
    margin-bottom:14px;
  }
  .recent-table{
    width:100%;border-collapse:collapse;
    font-size:13px;direction:rtl;
    table-layout:fixed;
  }
  .recent-table thead tr{background:var(--navy);color:#fff;}
  .recent-table th{
    padding:10px 4px;text-align:center;font-weight:700;
    font-size:12px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .recent-table td{
    padding:11px 4px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:13.5px;
    font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .recent-table td.bal-pos{color:var(--green);font-weight:800;}
  .recent-table td.bal-neg{color:var(--red);font-weight:800;}
  .recent-table td.subtype{
    font-size:12.5px;
    color:var(--navy);
    font-weight:700;
  }

  /* ====== حساب مکمل ====== */
  .settle-top{
    width:100%;
    background:var(--navy-soft);
    color:var(--navy);
    border:1.5px dashed var(--navy-2);
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:14px;
  }
  .settle-top:active{background:#E1E8F2;}
  .settle-top .material-icons-round{font-size:22px;}

  /* ====== Skeleton ====== */
  .skeleton-card{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:16px 14px;
    margin-bottom:10px;
  }
  .skeleton-line{
    height:15px;border-radius:8px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
    margin-bottom:10px;
  }
  .skeleton-line.short{width:55%;}
  .skeleton-line.medium{width:80%;}
  .skeleton-line:last-child{margin-bottom:0;}
  @keyframes skeletonShine{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .skeleton-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
  }
  .skeleton-box{
    height:80px;border-radius:14px;
    background:linear-gradient(90deg, #EEF2F8 25%, #E4E1D6 50%, #EEF2F8 75%);
    background-size:200% 100%;
    animation:skeletonShine 1.5s infinite;
  }

  /* ====== Loading spinner ====== */
  .loading-box{text-align:center;padding:30px 20px;color:var(--muted);font-size:15px;}
  .spinner{
    display:inline-block;width:34px;height:34px;
    border:3px solid var(--border);border-top-color:var(--navy);
    border-radius:50%;animation:spin 1s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ====== Form ====== */
  .form-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:14px 12px;margin-bottom:8px;
  }
  .form-grid .field.full{grid-column:1 / -1;}
  .field{margin-bottom:0;}
  .field label{
    display:block;font-size:14px;
    color:var(--ink);margin-bottom:7px;font-weight:700;
  }
  .field label .req{color:var(--red);}
  .field input, .field select{
    width:100%;padding:14px 14px;
    border:1.5px solid var(--border);border-radius:12px;
    font-family:inherit;font-size:16px;
    background:#fff;color:var(--ink);
    font-weight:600;
  }
  .field input.err{border-color:var(--red);}
  .field .errmsg{color:var(--red);font-size:13px;margin-top:5px;}
  .field input[readonly]{
    background:#EEF2F8;
    color:var(--navy);
    cursor:not-allowed;
    font-weight:700;
  }

  /* ====== Records Table ====== */
  .records-header{
    display:flex;justify-content:space-between;
    align-items:center;margin-bottom:12px;gap:8px;
  }
  .records-header .info{font-size:15px;color:var(--muted);font-weight:600;}
  .save-btn{
    background:var(--navy-soft);color:var(--navy);
    border:1.5px solid var(--navy-2);border-radius:10px;
    padding:9px 14px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
    box-shadow:0 1px 4px rgba(16,41,77,.08);
  }
  .save-btn .material-icons-round{font-size:18px;}
  .save-btn:active{background:#E1E8F2;}

  .records-table-wrap{
    background:#fff;border:1px solid var(--border);
    border-radius:12px;overflow-x:auto;
    box-shadow:0 2px 6px rgba(16,41,77,.04);
  }
  .records-table{
    width:100%;border-collapse:collapse;
    font-size:13px;direction:rtl;
    table-layout:fixed;
  }
  .records-table thead tr{background:var(--navy);color:#fff;}
  .records-table th{
    padding:11px 4px;text-align:center;font-weight:700;
    font-size:12.5px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .records-table tbody tr{
    cursor:pointer;-webkit-tap-highlight-color:rgba(16,41,77,.1);
    user-select:none;
  }
  .records-table tbody tr:active{background:var(--navy-soft);}
  .records-table tbody tr.pressed{background:#FFE5B4 !important;}
  .records-table td{
    padding:12px 4px;color:var(--ink);
    border:1px solid var(--border);
    text-align:center;font-size:13.5px;
    font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .records-table td.bal-pos{color:var(--green);font-weight:800;}
  .records-table td.bal-neg{color:var(--red);font-weight:800;}
  .records-table td.subtype{
    font-size:12.5px;
    color:var(--navy);
    font-weight:700;
    padding:8px 2px;
  }

  /* ====== Overlays ====== */
  .overlay{
    position:fixed;inset:0;background:rgba(16,41,77,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    backdrop-filter:blur(2px);
  }
  .sheet-popup,.receipt-sheet{
    background:#fff;width:100%;max-width:480px;
    border-radius:22px 22px 0 0;
    padding:24px 20px 26px;max-height:88vh;overflow-y:auto;
    box-shadow:0 -6px 24px rgba(0,0,0,.2);
  }
  .sheet-title{
    font-size:19px;font-weight:700;color:var(--navy);
    margin-bottom:16px;text-align:center;
    letter-spacing:.2px;
  }
  .popup-btn{
    width:100%;padding:16px;margin-bottom:10px;
    border-radius:12px;font-family:inherit;
    font-size:16.5px;font-weight:700;
    cursor:pointer;border:none;
    display:flex;align-items:center;justify-content:center;gap:8px;
    letter-spacing:.2px;
  }
  .popup-btn .material-icons-round{font-size:22px;}
  .popup-btn.edit{background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(16,41,77,.18);}
  .popup-btn.delete{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(178,58,46,.22);}
  .popup-btn.cancel{background:transparent;color:var(--muted);border:1.5px solid var(--border);}

  .info-msg{
    background:#FFF8E1;border:1.5px solid #FFE082;
    border-radius:12px;padding:16px 18px;margin:14px 0;
    font-size:15px;color:#5D4037;line-height:1.9;text-align:right;
  }

  /* ====== Receipt ====== */
  .receipt-head{text-align:center;margin-bottom:8px;}
  .receipt-head .app-sub{font-size:14px;color:var(--muted);margin-top:2px;}
  .receipt-head .brand{
    font-size:20px;font-weight:800;
    color:var(--navy);
    letter-spacing:1px;
    margin-top:6px;
  }
  .receipt-head .kind{font-size:15px;color:var(--navy);margin-top:8px;font-weight:700;}
  .receipt-divider{border-top:1.5px dashed var(--border);margin:14px 0;}
  .receipt-row{
    display:flex;justify-content:space-between;
    padding:7px 0;font-size:15px;
  }
  .receipt-row .k{color:var(--muted);font-weight:600;}
  .receipt-row .v{font-weight:700;text-align:left;}
  .receipt-row .v.subtype{color:var(--navy);font-weight:800;}
  .receipt-balance{text-align:center;margin:16px 0 6px;}
  .receipt-balance .lbl{font-size:14px;color:var(--muted);}
  .receipt-balance .val{
    font-size:30px;font-weight:800;
    font-family:'Poppins',sans-serif;margin-top:4px;
  }

  /* ====== Toast ====== */
  .toast{
    position:fixed;bottom:115px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:14px 22px;
    border-radius:12px;font-size:15px;z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:88%;text-align:center;
    font-weight:600;
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{
    from{opacity:0;transform:translateX(-50%) translateY(10px);}
    to{opacity:1;transform:translateX(-50%) translateY(0);}
  }

  /* ====== Lock (PIN) ====== */
  .lock-wrap{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:30px 26px;text-align:center;
    background:linear-gradient(180deg, var(--bg) 0%, #F0EDE5 100%);
  }
  .lock-wrap .brand-title{
    font-size:22px;
    font-weight:800;
    color:var(--navy);
    letter-spacing:3px;
    margin-top:18px;
  }
  .lock-wrap .app-sub{
    font-size:14px;color:var(--muted);
    margin-top:6px;margin-bottom:30px;
    letter-spacing:.3px;
  }
  .lock-wrap input{
    width:100%;max-width:280px;text-align:center;
    letter-spacing:8px;font-size:24px;
    padding:16px;border:1.5px solid var(--border);
    border-radius:12px;margin-bottom:14px;font-family:inherit;
    font-weight:700;
    background:#fff;
    box-shadow:0 2px 8px rgba(16,41,77,.04);
  }
  .lock-wrap input:focus{
    outline:none;
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy-soft);
  }
  .lock-wrap input.err{border-color:var(--red);}
  .lock-wrap .primary-btn{max-width:280px;}
  .lock-wrap .lock-err{color:var(--red);font-size:15px;margin-bottom:10px;font-weight:600;}
  .lock-wrap .lock-hint{
    font-size:13px;color:var(--muted);
    margin-top:16px;line-height:1.7;
  }

  .empty-state{
    text-align:center;padding:24px 20px;
    color:var(--muted);font-size:14.5px;
    background:#fff;
    border:1.5px dashed var(--border);
    border-radius:12px;
    margin:8px 0;
  }

  /* ====== Settings ====== */
  .setting-row{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    box-shadow:0 1px 4px rgba(16,41,77,.03);
  }
  .setting-label{
    font-size:16px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .setting-label .material-icons-round{font-size:22px;color:var(--navy);}
  .setting-options{display:flex;gap:8px;}
  .size-btn{

<body>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📵 انٹرنیٹ نہیں ہے</div>
<script>
/* ===================== متغیرات ===================== */
const APPS_SCRIPT_URL = "/api/submit";

/* ٹوکن اور صارف کے لیے کلیدیں */
const TOKEN_KEY = "ismail_token";
const USER_KEY  = "ismail_user";

let toastTimer = null;
let longPressTimer = null;
let pressedRow = null;
let audioCtx = null;
let deferredPrompt = null;

/* لاگ اِن شدہ صارف (ٹوکن سے) */
let currentUser = null;

/* مقامی ڈیٹا (کیشے + pending) */
let data = {
  companies: [],
  entries: [],
  pending: [],
  settings: { fontScale: "medium" }
};

let unlocked = false;
let state = { screen: 'home' };
let formDraft = {};
let fieldErrors = {};

/* ===================== SVG Logo ===================== */
const svgLogo = (size)=>`
<svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="18" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<rect x="36" y="20" width="10" height="80" rx="2" fill="#10294D"/>
<path d="M96 34 C88 24 72 22 62 30 C52 38 54 50 66 55 C78 60 90 63 90 75 C90 87 76 94 64 88 C58 85 54 80 52 74"
 stroke="#10294D" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>`;

/* ===================== Material Icons ===================== */
const mi = (name)=>`<span class="material-icons-round">${name}</span>`;
const iconHome = mi('home');
const iconIn = mi('arrow_downward');
const iconAdd = mi('add_circle');
const iconOut = mi('arrow_upward');
const iconBill = mi('receipt_long');
const iconRecords = mi('list_alt');
const iconProfile = mi('account_circle');
const iconBack = mi('chevron_right');
const iconSearch = mi('search');
const iconCheck = mi('check_circle');
const iconEdit = mi('edit');
const iconDelete = mi('delete');
const iconClose = mi('close');
const iconSave = mi('save');
const iconSettle = mi('refresh');
const iconList = mi('list_alt');
const iconLock = mi('lock');
const iconFont = mi('text_fields');
const iconClear = mi('delete_sweep');
const iconBusiness = mi('business');
const iconLabel = mi('label');
const iconToday = mi('today');
const iconMoney = mi('payments');
const iconArrowDown = mi('arrow_downward');
const iconArrowUp = mi('arrow_upward');
const iconLogout = mi('logout');
const iconPerson = mi('person');
const iconEmail = mi('email');
const iconPhoto = mi('photo_camera');

/* ===================== Helpers ===================== */
function todayStr(){
  /* مقامی وقت کے مطابق تاریخ (UTC نہیں) */
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function fmt(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escAttr(s){ return esc(s); }
function safeFileName(s){ return String(s || '').replace(/[\\\/:*?"<>|]+/g,'_').trim() || 'file'; }
function isNumPositive(v){ const n = parseFloat(v); return !isNaN(n) && n > 0; }

/* ---- کمپنی کی فہرست + سرچ ---- */
function companyGridHtml(list, q, act, active){
  const ql = (q || '').trim().toLowerCase();
  const filtered = (list || []).filter(c => !ql || String(c).toLowerCase().includes(ql));
  if(filtered.length === 0) return `<div class="empty-state">کوئی کمپنی نہیں ملی</div>`;
  let html = `<div class="sel-grid">`;
  filtered.forEach(c => {
    html += `<button class="sel-btn ${c === active ? 'active' : ''}" data-act="${act}" data-name="${escAttr(c)}">${esc(c)}</button>`;
  });
  return html + `</div>`;
}
function searchBoxHtml(q, listKey, act, useActive){
  const active = useActive ? (state.company || null) : null;
  return `<div class="search-box">
    ${iconSearch}
    <input id="companySearch" data-list="${listKey}" data-actname="${act}" data-active="${useActive ? 1 : 0}" placeholder="کمپنی تلاش کریں..." value="${escAttr(q)}">
  </div>
  <div id="companyGridWrap">${companyGridHtml(state[listKey] || [], q, act, active)}</div>`;
}

/* ---- ایرر باکس ---- */
function errorBox(){
  return `<div class="info-msg" style="text-align:center;background:#FDECEA;border-color:#F5B7B1;color:#7B241C;">
    ⚠️ Sheet سے ڈیٹا نہیں آ سکا۔<br>انٹرنیٹ یا سرور چیک کریں۔
    <button class="ghost-btn" data-act="retry-load" style="color:#7B241C;border-color:#7B241C;">${iconSettle} دوبارہ کوشش کریں</button>
  </div>`;
}

/* ---- askInput / askConfirm ---- */
function askInput(title, opts){
  opts = opts || {};
  return new Promise(resolve => {
    removeOverlay('askOverlay');
    const div = document.createElement('div');
    div.className = 'overlay'; div.id = 'askOverlay'; div.style.zIndex = '90';
    div.innerHTML = `<div class="sheet-popup">
      <div class="sheet-title">${esc(title)}</div>
      <div class="field"><input id="askInputEl" type="${opts.type || 'text'}" placeholder="${escAttr(opts.placeholder || '')}" autocomplete="off"></div>
      <button class="primary-btn" id="askOk">${iconCheck} ٹھیک ہے</button>
      <button class="popup-btn cancel" id="askCancel" style="margin-top:10px;">${iconClose} منسوخ</button>
    </div>`;
    document.body.appendChild(div);
    const inp = document.getElementById('askInputEl');
    const done = v => { div.remove(); resolve(v); };
    document.getElementById('askOk').addEventListener('click', () => done(inp.value));
    document.getElementById('askCancel').addEventListener('click', () => done(null));
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') done(inp.value); });
    setTimeout(() => inp.focus(), 80);
  });
}
function askConfirm(msg){
  return new Promise(resolve => {
    removeOverlay('askOverlay');
    const div = document.createElement('div');
    div.className = 'overlay'; div.id = 'askOverlay'; div.style.zIndex = '90';
    div.innerHTML = `<div class="sheet-popup">
      <div class="info-msg" style="margin-top:0;">${esc(msg)}</div>
      <button class="primary-btn" id="askOk">${iconCheck} ہاں</button>
      <button class="popup-btn cancel" id="askCancel" style="margin-top:10px;">${iconClose} نہیں</button>
    </div>`;
    document.body.appendChild(div);
    const done = v => { div.remove(); resolve(v); };
    document.getElementById('askOk').addEventListener('click', () => done(true));
    document.getElementById('askCancel').addEventListener('click', () => done(false));
  });
}

/* ===================== آواز ===================== */
function playSound(type){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if(type === 'success'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.25);
    } else if(type === 'error'){
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.22);
    }
  }catch(e){ console.log('sound error', e); }
}

/* ===================== Token / User Management ===================== */
function saveToken(token, user){
  try{
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(USER_KEY, JSON.stringify(user || {}));
    currentUser = user || null;
  }catch(e){ console.error('token save failed', e); }
}
function getToken(){
  try{ return localStorage.getItem(TOKEN_KEY) || null; }catch(e){ return null; }
}
function getUser(){
  try{
    const raw = localStorage.getItem(USER_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearToken(){
  try{
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
  }catch(e){}
  currentUser = null;
  unlocked = false;
}
function isOwner(){
  return currentUser && currentUser.role === 'owner';
}

/* ===================== Local Storage (مقامی ڈیٹا) ===================== */
const STORE_KEY = 'ismail_ledger_data';

function normalizeData(){
  if(!data.companies) data.companies = [];
  if(!Array.isArray(data.entries)) data.entries = [];
  if(!Array.isArray(data.pending)) data.pending = [];
  if(!data.settings) data.settings = { fontScale: "medium" };
  if(!data.settings.fontScale) data.settings.fontScale = "medium";
}

/* 35 دن سے پرانی مقامی thisاں ہٹا دیں */
function pruneOldEntries(){
  const d = new Date(); d.setDate(d.getDate() - 35);
  const p = n => String(n).padStart(2,'0');
  const cut = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  data.entries = data.entries.filter(e => !e.date || String(e.date) >= cut);
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data = { ...data, ...parsed };
    }
  }catch(e){ console.error('load failed', e); }
  normalizeData();
  pruneOldEntries();
  applyFontScale();
  await checkAuthOnLoad();
  render();
  if(unlocked) flushPending(false);
}

async function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(e){ console.error('save failed', e); }
}

function applyFontScale(){
  document.body.classList.remove('font-small','font-medium','font-large');
  const scale = (data.settings && data.settings.fontScale) || 'medium';
  document.body.classList.add('font-' + scale);
}

/* ===================== لاک اسکرین (PIN) ===================== */
async function checkAuthOnLoad(){
  const token = getToken();
  const user = getUser();
  if(!token || !user){
    unlocked = false;
    currentUser = null;
    return;
  }
  /* ٹوکن کی معیاد چیک (اگر exp موجود ہو) */
  if(user.exp && Date.now() > user.exp){
    clearToken();
    unlocked = false;
    return;
  }
  currentUser = user;
  unlocked = true;
}

function renderLock(){
  const err = fieldErrors.lock;
  return `<div class="lock-wrap">
    ${svgLogo(80)}
    <div class="brand-title">ISMAIL KNITTING</div>
    <div class="app-sub">پاس کوڈ درج کریں</div>
    ${err ? `<div class="lock-err">${esc(err)}</div>` : ''}
    <input id="lockPass" type="tel" inputmode="numeric" maxlength="6" placeholder="••••" class="${err?'err':''}">
    <button class="primary-btn" data-act="unlock">${iconLock} داخل ہوں</button>
    <div class="lock-hint">
      پاس کوڈ بھول گئے؟ مالک سے رابطہ کریں
    </div>
  </div>`;
}

/* لاگ اِن — صرف PIN سے */
async function doLogin(pin){
  if(!pin || !String(pin).trim()){
    fieldErrors.lock = 'پاس کوڈ لکھیں';
    playSound('error');
    render();
    return;
  }

  const btn = document.querySelector('[data-act="unlock"]');
  if(btn){
    btn.disabled = true;
    btn.innerHTML = `${iconSettle} لاگ اِن ہو رہا ہے...`;
  }

  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: String(pin).trim() })
    });

    let result = null;
    try{ result = await res.json(); }catch(e){}

    if(!res.ok || !result || result.status !== 'ok'){
      const msg = (result && result.message) || 'PIN غلط ہے';
      fieldErrors.lock = msg;
      playSound('error');
      render();
      return;
    }

    /* کامیاب لاگ اِن */
    const user = { name: result.name, role: result.role, exp: result.exp };
    saveToken(result.token, user);

    unlocked = true;
    currentUser = user;
    fieldErrors = {};
    playSound('success');
    render();
    flushPending(false);
  } catch(err){
    fieldErrors.lock = 'نیٹ ورک کا مسئلہ — دوبارہ کوشش کریں';
    playSound('error');
    render();
  }
}

function doLogout(){
  clearToken();
  fieldErrors = {};
  playSound('success');
  render();
}

/* ===================== Remove Overlay ===================== */
function removeOverlay(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

/* ===================== Toast ===================== */
function showToast(msg){
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-el');
  if(el) el.remove();
  const div = document.createElement('div');
  div.className='toast'; div.id='toast-el'; div.textContent=msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(()=>div.remove(), 2400);
}
/* ===================== Navigation ===================== */
function go(screen, params={}){
  state = { screen, ...params };
  formDraft = {};
  fieldErrors = {};
  render();
  window.scrollTo(0,0);
}

/* ===================== Apps Script Calls (ٹوکن کے ساتھ) ===================== */
async function sendToSheet(payload){
  try{
    const token = getToken();
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{
        'Content-Type':'text/plain;charset=utf-8',
        'Authorization': 'Bearer ' + (token || '')
      },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      if(res.status === 401){
        /* ٹوکن کی معیاد ختم — دوبارہ لاگ اِن */
        clearToken();
        render();
        return { status:'error', message:'ٹوکن کی معیاد ختم — دوبارہ لاگ اِن کریں' };
      }
      return { status:'error', message: 'HTTP ' + res.status };
    }
    const j = await res.json();
    return j || { status:'error', message:'خالی جواب' };
  }catch(err){
    console.error('send error:', err);
    return { status:'error', message: String(err) };
  }
}

async function fetchCompaniesFromDrive(){
  const result = await sendToSheet({ action: 'getCompanies' });
  if(result.status === 'ok') return result.companies || [];
  return null;
}
async function fetchBrandsFromDrive(company){
  const result = await sendToSheet({ action: 'getBrands', company: company });
  if(result.status === 'ok') return result.brands || [];
  return null;
}
async function createBrandOnDrive(company, brandList){
  return await sendToSheet({ action: 'createBrandSheet', company: company, brand: brandList });
}
async function fetchRecentEntries(company, brand, limit){
  const result = await sendToSheet({ action: 'getRecentEntries', company: company, brand: brand, limit: limit || 6 });
  if(result.status === 'ok') return result.entries || [];
  return null;
}
async function fetchBrandData(company, brand){
  const result = await sendToSheet({ action: 'getBrandData', company: company, brand: brand });
  if(result.status === 'ok') return result.entries || [];
  return null;
}
async function fetchBillCompaniesFromDrive(){
  const result = await sendToSheet({ action: 'getBillCompanies' });
  if(result.status === 'ok') return result.companies || [];
  return null;
}
async function fetchBillsFromDrive(company){
  const result = await sendToSheet({ action: 'getBills', company: company });
  if(result.status === 'ok'){
    return { bills: result.bills || [], currentBalance: parseFloat(result.currentBalance) || 0 };
  }
  return null;
}
async function saveBillToDrive(payload){
  return await sendToSheet({ action: 'handleBillEntry', ...payload });
}
async function updateBillOnDrive(payload){
  return await sendToSheet({ action: 'updateBill', ...payload });
}
async function deleteBillOnDrive(payload){
  return await sendToSheet({ action: 'deleteBill', ...payload });
}

/* ===================== Pending Queue ===================== */
/* جو thisاں Sheet تک نہیں پہنچیں، انہیں دوبارہ بھیجنے کی قطار */
let flushing = false;
async function flushPending(silent){
  if(flushing || !data.pending || data.pending.length === 0) return 0;
  if(!navigator.onLine) return 0;
  if(!unlocked) return 0;
  flushing = true;
  let sent = 0;
  try{
    while(data.pending.length){
      const item = data.pending[0];
      const res = await sendToSheet(item);
      if(res && res.status === 'ok'){
        data.pending.shift();
        sent++;
        await persist();
      } else {
        break;
      }
    }
  } finally {
    flushing = false;
  }
  if(sent > 0 && !silent) showToast('✅ ' + sent + ' رکی ہوئی thisاں Sheet پر بھیج دی گئیں');
  return sent;
}

/* ===================== Offline Detection ===================== */
function updateOfflineBanner(){
  const banner = document.getElementById('offlineBanner');
  if(!banner) return;
  if(navigator.onLine){
    banner.classList.remove('show');
  } else {
    banner.classList.add('show');
  }
}
window.addEventListener('online', () => { updateOfflineBanner(); flushPending(false); });
window.addEventListener('offline', updateOfflineBanner);
document.addEventListener('DOMContentLoaded', updateOfflineBanner);

/* ===================== Long Press Helpers ===================== */
function cancelLongPress(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  if(pressedRow){ pressedRow.classList.remove('pressed'); pressedRow = null; }
}

/* ===================== Balance ===================== */
function calcLocalBalance(company, brand){
  const list = data.entries.filter(e => e.company === company && e.brand === brand);
  return calcBalanceFromEntries(list);
}
function calcBalanceFromEntries(list){
  let bal = 0;
  for(const e of list){
    if(e.type === 'settlement'){ bal = 0; continue; }
    if(e.type === 'bag') bal += parseFloat(e.weight || 0) || 0;
    if(e.type === 'roll') bal -= parseFloat(e.rollsWeight || 0) || 0;
  }
  return bal;
}
/* موجودہ بیلنس: Sheet سے (اور جو thisاں ابھی رکی ہوئی ہیں وہ بھی شامل) */
async function getCurrentBalance(company, brand){
  const sheet = await fetchBrandData(company, brand);
  if(sheet === null){
    return { balance: calcLocalBalance(company, brand), fromSheet: false };
  }
  const pend = (data.pending || []).filter(e => e.company === company && e.brand === brand);
  return { balance: calcBalanceFromEntries(sheet.concat(pend)), fromSheet: true };
}

/* ===================== Render ===================== */
function render(){
  const app = document.getElementById('app');

  if(!unlocked){
    app.innerHTML = renderLock();
    attachHandlers();
    return;
  }

  let html = topbarHtml();
  html += `<div class="content">`;

  if(state.screen === 'home') html += renderHome();
  else if(state.screen === 'settings') html += renderSettings();
  else if(state.screen === 'pick-company') html += renderPickCompany();
  else if(state.screen === 'pick-brand') html += renderPickBrand();

/* ===================== Home ڈیش بورڈ ===================== */
function renderHome(){
  const today = todayStr();
  const todayEntries = data.entries.filter(e => e.date === today);

  let todayInWeight = 0;
  let todayOutWeight = 0;
  const inByCompany = {};
  const outByCompany = {};

  todayEntries.forEach(e => {
    if(e.type === 'bag'){
      const w = parseFloat(e.weight || 0);
      todayInWeight += w;
      if(!inByCompany[e.company]) inByCompany[e.company] = { weight: 0, count: 0 };
      inByCompany[e.company].weight += w;
      inByCompany[e.company].count += parseFloat(e.bagsCount || 0);
    }
    if(e.type === 'roll'){
      const w = parseFloat(e.rollsWeight || 0);
      todayOutWeight += w;
      if(!outByCompany[e.company]) outByCompany[e.company] = { weight: 0, count: 0 };
      outByCompany[e.company].weight += w;
      outByCompany[e.company].count += parseFloat(e.rollsCount || 0);

          <div class="info">${fmt(item.count)} بوری</div>

  if(outKeys.length === 0){
    outRows = `<div class="empty-state" style="padding:14px;">آج کوئی گولہ نہیں گیا</div>`;
  } else {

        <div>
          <div class="name">${esc(k)}</div>
          <div class="info">${fmt(item.count)} گولہ</div>
        </div>
        <div class="amount">${fmt(item.weight)} kg</div>
      </div>`;
    });
  }

  return `

/* ===================== Short Date (dd-mm) ===================== */
function shortDate(d){
  if(!d) return '-';
  const s = String(d);
  /* اگر dd-MM-yyyy ہے */
  if(/^\d{2}-\d{2}-\d{4}$/.test(s)){
    const parts = s.split('-');
    return parts[0] + '-' + parts[1];
  }
  /* اگر yyyy-MM-dd ہے */
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const parts = s.split('-');
    return parts[2] + '-' + parts[1];
  }
  return s;
}

/* ===================== Load Recent (Bag + Roll, 3+3) ===================== */
async function loadRecentBoth(company, brand){
  const st = state;
  state.loadingRecent = true;
  state.recentFailed = false;
  state.recentBagEntries = [];
  state.recentRollEntries = [];
  render();

  /* ایک ہی درخواست میں مکمل ڈیٹا لو — پھر فلٹر کرو */
  const entries = await fetchBrandData(company, brand);
  if(st !== state || state.brand !== brand) return;

  if(entries === null){
    state.recentFailed = true;
    state.recentBagEntries = [];
    state.recentRollEntries = [];
    state.loadingRecent = false;
    render();
    return;
  }

  /* بیلنس چلگڑیں اور 3+3 نکالیں */
  const bags = [];
  const rolls = [];
  for(const e of entries){
    if(e.type === 'settlement') continue;
    if(e.type === 'bag'){
      bags.push({
        date: e.date,
        bagsCount: e.bagsCount,
        weight: e.weight,
        subType: e.subType,
        balance: e.balance
      });
    } else if(e.type === 'roll'){
      rolls.push({
        date: e.date,
        rollsCount: e.rollsCount,
        rollsWeight: e.rollsWeight,
        subType: e.subType,
        balance: e.balance
      });
    }
  }

  /* آخری 3 چنیں (آخر سے پہلے 3) */
  state.recentBagEntries = bags.slice(-3).reverse();
  state.recentRollEntries = rolls.slice(-3).reverse();
  state.loadingRecent = false;
  render();
}

/* extra میں 'full' = پوری چوڑائی، 'opt' = اختیاری (ستارہ نہیں) */
function field(id, label, type='text', extra=''){
  const err = fieldErrors[id];
  const isFull = extra.includes('full');
  const isOpt = extra.includes('opt');
  const cleanExtra = extra.replace('full','').replace('opt','').trim();
  const msg = (typeof err === 'string') ? err : 'یہ خانہ لازمی ہے';
  const val = (formDraft[id] === undefined || formDraft[id] === null) ? '' : formDraft[id];
  return `<div class="field ${isFull?'full':''}">
    <label>${label} ${isOpt ? '' : '<span class="req">*</span>'}</label>
    <input class="${err?'err':''}" id="f_${id}" type="${type}" value="${escAttr(val)}" ${cleanExtra}>
    ${err?`<div class="errmsg">${msg}</div>`:''}
  </div>`;
}

/* خودکار / بند خانہ (ٹوکن سے نام) */
function fieldReadonly(id, label, val, extra=''){
  const isFull = extra.includes('full');
  return `<div class="field ${isFull?'full':''}">
    <label>${label}</label>
    <input id="f_${id}" type="text" value="${escAttr(val)}" readonly>
  </div>`;
}

/* ===================== Validation ===================== */
function validate(fields, positive){
  positive = positive || [];
  fieldErrors = {};
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById('f_' + id);
    const val = el ? el.value : formDraft[id];
    if(val === undefined || val === null || String(val).trim() === ''){
      fieldErrors[id] = true;
      ok = false;
    } else if(positive.includes(id) && !isNumPositive(val)){
      fieldErrors[id] = 'صفر سے زیادہ عدد لکھیں';
      formDraft[id] = val;
      ok = false;
    } else {
      formDraft[id] = val;
    }
  });
  return ok;
}

function collectFormValues(ids){
  ids.forEach(id => {
    const el = document.getElementById('f_' + id);
    if(el) formDraft[id] = el.value;
  });
}

/* ===================== Preview Entry ===================== */
async function previewEntry(type, ids){
  const st = state;
  showToast('بیلنس چیک ہو رہا ہے...');
  const draft = { id: uid(), type: type, company: state.company, brand: state.brand };
  ids.forEach(k => draft[k] = formDraft[k]);
  /* enteredBy ٹوکن سے */
  draft.enteredBy = currentUser ? currentUser.name : '';
  const cur = await getCurrentBalance(state.company, state.brand);
  if(st !== state) return;
  const delta = type === 'bag' ? (parseFloat(draft.weight) || 0) : -(parseFloat(draft.rollsWeight) || 0);
  draft._balanceAfter = cur.balance + delta;
  if(!cur.fromSheet) draft._balanceFallback = true;
  state.preview = draft;
  state.confirmMode = true;
  render();
}

/* ===================== Records — مکمل ٹیبل ===================== */
function renderRecordsTable(){
  const company = state.company;
  const brand = state.brand;

  if(state.loadingData){
    return `<div class="loading-box"><div class="spinner"></div><div>لوڈ ہو رہا ہے...</div></div>`;
  }
  if(state.loadFailed){
    return `<div class="records-header"><div class="info">${esc(company)} — ${esc(brand)}</div></div>` + errorBox();
  }

  const entries = state.brandEntries || [];
  const currentTab = state.recordsTab || 'bag'; /* bag / roll */

  /* Sub-tabs: بورے / گولے */
  let html = `<div class="sub-tabs">
    <button class="sub-tab in ${currentTab === 'bag' ? 'active' : ''}" data-act="rec-tab-bag">${iconIn} بورے</button>
    <button class="sub-tab out ${currentTab === 'roll' ? 'active' : ''}" data-act="rec-tab-roll">${iconOut} گولے</button>
  </div>`;

  /* Header: نام + محفوظ بٹن */
  html += `<div class="records-header">
    <div class="info">${esc(company)} — ${esc(brand)}</div>
    ${entries.length > 0 ? `<button class="save-btn" data-act="save-table">${iconPhoto} محفوظ</button>` : ''}
  </div>`;

  if(entries.length === 0){
    html += `<div class="empty-state">اس برانڈ کا کوئی ریکارڈ نہیں</div>`;
    return html;
  }

  /* 5 کالم — بورے یا گولے */
  const isBag = currentTab === 'bag';
  html += `<div class="records-table-wrap"><table class="records-table"><thead><tr>
    <th style="width:18%;">تاریخ</th>
    <th style="width:18%;">${isBag ? 'بورے' : 'گولے'}</th>
    <th style="width:22%;">${isBag ? 'بوروں کا وزن' : 'گولوں کا وزن'}</th>
    <th style="width:28%;">برانڈ کی قسم</th>
    <th style="width:14%;">بیلنس</th>
  </tr></thead><tbody>`;

  /* فلٹر: صرف منتخب نوعیت کی thisاں (settlement دونوں میں) */
  entries.forEach((e, idx) => {
    /* Settlement دونوں tabs میں دکھاؤ */
    if(e.type === 'settlement'){
      html += `<tr data-act="row-longpress" data-idx="${idx}" style="background:#EEF2F8;">
        <td colspan="5" style="color:#1B3E73;font-style:italic;font-size:13px;">${esc(shortDate(e.date))} — پچھلا حصہ مکمل</td>
      </tr>`;
      return;
    }
    /* فلٹر */
    if(isBag && e.type !== 'bag') return;
    if(!isBag && e.type !== 'roll') return;

    const bal = parseFloat(e.balance || 0);
    const balClass = bal >= 0 ? 'bal-pos' : 'bal-neg';
    const count = isBag ? (esc(e.bagsCount) || '—') : (esc(e.rollsCount) || '—');
    const weight = isBag ? (esc(e.weight) || '—') : (esc(e.rollsWeight) || '—');
    const subType = esc(e.subType) || '—';

    html += `<tr data-act="row-longpress" data-idx="${idx}">
      <td>${esc(shortDate(e.date))}</td>
      <td>${count}</td>
      <td>${weight}</td>
      <td class="subtype">${subType}</td>
      <td class="${balClass}">${fmt(bal)}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

/* ===================== Build Table Rows (7 کالم — تصویر کے لیے) ===================== */
function buildTableRows(){
  const rows = [];
  (state.brandEntries || []).forEach(e => {
    if(e.type === 'settlement'){
      rows.push({ settle: true, text: (e.date || '') + ' — پچھلا حصہ مکمل' });
      return;
    }
    const bal = parseFloat(e.balance || 0);
    const isBag = e.type === 'bag';
    rows.push({
      settle: false,
      bal: bal,
      cells: [
        String(e.date || '-'),
        isBag ? String(e.bagsCount || '—') : '—',
        isBag ? String(e.weight || '—') : '—',
        !isBag ? String(e.rollsCount || '—') : '—',
        !isBag ? String(e.rollsWeight || '—') : '—',
        String(e.subType || '—'),
        fmt(bal)
      ]
    });
  });
  return rows;
}

/* ===================== Draw Table Page (7 کالم) ===================== */
function drawTablePage(pageRows, pageNo, pageCount){
  const company = state.company;
  const brand = state.brand;
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});

  const scale = 2;
  const width = 900;
  const headerHeight = 190;
  const footerHeight = 90;
  const rowHeight = 55;
  const headerRowHeight = 60;
  const totalHeight = headerHeight + 10 + headerRowHeight + (pageRows.length * rowHeight) + footerHeight + 20;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, totalHeight);

  ctx.fillStyle = '#10294D';
  ctx.fillRect(0, 0, width, headerHeight);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 34px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL KNITTING', width / 2, 60);

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText(fitText(ctx, company + ' — ' + brand, width - 60), width / 2, 110);
  if(pageCount > 1){
    ctx.font = '15px Arial';
    ctx.fillStyle = '#B9C6DC';
    ctx.fillText('صفحہ ' + pageNo + ' / ' + pageCount, width / 2, 145);
  }

  /* 7 کالم */
  const colWidths = [110, 100, 130, 100, 130, 200, 130];
  const colLabels = ['تاریخ', 'بورے', 'بوروں کا وزن', 'گولے', 'گولوں کا وزن', 'کپڑے کی قسم', 'بیلنس'];
  const tableStartY = headerHeight + 10;
  const totalTableWidth = colWidths.reduce((a,b)=>a+b, 0);
  const tableLeftX = (width - totalTableWidth) / 2;

  ctx.fillStyle = '#1B3E73';
  ctx.fillRect(tableLeftX, tableStartY, totalTableWidth, headerRowHeight);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#FFFFFF';
  let xPos = tableLeftX;
  for(let i = 0; i < colLabels.length; i++){
    ctx.strokeRect(xPos, tableStartY, colWidths[i], headerRowHeight);
    ctx.fillText(colLabels[i], xPos + colWidths[i] / 2, tableStartY + 36);
    xPos += colWidths[i];
  }

  let yPos = tableStartY + headerRowHeight;
  pageRows.forEach(r => {
    ctx.fillStyle = r.settle ? '#EEF2F8' : '#FFFFFF';
    ctx.fillRect(tableLeftX, yPos, totalTableWidth, rowHeight);
    ctx.strokeStyle = '#E4E1D6';
    ctx.strokeRect(tableLeftX, yPos, totalTableWidth, rowHeight);

    if(r.settle){
      ctx.fillStyle = '#1B3E73';
      ctx.font = 'italic 15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(r.text, width / 2, yPos + 34);
    } else {
      let cx = tableLeftX;
      for(let i = 0; i < 7; i++){
        ctx.strokeStyle = '#E4E1D6';
        ctx.strokeRect(cx, yPos, colWidths[i], rowHeight);
        if(i === 6){
          ctx.fillStyle = r.bal >= 0 ? '#1E7D4B' : '#B23A2E';
          ctx.font = 'bold 16px Arial';
        } else if(i === 5){
          ctx.fillStyle = '#10294D';
          ctx.font = 'bold 13px Arial';
        } else {
          ctx.fillStyle = '#1A1A1A';
          ctx.font = '15px Arial';
        }
        ctx.textAlign = 'center';
        ctx.fillText(fitText(ctx, r.cells[i], colWidths[i] - 10), cx + colWidths[i] / 2, yPos + 35);
        cx += colWidths[i];
      }
    }
    yPos += rowHeight;
  });

  ctx.fillStyle = '#F5F5F5';
  ctx.fillRect(0, yPos, width, footerHeight + 20);
  ctx.fillStyle = '#767267';
  ctx.font = '13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos + 34);
  ctx.fillStyle = '#999';
  ctx.font = 'bold 13px Arial';
  ctx.fillText('Generated by ISMAIL KNITTING', width / 2, yPos + 58);

  return canvas;
}

/* ===================== Save Table as Image =====================
   ✅ دو مراحل: پہلے گوگل شیٹ سے تازہ ڈیٹا لو، پھر تصویر بناؤ */
async function saveTableAsImage(){
  /* مرحلہ 1: تازہ ڈیٹا لاؤ */
  showToast('📡 تازہ ڈیٹا لوڈ ہو رہا ہے...');
  const st = state;
  const company = state.company;
  const brand = state.brand;
  const entries = await fetchBrandData(company, brand);
  if(st !== state || state.company !== company || state.brand !== brand){
    showToast('منسوخ ہو گیا');
    return;
  }
  if(entries === null){
    playSound('error');
    showToast('❌ Sheet سے رابطہ نہیں ہو سکا — دوبارہ کوشش کریں');
    return;
  }
  state.brandEntries = entries;

  /* مرحلہ 2: تصویر بناؤ */
  showToast('📸 تصویر بن رہی ہے...');
  const rows = buildTableRows();
  if(rows.length === 0){ showToast('ٹیبل نہیں ملا'); return; }

  const PER_PAGE = 50;
  const pages = [];
  for(let i = 0; i < rows.length; i += PER_PAGE) pages.push(rows.slice(i, i + PER_PAGE));
  const base = safeFileName(company + '_' + brand) + '_' + Date.now();

  let idx = 0;
  const next = () => {
    if(idx >= pages.length){
      playSound('success');
      showToast(pages.length > 1 ? ('✅ ' + pages.length + ' تصاویر محفوظ ہو گئیں') : '✅ تصویر محفوظ ہو گئی');
      return;
    }
    const canvas = drawTablePage(pages[idx], idx + 1, pages.length);
    const name = base + (pages.length > 1 ? '_' + (idx + 1) : '') + '.png';
    idx++;
    canvas.toBlob(function(blob){
      if(!blob){ showToast('تصویر نہیں بن سکی'); return; }
      triggerDownload(blob, name);
      setTimeout(next, 700);
    }, 'image/png');
  };
  next();
}

/* ===================== Download Helper ===================== */
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ===================== fitText Helper ===================== */
function fitText(ctx, text, maxW){
  text = String(text === undefined || text === null ? '' : text);
  if(ctx.measureText(text).width <= maxW) return text;
  while(text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}

/* ===================== بلز کی تصویر (نیا) ===================== */
function drawBillsPage(bills, company, pageNo, pageCount){
  const now = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Karachi'});

  const scale = 2;
  const width = 900;
  const headerHeight = 190;
  const footerHeight = 90;
  const rowHeight = 55;
  const headerRowHeight = 60;
  const totalHeight = headerHeight + 10 + headerRowHeight + (bills.length * rowHeight) + footerHeight + 20;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, totalHeight);

  ctx.fillStyle = '#10294D';
  ctx.fillRect(0, 0, width, headerHeight);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 34px Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText('ISMAIL KNITTING', width / 2, 60);

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#B9C6DC';
  ctx.fillText(fitText(ctx, company + ' — بلز', width - 60), width / 2, 110);
  if(pageCount > 1){
    ctx.font = '15px Arial';
    ctx.fillStyle = '#B9C6DC';
    ctx.fillText('صفحہ ' + pageNo + ' / ' + pageCount, width / 2, 145);
  }

  /* 5 کالم */
  const colWidths = [140, 260, 150, 150, 140];
  const colLabels = ['تاریخ', 'کس مال کا', 'دینے تھے', 'دیے', 'بیلنس'];
  const tableStartY = headerHeight + 10;
  const totalTableWidth = colWidths.reduce((a,b)=>a+b, 0);
  const tableLeftX = (width - totalTableWidth) / 2;

  ctx.fillStyle = '#1B3E73';
  ctx.fillRect(tableLeftX, tableStartY, totalTableWidth, headerRowHeight);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#FFFFFF';
  let xPos = tableLeftX;
  for(let i = 0; i < colLabels.length; i++){
    ctx.strokeRect(xPos, tableStartY, colWidths[i], headerRowHeight);
    ctx.fillText(colLabels[i], xPos + colWidths[i] / 2, tableStartY + 36);
    xPos += colWidths[i];
  }

  let yPos = tableStartY + headerRowHeight;
  bills.forEach(b => {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(tableLeftX, yPos, totalTableWidth, rowHeight);
    ctx.strokeStyle = '#E4E1D6';
    ctx.strokeRect(tableLeftX, yPos, totalTableWidth, rowHeight);

    const bal = parseFloat(b.balance || 0);
    const cells = [
      String(b.date || '-'),
      String(b.kisMalKaBill || '—'),
      fmt(b.denayThey || 0),
      fmt(b.diye || 0),
      fmt(bal)
    ];
    let cx = tableLeftX;
    for(let i = 0; i < 5; i++){
      ctx.strokeStyle = '#E4E1D6';
      ctx.strokeRect(cx, yPos, colWidths[i], rowHeight);
      if(i === 4){
        ctx.fillStyle = bal >= 0 ? '#B23A2E' : '#1E7D4B';
        ctx.font = 'bold 16px Arial';
      } else {
        ctx.fillStyle = '#1A1A1A';
        ctx.font = '15px Arial';
      }
      ctx.textAlign = 'center';
      ctx.fillText(fitText(ctx, cells[i], colWidths[i] - 10), cx + colWidths[i] / 2, yPos + 35);
      cx += colWidths[i];
    }
    yPos += rowHeight;
  });

  ctx.fillStyle = '#F5F5F5';
  ctx.fillRect(0, yPos, width, footerHeight + 20);
  ctx.fillStyle = '#767267';
  ctx.font = '13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('وقت: ' + now, width / 2, yPos + 34);
  ctx.fillStyle = '#999';
  ctx.font = 'bold 13px Arial';
  ctx.fillText('Generated by ISMAIL KNITTING', width / 2, yPos + 58);

  return canvas;
}
