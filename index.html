  const pages = [];
  for(let i = 0; i < bills.length; i += PER_PAGE) pages.push(bills.slice(i, i + PER_PAGE));
  const base = safeFileName(company + '_Bills') + '_' + Date.now();

  let idx = 0;
  const next = () => {
    if(idx >= pages.length){
      playSound('success');
      showToast(pages.length > 1 ? ('✅ ' + pages.length + ' تصاویر محفوظ ہو گئیں') : '✅ تصویر محفوظ ہو گئی');
      return;
    }
    const canvas = drawBillsPage(pages[idx], company, idx + 1, pages.length);
    const name = base + (pages.length > 1 ? '_' + (idx + 1) : '') + '.png';
    idx++;
    canvas.toBlob(function(blob){
      if(!blob){ showToast('تصویر نہیں بن سکی'); return; }
      triggerDownload(blob, name);
      setTimeout(next, 700);
    }, 'image/png');
  };
  next();
}
/* ===================== onAction ===================== */
async function onAction(e){
  const el = e.currentTarget;
  const act = el.getAttribute('data-act');

  /* ---------- Bottom Bar ---------- */
  if(act === 'bb-home'){
    go('home');
    return;
  }
  if(act === 'bb-bag'){
    go('pick-company', { kind: 'bag', loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'bb-roll'){
    go('pick-company', { kind: 'roll', loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'bb-add'){
    go('new-company');
    return;
  }
  if(act === 'bb-bill'){
    /* بل کا بٹن صرف مالک کو */
    if(!isOwner()){
      playSound('error');
      showToast('یہ کام صرف مالک کر سکتا ہے');
      return;
    }
    playSound('success');
    go('bill-dashboard');
    return;
  }
  if(act === 'bb-records'){
    go('records', { loadingCompanies: true });
    loadCompanies();
    return;
  }

  /* ---------- Retry ---------- */
  if(act === 'retry-load'){ retryLoad(); return; }

  /* ---------- Profile / Settings ---------- */
  if(act === 'open-profile'){ go('settings'); return; }
  if(act === 'set-font'){
    const size = el.getAttribute('data-size');
    data.settings.fontScale = size;
    await persist();
    applyFontScale();
    render();
    return;
  }
  if(act === 'clear-local-data'){
    const n = (data.pending || []).length;
    const msg = n > 0
      ? ('ابھی ' + n + ' thisاں Sheet پر نہیں پہنچیں، وہ محفوظ رہیں گی۔ باقی مقامی ڈیٹا صاف کریں؟ (Sheet پر اثر نہیں)')
      : 'کیا آپ واقعی سارا مقامی ڈیٹا صاف کرنا چاہتے ہیں؟ (Sheet پر اثر نہیں)';
    if(!(await askConfirm(msg))) return;
    data.entries = data.entries.filter(e2 => data.pending.some(p => p.id === e2.id));
    await persist();
    playSound('success');
    showToast('مقامی ڈیٹا صاف ہو گیا');
    render();
    return;
  }
  if(act === 'do-logout'){
    const ok = await askConfirm('کیا آپ واقعی لاگ آؤٹ کرنا چاہتے ہیں؟');
    if(!ok) return;
    doLogout();
    return;
  }

  /* ---------- Unlock (PIN سے لاگ اِن) ---------- */
  if(act === 'unlock'){
    const inp = document.getElementById('lockPass');
    const val = inp ? inp.value : '';
    await doLogin(val);
    return;
  }

  /* ---------- Back ---------- */
  if(act === 'back'){
    const s = state.screen;
    if(s === 'settings') go('home');
    else if(s === 'pick-company') go('home');
    else if(s === 'pick-brand'){
      go('pick-company', { kind: state.kind, loadingCompanies: true });
      loadCompanies();
    }
    else if(s === 'form'){
      go('pick-brand', { kind: state.kind, company: state.company, loadingBrands: true });
      loadBrands(state.company);
    }
    else if(s === 'records') go('home');
    else if(s === 'records-brand-list'){
      go('records', { loadingCompanies: true });
      loadCompanies();
    }
    else if(s === 'records-table'){
      go('records-brand-list', { company: state.company, loadingBrands: true });
      loadBrands(state.company);
    }
    else if(s === 'bill-dashboard') go('home');
    else if(s === 'bill-company') go('bill-dashboard');
    else if(s === 'bill-form'){
      go('bill-company', { loadingBillCompanies: true });
      loadBillCompanies();
    }
    else if(s === 'bill-list-company') go('bill-dashboard');
    else if(s === 'bill-list'){
      go('bill-list-company', { loadingBillCompanies: true });
      loadBillCompanies();
    }
    else if(s === 'new-company') go('home');
    else if(s === 'new-brand'){
      if(state.company){
        go('new-brand', { loadingCompanies: true });
        loadCompanies();
      } else {
        go('home');
      }
    }
    return;
  }

  /* ---------- Pick Company ---------- */
  if(act === 'pick-company'){
    state.company = el.getAttribute('data-name');
    render();
    return;
  }
  if(act === 'next-to-brand'){
    if(!state.company){ playSound('error'); showToast('پہلے کمپنی منتخب کریں'); return; }
    go('pick-brand', { kind: state.kind, company: state.company, loadingBrands: true });
    loadBrands(state.company);
    return;
  }

  /* ---------- Pick Brand (نیا: 3+3) ---------- */
  if(act === 'pick-brand'){
    const st = state;
    const brand = el.getAttribute('data-name');
    state.brand = brand;
    state.recentFailed = false;
    render();
    await loadRecentBoth(state.company, brand);
    return;
  }
  if(act === 'next-to-form'){
    if(!state.company || !state.brand){ playSound('error'); showToast('کمپنی اور برانڈ منتخب کریں'); return; }
    go('form', { kind: state.kind, company: state.company, brand: state.brand });
    return;
  }
  if(act === 'settle'){
    if(!state.brand){ playSound('error'); showToast('پہلے برانڈ منتخب کریں'); return; }
    if(!(await askConfirm('کیا آپ واقعی پچھلا حساب مکمل کر کے بیلنس زیرو سے شروع کرنا چاہتے ہیں؟'))) return;
    const company = state.company, brand = state.brand;
    const settlement = { id: uid(), type: 'settlement', company: company, brand: brand, date: todayStr() };
    data.entries.push(settlement);
    data.pending.push(settlement);
    await persist();
    playSound('success');
    showToast('پچھلا حساب مکمل کر دیا گیا');
    await flushPending(true);
    /* پچھلی thisاں تازہ کریں */
    await loadRecentBoth(company, brand);
    return;
  }

  /* ---------- Preview Bag / Roll ---------- */
  if(act === 'preview-bag'){
    const ids = ['date','gatePassNo','copyNo','bagsCount','weight','subType','driverName','vehicleNo'];
    collectFormValues(ids);
    if(!validate(ids, ['bagsCount','weight'])){ playSound('error'); render(); return; }
    await previewEntry('bag', ids);
    return;
  }
  if(act === 'preview-roll'){
    const ids = ['date','outGatePassNo','copyNo','rollsCount','rollsWeight','subType','driverName','vehicleNo','plantName'];
    collectFormValues(ids);
    if(!validate(ids, ['rollsCount','rollsWeight'])){ playSound('error'); render(); return; }
    await previewEntry('roll', ids);
    return;
  }

  /* ---------- Confirm Save (this) ---------- */
  if(act === 'confirm-save'){
    if(!state.preview) return;              /* دوبارہ دبانے سے ڈپلیکیٹ نہ بنے */
    const entry = { ...state.preview };
    delete entry._balanceAfter;
    delete entry._balanceFallback;
    state.preview = null;
    const kind = state.kind;

    data.entries.push(entry);
    data.pending.push(entry);
    await persist();

    formDraft = {};
    fieldErrors = {};
    playSound('success');
    showToast('محفوظ ہو رہا ہے...');
    go('pick-company', { kind: kind, loadingCompanies: true });
    loadCompanies();

    await flushPending(true);
    if(data.pending.some(p => p.id === entry.id)){
      showToast('this فون میں محفوظ ہے، انٹرنیٹ آتے ہی Sheet پر خود بھیج دی جائے گی');
    } else {
      showToast('✅ اندراج محفوظ ہو گیا');
    }
    return;
  }
  if(act === 'edit-entry'){ state.preview = null; render(); return; }
  if(act === 'close-receipt'){ state.preview = null; render(); return; }

  /* ---------- Records ---------- */
  if(act === 'rec-open-company'){
    const company = el.getAttribute('data-name');
    go('records-brand-list', { company: company, loadingBrands: true });
    loadBrands(company);
    return;
  }
  if(act === 'rec-open-brand'){
    const brand = el.getAttribute('data-name');
    go('records-table', { company: state.company, brand: brand, recordsTab: 'bag', loadingData: true });
    await reloadBrandEntries();
    return;
  }
  if(act === 'rec-tab-bag'){
    state.recordsTab = 'bag';
    render();
    return;
  }
  if(act === 'rec-tab-roll'){
    state.recordsTab = 'roll';
    render();
    return;
  }
  if(act === 'save-table'){
    await saveTableAsImage();
    return;
  }
  if(act === 'save-table-photo'){
    await saveTableAsImage();
    return;
  }

  /* ---------- Long Press Options (this) ---------- */
  if(act === 'close-options'){
    state.showEntryOptions = false;
    state.selectedEntry = null;
    removeOverlay('entryOptionsOverlay');
    render();
    return;
  }
  if(act === 'do-edit'){
    state.showEntryOptions = false;
    removeOverlay('entryOptionsOverlay');
    renderEditConfirm();
    return;
  }
  if(act === 'edit-confirm-yes'){
    removeOverlay('editFlowOverlay');
    renderEditNameInput();
    return;
  }
  if(act === 'edit-name-submit'){
    /* نام ٹوکن سے خودکار ہے، صرف تصدیق */
    removeOverlay('editFlowOverlay');
    renderEditWarning();
    return;
  }
  if(act === 'edit-warning-ok'){
    removeOverlay('editFlowOverlay');
    renderEditForm();
    return;
  }
  if(act === 'edit-form-submit'){
    const entry = state.selectedEntry;
    if(!entry) return;
    const defs = EDIT_FIELDS[entry.type] || [];
    const newData = { ...entry };
    let changed = false;
    for(const [id, label, type] of defs){
      const inp = document.getElementById('ef_' + id);
      if(!inp) continue;
      const val = inp.value.trim();
      if(id === 'date' && !val){ playSound('error'); showToast('تاریخ لکھیں'); return; }
      if(type === 'number' && !isNumPositive(val)){
        playSound('error'); showToast(label + ': صفر سے زیادہ عدد لکھیں'); return;
      }
      if(id === 'subType' && !val){
        playSound('error'); showToast('برانڈ کی قسم لکھیں'); return;
      }
      const old = (entry[id] === undefined || entry[id] === null) ? '' : String(entry[id]);
      if(old !== val) changed = true;
      newData[id] = val;
    }
    if(!changed){ showToast('کوئی تبدیلی نہیں کی گئی'); return; }
    state.editNewData = newData;
    await performEdit();
    return;
  }
  if(act === 'do-delete'){
    state.showEntryOptions = false;
    removeOverlay('entryOptionsOverlay');
    renderDeleteConfirm();
    return;
  }
  if(act === 'delete-confirm-yes'){
    removeOverlay('deleteFlowOverlay');
    renderDeleteNameInput();
    return;
  }
  if(act === 'delete-name-submit'){
    /* نام ٹوکن سے خودکار ہے، صرف تصدیق */
    removeOverlay('deleteFlowOverlay');
    renderDeleteWarning();
    return;
  }
  if(act === 'delete-warning-ok'){
    await performDelete();
    return;
  }

  /* ---------- نئی کمپنی / نیا برانڈ ---------- */
  if(act === 'tab-new-company'){ go('new-company'); return; }
  if(act === 'tab-new-brand'){
    go('new-brand', { loadingCompanies: true });
    loadCompanies();
    return;
  }

  if(act === 'save-new-company-page'){
    if(state.saving) return;
    const compName = document.getElementById('f_newCompanyName').value.trim().replace(/\s+/g, ' ');
    const brandName = document.getElementById('f_newBrandName').value.trim().replace(/\s+/g, ' ');
    formDraft.newCompanyName = compName;
    formDraft.newBrandName = brandName;
    if(!compName){ playSound('error'); showToast('کمپنی کا نام لکھیں'); return; }
    if(!brandName){ playSound('error'); showToast('برانڈ کا نام لکھیں'); return; }

    state.saving = true;
    try{
      showToast('چیک ہو رہا ہے...');
      const existing = await fetchCompaniesFromDrive();
      if(existing === null){
        playSound('error'); showToast('Sheet سے رابطہ نہیں ہو سکا، دوبارہ کوشش کریں'); return;
      }
      if(existing.some(c => String(c).trim().toLowerCase() === compName.toLowerCase())){
        playSound('error'); showToast('یہ کمپنی پہلے سے موجود ہے'); return;
      }
      showToast('محفوظ ہو رہا ہے...');
      const result = await createBrandOnDrive(compName, [brandName]);
      if(result.status === 'ok' && result.success !== false){
        playSound('success');
        showToast('✅ کمپنی اور برانڈ بن گئے');
        go('home');
      } else {
        playSound('error');
        showToast(result.message || 'مسئلہ ہوا');
      }
    } finally {
      state.saving = false;
    }
    return;
  }

  /* ---------- New Brand ---------- */
  if(act === 'brand-page-pick-company'){
    state.company = el.getAttribute('data-name');
    state.newBrandList = [''];
    render();
    return;
  }
  if(act === 'brand-change-company'){
    go('new-brand', { loadingCompanies: true });
    loadCompanies();
    return;
  }
  if(act === 'add-brand-field'){
    collectBrandInputs();
    state.newBrandList.push('');
    render();
    return;
  }
  if(act === 'remove-brand-field'){
    collectBrandInputs();
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    if(state.newBrandList && state.newBrandList.length > 1){
      state.newBrandList.splice(idx, 1);
      render();
    }
    return;
  }
  if(act === 'save-new-brand-page'){
    if(state.saving) return;
    collectBrandInputs();
    const seen = new Set();
    const cleanBrands = [];
    (state.newBrandList || []).forEach(b => {
      const v = String(b).trim().replace(/\s+/g, ' ');
      if(v && !seen.has(v.toLowerCase())){ seen.add(v.toLowerCase()); cleanBrands.push(v); }
    });
    if(cleanBrands.length === 0){ playSound('error'); showToast('کم از کم ایک برانڈ لکھیں'); return; }

    state.saving = true;
    try{
      showToast('چیک ہو رہا ہے...');
      const existing = await fetchBrandsFromDrive(state.company);
      if(existing === null){
        playSound('error'); showToast('Sheet سے رابطہ نہیں ہو سکا، دوبارہ کوشش کریں'); return;
      }
      const have = new Set(existing.map(b => String(b).trim().toLowerCase()));
      const fresh = cleanBrands.filter(b => !have.has(b.toLowerCase()));
      const dupCount = cleanBrands.length - fresh.length;
      if(fresh.length === 0){
        playSound('error'); showToast('یہ برانڈ اس کمپنی میں پہلے سے موجود ہیں'); return;
      }
      showToast('محفوظ ہو رہا ہے...');
      const result = await createBrandOnDrive(state.company, fresh);
      if(result.status === 'ok' && result.success !== false){
        playSound('success');
        showToast('✅ برانڈ بن گئے' + (dupCount ? (' (' + dupCount + ' پہلے سے موجود تھے)') : ''));
        go('home');
      } else {
        playSound('error');
        showToast(result.message || 'مسئلہ ہوا');
      }
    } finally {
      state.saving = false;
    }
    return;
  }

  /* ---------- Bill ---------- */
  if(act === 'go-bill-company'){
    go('bill-company', { loadingBillCompanies: true });
    loadBillCompanies();
    return;
  }
  if(act === 'go-bill-list-company'){
    go('bill-list-company', { loadingBillCompanies: true });
    loadBillCompanies();
    return;
  }
  if(act === 'bill-pick-company'){
    const company = el.getAttribute('data-name');
    showToast('پچھلا بیلنس چیک ہو رہا ہے...');
    const result = await fetchBillsFromDrive(company);
    if(result === null){
      playSound('error');
      showToast('Sheet سے پچھلا بیلنس نہیں مل سکا، دوبارہ کوشش کریں');
      return;
    }
    go('bill-form', { company: company, billPrevBalance: result.currentBalance || 0 });
    return;
  }
  if(act === 'preview-bill'){
    const ids = ['date','kisMalKaBill','denayThey','diye','kisNeDiya','tasfeer'];
    collectFormValues(ids);
    const required = ['date','kisMalKaBill','denayThey','diye'];
    fieldErrors = {};
    let ok = true;
    required.forEach(id => {
      if(formDraft[id] === undefined || formDraft[id] === null || String(formDraft[id]).trim() === ''){
        fieldErrors[id] = true; ok = false;
      }
    });
    ['denayThey','diye'].forEach(id => {
      if(!fieldErrors[id]){
        const n = parseFloat(formDraft[id]);
        if(isNaN(n) || n < 0){ fieldErrors[id] = 'درست عدد لکھیں (منفی نہیں)'; ok = false; }
      }
    });
    if(ok && (parseFloat(formDraft.denayThey) || 0) === 0 && (parseFloat(formDraft.diye) || 0) === 0){
      fieldErrors.denayThey = 'دینے تھے یا دیے میں سے ایک صفر سے زیادہ ہو';
      ok = false;
    }
    if(!ok){ playSound('error'); render(); return; }

    const prevBal = state.billPrevBalance || 0;
    const denayThey = parseFloat(formDraft.denayThey) || 0;
    const diye = parseFloat(formDraft.diye) || 0;
    const balance = prevBal + denayThey - diye;

    state.billPreview = {
      company: state.company,
      date: formDraft.date,
      kisMalKaBill: formDraft.kisMalKaBill,
      denayThey: denayThey,
      diye: diye,
      kisNeDiya: formDraft.kisNeDiya || '',
      tasfeer: formDraft.tasfeer || '',
      prevBalance: prevBal,
      balance: balance
    };
    renderBillPreviewOverlay();
    return;
  }
  if(act === 'close-bill-preview' || act === 'edit-bill-preview'){
    removeOverlay('billPreviewOverlay');
    state.billPreview = null;
    return;
  }
  if(act === 'confirm-bill-save'){
    const p = state.billPreview;
    if(!p) return;
    state.billPreview = null;
    removeOverlay('billPreviewOverlay');
    showToast('محفوظ ہو رہا ہے...');
    const result = await saveBillToDrive(p);
    if(result.status === 'ok'){
      saveBillAsImage(p);
      playSound('success');
      showToast('✅ بل محفوظ ہو گیا — تصویر ڈاؤن لوڈ ہو رہی ہے');
      state.company = null;
      go('home');
    } else {
      playSound('error');
      showToast('بل محفوظ نہیں ہوا — دوبارہ کوشش کریں');
    }
    return;
  }
  if(act === 'bill-list-pick-company'){
    const company = el.getAttribute('data-name');
    go('bill-list', { company: company, loadingBills: true });
    await reloadBills();
    return;
  }
  if(act === 'save-bills-photo'){
    await saveBillsAsImage();
    return;
  }
  if(act === 'close-bill-options'){
    removeOverlay('billOptionsOverlay');
    state.selectedBill = null;
    return;
  }
  if(act === 'bill-do-delete'){
    const b = state.selectedBill;
    if(!b) return;
    if(!(await askConfirm('کیا آپ واقعی یہ بل ڈیلیٹ کرنا چاہتے ہیں؟'))) return;
    removeOverlay('billOptionsOverlay');
    const result = await deleteBillOnDrive({
      company: state.company,
      rowIndex: b.rowIndex
    });
    state.selectedBill = null;
    if(result.status === 'ok'){
      playSound('success');
      showToast('✅ بل ڈیلیٹ ہو گیا');
    } else {
      playSound('error');
      showToast('بل ڈیلیٹ نہیں ہوا');
    }
    await reloadBills();
    return;
  }
}

/* ===================== Edit / Delete (this) ===================== */
async function performEdit(){
  const entry = state.selectedEntry;
  const newData = state.editNewData || entry;
  removeOverlay('editFlowOverlay');

  showToast('ترمیم بھیجی جا رہی ہے...');

  const result = await sendToSheet({
    action: 'update',
    company: state.company,
    brand: state.brand,
    type: entry.type,
    entryId: entry.id,
    oldData: entry,
    newData: newData
  });

  state.showEntryOptions = false;
  state.selectedEntry = null;
  state.editNewData = null;

  if(result.status === 'ok'){
    const i = data.entries.findIndex(x => x.id === entry.id);
    if(i >= 0){ data.entries[i] = { ...data.entries[i], ...newData }; await persist(); }
    playSound('success');
    showToast('✅ this ترمیم ہو گئی');
  } else {
    playSound('error');
    showToast('❌ ترمیم نہیں ہو سکی');
  }
  await reloadBrandEntries();
}

async function performDelete(){
  const entry = state.selectedEntry;
  removeOverlay('deleteFlowOverlay');

  showToast('حذف بھیجا جا رہا ہے...');

  const result = await sendToSheet({
    action: 'delete',
    company: state.company,
    brand: state.brand,
    type: entry.type,
    entryId: entry.id,
    oldData: entry
  });

  state.showEntryOptions = false;
  state.selectedEntry = null;

  if(result.status === 'ok'){
    data.entries = data.entries.filter(x => x.id !== entry.id);
    await persist();
    playSound('success');
    showToast('✅ this حذف ہو گئی');
  } else {
    playSound('error');
    showToast('❌ حذف نہیں ہو سکی');
  }
  await reloadBrandEntries();
}

/* ===================== attachHandlers ===================== */
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el => {
    const a = el.getAttribute('data-act');
    if(a === 'row-longpress') return;
    if(a === 'bill-row-longpress') return;
    el.addEventListener('click', onAction);
  });

  /* Long Press — ریکارڈ ٹیبل */
  document.querySelectorAll('[data-act="row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onRowTouchStart, { passive: true });
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
    row.addEventListener('contextmenu', ev => ev.preventDefault());
  });

  /* Long Press — بلز ٹیبل */
  document.querySelectorAll('[data-act="bill-row-longpress"]').forEach(row => {
    row.addEventListener('touchstart', onBillRowTouchStart, { passive: true });
    row.addEventListener('touchend', cancelLongPress);
    row.addEventListener('touchmove', cancelLongPress);
    row.addEventListener('touchcancel', cancelLongPress);
    row.addEventListener('mousedown', onBillRowTouchStart);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
    row.addEventListener('contextmenu', ev => ev.preventDefault());
  });

  /* کمپنی سرچ */
  const cs = document.getElementById('companySearch');
  if(cs){
    cs.addEventListener('input', ev => {
      state.companySearch = ev.target.value;
      const wrap = document.getElementById('companyGridWrap');
      if(!wrap) return;
      const active = cs.dataset.active === '1' ? (state.company || null) : null;
      wrap.innerHTML = companyGridHtml(state[cs.dataset.list] || [], state.companySearch, cs.dataset.actname, active);
      wrap.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', onAction));
    });
  }

  /* لاک اسکرین: Enter سے کھلے */
  const lp = document.getElementById('lockPass');
  if(lp){
    lp.addEventListener('keydown', ev => {
      if(ev.key === 'Enter'){
        ev.preventDefault();
        const btn = document.querySelector('[data-act="unlock"]');
        if(btn) btn.click();
      }
    });
  }

  /* بل فارم: ٹائپ کرتے ہی نیا بیلنس اپڈیٹ */
  const bd = document.getElementById('f_denayThey');
  const bp = document.getElementById('f_diye');
  const bl = document.getElementById('billPreviewBalance');
  if(bd && bp && bl){
    const upd = () => {
      formDraft.denayThey = bd.value;
      formDraft.diye = bp.value;
      const prev = state.billPrevBalance || 0;
      bl.textContent = fmt(prev + (parseFloat(bd.value) || 0) - (parseFloat(bp.value) || 0));
    };
    bd.addEventListener('input', upd);
    bp.addEventListener('input', upd);
  }
}

/* ===================== Long Press — this ===================== */
function onRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const entries = state.brandEntries || [];
  const entry = entries[idx];
  if(!entry) return;

  pressedRow = row;
  row.classList.add('pressed');

  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(40);
    row.classList.remove('pressed');
    pressedRow = null;
    showEntryOptions(entry);
  }, 600);

  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseup', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
}

/* ===================== Long Press — Bill ===================== */
function onBillRowTouchStart(e){
  const row = e.currentTarget;
  const idx = parseInt(row.getAttribute('data-idx'), 10);
  const bills = state.bills || [];
  const bill = bills[idx];
  if(!bill) return;

  pressedRow = row;
  row.classList.add('pressed');

  longPressTimer = setTimeout(() => {
    if(navigator.vibrate) navigator.vibrate(40);
    row.classList.remove('pressed');
    pressedRow = null;
    state.selectedBill = bill;
    renderBillOptions();
  }, 600);

  row.addEventListener('touchend', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseup', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
  row.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); row.classList.remove('pressed'); }, { once: true });
}

/* ===================== Show Entry Options ===================== */
function showEntryOptions(entry){
  state.selectedEntry = entry;
  state.showEntryOptions = true;
  render();
}

/* ===================== PWA Setup ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  showToast('ایپ انسٹال ہو گئی');
});

/* ===================== Audio Unlock (First Tap) ===================== */
document.addEventListener('touchstart', function unlockAudio(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }catch(e){}
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

/* ===================== Start ===================== */
loadData();
updateOfflineBanner();
</script>
